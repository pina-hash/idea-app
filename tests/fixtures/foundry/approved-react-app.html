<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Timer</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0b0f14; color: #e6edf3; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 2rem 1rem; }
  .card { background: #141b23; border: 1px solid #223; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
  button { font: inherit; padding: .6rem 1rem; border-radius: 8px; border: 1px solid #2b3a4a; background: #1b2530; color: #e6edf3; cursor: pointer; }
  button:hover { background: #223041; }
  .big { font-size: 3rem; font-variant-numeric: tabular-nums; margin: .5rem 0; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .muted { color: #8aa0b4; font-size: .9rem; }
  ul { padding-left: 1.1rem; }
  li { margin: .25rem 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

function Timer({ minutes, onDone }) {
  const [left, setLeft] = useState(minutes * 60);
  const [running, setRunning] = useState(false);
  const tick = useRef(null);
  useEffect(() => {
    if (!running) return;
    tick.current = setInterval(() => {
      setLeft((v) => {
        if (v <= 1) { clearInterval(tick.current); setRunning(false); onDone && onDone(); return 0; }
        return v - 1;
      });
    }, 1000);
    return () => clearInterval(tick.current);
  }, [running, onDone]);
  const mm = String(Math.floor(left / 60)).padStart(2, '0');
  const ss = String(left % 60).padStart(2, '0');
  return (
    <div className="card">
      <div className="muted">Focus block</div>
      <div className="big">{mm}:{ss}</div>
      <div className="row">
        <button onClick={() => setRunning((r) => !r)}>{running ? 'Pause' : 'Start'}</button>
        <button onClick={() => { setRunning(false); setLeft(minutes * 60); }}>Reset</button>
      </div>
    </div>
  );
}

function Panel0({ items, onPick }) {
  const [open, setOpen] = useState(false);
  const total = items.reduce((a, b) => a + (b.weight || 0), 0);
  const pretty = useCallback((n) => n.toFixed(1) + ' pts', []);
  return (
    <div className="card">
      <div className="row">
        <strong>Section 0</strong>
        <span className="muted">{pretty(total)}</span>
        <button onClick={() => setOpen(!open)}>{open ? 'Hide' : 'Show'}</button>
      </div>
      {open && (
        <ul>
          {items.map((it, k) => (
            <li key={k} onClick={() => onPick && onPick(it)}>{it.label} <span className="muted">{pretty(it.weight || 0)}</span></li>
          ))}
        </ul>
      )}
    </div>
  );
}

function App() {
  const [log, setLog] = useState([]);
  const items = [{ label: 'Read', weight: 2 }, { label: 'Notes', weight: 3 }, { label: 'Practice', weight: 5 }];
  return (
    <div className="wrap">
      <h1>Study Timer</h1>
      <Timer minutes={25} onDone={() => setLog((l) => [...l, new Date().toLocaleTimeString()])} />
      <Panel0 items={items} onPick={(it) => setLog((l) => [...l, it.label])} />
      <div className="card">
        <div className="muted">Log</div>
        <ul>{log.map((e, i) => <li key={i}>{e}</li>)}</ul>
      </div>
    </div>
  );
}
