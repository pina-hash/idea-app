<svg class="fg" viewBox="0 0 360 160" role="img" aria-label="A slice through the bowl. Twice as wide halves the bending stress; twice as deep cuts it to a quarter."><text class="wt" x="6" y="18" text-anchor="start">A SLICE THROUGH THE BOWL</text><rect class="bd" x="40.0" y="82" width="30" height="30" rx="2"/><text class="tf" x="55" y="134" text-anchor="middle">V1</text><text class="tx" x="55" y="152" text-anchor="middle">1x the stress</text><rect class="bd" x="135.0" y="82" width="60" height="30" rx="2"/><text class="tf" x="165" y="134" text-anchor="middle">Twice as wide</text><text class="tx" x="165" y="152" text-anchor="middle">1/2 the stress</text><rect class="bdg" x="260.0" y="52" width="30" height="60" rx="2"/><text class="tb" x="275" y="134" text-anchor="middle">Twice as deep</text><text class="tbg" x="275" y="152" text-anchor="middle">1/4 the stress</text><line class="dml" x1="318" y1="52" x2="318" y2="112"/><text class="txs" x="326" y="86" text-anchor="start">depth</text></svg>