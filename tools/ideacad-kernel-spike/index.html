<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
	<title>IdeaCAD kernel spike</title>
	<style>
	@font-face{font-family:Rajdhani;src:url('/fonts/rajdhani-latin-500-normal.woff2')}@font-face{font-family:Mono;src:url('/fonts/share-tech-mono-latin-400-normal.woff2')}
	*{box-sizing:border-box}body{margin:0;background:#15191d;color:#e6e9ec;font:18px Rajdhani,sans-serif}main{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:#22272c;border-bottom:1px solid #6b757d}h1{font-size:24px;margin:0;margin-right:auto}header span{font:12px Mono,monospace;color:#a4adb5}button{font:16px Rajdhani,sans-serif;min-height:44px;padding:0 16px;background:#2b3137;border:1px solid #6b757d;border-radius:4px;color:inherit;cursor:pointer}button:hover,button:focus-visible{border-color:#83edac;background:#35463c}#stage{position:relative;min-height:0;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#readout{position:absolute;display:none;padding:6px 10px;border:1px solid #83edac;border-radius:4px;background:#15191d;pointer-events:none;font:16px Mono,monospace}footer{padding:10px 20px;display:flex;gap:24px;flex-wrap:wrap;border-top:1px solid #6b757d;font:12px Mono,monospace;color:#a4adb5}#error{color:#f09b9f}#value{position:absolute;display:none;width:130px;min-height:44px;background:#15191d;color:#e6e9ec;border:1px solid #83edac;font:16px Mono,monospace;padding:8px}@media(max-width:600px){header{gap:8px;padding:8px}header span{display:none}footer{font-size:11px;gap:10px;padding:8px}}
	</style>
	<script type="importmap">{"imports":{"three":"/three/three.module.js"}}</script>
</head>
<body><main><header><h1>IdeaCAD</h1><span>KERNEL SPIKE · LOCAL ONLY</span><button id="reset" title="Box with hole. Rebuild the measured solid.">↻ Reset</button><button id="fit" title="Fit. Bring the whole model into view.">⊡ Fit</button></header><div id="stage"><canvas tabindex="0" aria-label="Solid modeling viewport"></canvas><output id="readout"></output><input id="value" aria-label="Exact push distance" type="text" inputmode="decimal"></div><footer><span id="status">Loading solid kernel…</span><span id="volume"></span><span id="selection"></span><span id="error" role="alert"></span></footer></main><script type="module" src="./viewer.mjs"></script></body>
</html>
