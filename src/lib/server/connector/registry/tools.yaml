# THE CONNECTOR'S OWN TOOLS, keyed by the tool name Claude sees.
#
# Every tool the connector lists comes from the registry: these facade tools,
# plus every function entry marked `surface: tool` in the other files, plus
# `site_find_tool` and `site_call`, which reach every `surface: call` entry.
# A facade is a voice-shaped tool over one or more registry functions; the
# functions it writes through are named in `uses`, and each write takes that
# function's own level, preview and undo from its entry. A facade's level is
# the highest level of anything it writes.
#
# Wording rules (tests/connector-registry.test.ts holds them): `describe` is
# one sentence in Mr. Pina's words, under 200 characters; `say` carries three
# to six ways he would phrase it; every argument has a description; no table
# name, column name or internal identifier appears anywhere here. Every
# argument named `student`, `class`, `post` or `due` is resolved the same way
# everywhere (find_student, his own classes, his own posts, school-day dates in
# Los Angeles time).

find_student:
  facade: true
  level: read
  uses: [classroom_section_roster]
  describe: Find a student in one of your classes by first name, last name or "Daniel R", and say which class they are in.
  say:
    - find Mateo
    - who is Daniel R
    - is there a Leo in Block 2
    - which class is Ana Reyes in
  args:
    name: {type: string, required: true, describe: "The name as you said it: first name, last name, both, or a first name and a last initial."}
    class: {type: string, describe: "Only look in this class, like 209H Block 2. Leave it out to look in every class you teach."}

list_classes:
  facade: true
  level: read
  uses: []
  describe: List the classes you teach, with the course and block of each.
  say:
    - what classes do I have
    - list my classes
    - which blocks do I teach this term

list_posts:
  facade: true
  level: read
  uses: []
  describe: List what is posted in one of your classes, with each post's kind, due date, unit and whether students can see it, and the class's units with their ids.
  say:
    - what's posted in 209H Block 1
    - what's due this week in IDEA100
    - show me the assignments in Block 2
    - what drafts do I have in Block 4
  args:
    class: {type: string, required: true, resolve: class, describe: "The class, like 209H Block 1 or IDEA100 Block 3."}
    due: {type: string, describe: "Only posts due in this window: this week, next week, today, or overdue."}
    kind: {type: string, describe: "Only this kind of post: assignment, material or announcement."}

get_post:
  facade: true
  level: read
  uses: []
  describe: Show one post in full, with its points, due date, rubric, files, unit and classes; an HTML assignment's stored document too (sha256, saved time, versions), drafts included.
  say:
    - show me Tolerance Check
    - what's on the Shop Fix post
    - read me the DFM worksheet's rubric
    - read the live HTML of IDEA-Blade 01
  args:
    post: {type: string, required: true, resolve: post, describe: "The post's title as you said it, or part of it."}
    class: {type: string, describe: "The class it is in, when the same title is in more than one."}
    document: {type: boolean, describe: "True to include an HTML assignment's stored HTML itself, drafts included."}
    version: {type: integer, describe: "An earlier version number of an HTML assignment's document to read instead of the live one."}
    source: {type: boolean, describe: "True to include the kit source stored with an HTML assignment."}

create_post:
  facade: true
  level: undo
  uses: [classroom_create_item, classroom_quick_post_create, classroom_quick_post_set_important]
  describe: Post an assignment, material, announcement or a short notice to one or more of your classes; a notice can be important and can carry a named link.
  say:
    - post an announcement to all 209H sections, bring safety glasses tomorrow
    - create an assignment in Block 2 called Tolerance Check, 20 points, due Friday at 11:59
    - put up a notice in Block 1 until the end of the day, the shop is closed
    - add a material called Fillet Reference to IDEA100
  args:
    classes: {type: array, items: string, required: true, resolve: class, describe: "Every class to post to, like 209H Block 2, or all 209H for every section of a course."}
    kind: {type: string, required: true, enum: [assignment, material, announcement, notice], describe: "assignment, material, announcement, or notice for a short message at the top of the class page."}
    title: {type: string, describe: "The title. An assignment or material needs one; an announcement or notice does not."}
    body: {type: string, describe: "The text of the post, as plain text."}
    points: {type: integer, describe: "Points, for an assignment."}
    due: {type: string, resolve: due, describe: "When an assignment is due: Friday, tomorrow 3pm, Oct 24 11:59pm. A day with no time means 11:59 PM."}
    published: {type: boolean, describe: "False to save it as a draft students cannot see yet. Posts are visible by default."}
    until: {type: string, resolve: due, describe: "For a notice: when it comes down, like end of day or Friday 3pm. Leave it out for the end of the school day."}
    important: {type: boolean, describe: "For a notice: true to mark it important so it stands out at the top."}
    link: {type: string, describe: "For a notice: a web address to put on it as a key."}
    linkName: {type: string, describe: "For a notice: what the link key says after Open, like Tournament bracket."}
    category: {type: string, describe: "For an assignment or material: its grading category, like Design."}

set_points:
  facade: true
  level: undo
  uses: [classroom_update_item]
  describe: Change how many points an assignment is worth.
  say:
    - make it worth 25
    - change Tolerance Check to 30 points
    - set the Shop Fix to 20 points
  args:
    post: {type: string, required: true, resolve: post, describe: "The assignment's title as you said it."}
    points: {type: integer, required: true, describe: "The new number of points."}
    class: {type: string, describe: "The class it is in, when the same title is in more than one."}

set_due:
  facade: true
  level: undo
  uses: [classroom_update_item, classroom_set_student_due]
  describe: Change when an assignment is due, for everyone or only some students, by school days out, and mark a student absent with time left.
  say:
    - move the due date to Monday
    - make Tolerance Check due Friday at 3
    - push the Shop Fix to next Wednesday
    - Mateo was out two days with an excused absence, move his Shop Fix due date
    - put an A for absent on Leo and Ana, they still have time
  args:
    post: {type: string, required: true, resolve: post, describe: "The assignment's title as you said it."}
    due: {type: string, resolve: due, describe: "The new due time: Monday, Friday 3pm, Oct 24 11:59pm, or none to remove it. With students, only theirs moves."}
    class: {type: string, describe: "The class it is in, when the same title is in more than one."}
    students:
      type: array
      describe: "Only these students: each with the student and any of daysOut (school days out, which moves their due date), absent (true for an A, still has time), or clear (back to the post's date)."
      items:
        type: object
        properties:
          student: {type: string, describe: "The student, as you said the name."}
          daysOut: {type: integer, describe: "School days out with an excused absence; their due date moves by that many school days."}
          absent: {type: boolean, describe: "True for absent and still has time, the A in FACTS; false to take it off."}
          clear: {type: boolean, describe: "True to put them back on the post's own due date."}

set_rubric:
  facade: true
  level: undo
  uses: [classroom_set_rubric]
  describe: Set the grading rubric on an assignment, one row per criterion with its points.
  say:
    - set the rubric on Tolerance Check, Accuracy 10, Drawing 10, Reflection 5
    - give the Shop Fix a rubric with Function 15 and Finish 5
    - replace the rubric on the DFM worksheet
  args:
    post: {type: string, required: true, resolve: post, describe: "The assignment's title as you said it."}
    criteria:
      type: array
      required: true
      describe: "Each criterion with its points, like Accuracy 10. Optional levels give the score bands from the top level down to zero."
      items:
        type: object
        properties:
          name: {type: string, describe: "What is being graded, like Accuracy."}
          points: {type: number, describe: "The most points this criterion is worth."}
          levels:
            type: array
            describe: "Optional score bands, best first, each with a label, points and what earns it."
            items:
              type: object
              properties:
                label: {type: string, describe: "The band's name, like Exceeds."}
                points: {type: number, describe: "Points for this band."}
                descriptor: {type: string, describe: "What earns this band."}
    class: {type: string, describe: "The class it is in, when the same title is in more than one."}

set_published:
  facade: true
  level: undo
  uses: [classroom_set_published]
  describe: Show a post to students or hide it again as a draft.
  say:
    - publish it
    - unpublish Tolerance Check
    - hide the Shop Fix from students
    - make the reflection visible
  args:
    post: {type: string, required: true, resolve: post, describe: "The post's title as you said it."}
    published: {type: boolean, required: true, describe: "True to show it to students, false to hide it as a draft."}
    class: {type: string, describe: "The class it is in, when the same title is in more than one."}

replace_html_assignment:
  facade: true
  level: undo
  uses: [classroom_set_html_assignment, classroom_set_rubric, classroom_html_retire_blocks, classroom_html_set_source]
  describe: Replace an HTML assignment's document with a new file made from the live copy it names; an answered question it drops is refused, or retired with retire set.
  say:
    - replace the Shop Fix HTML in Block 1 with the file I'm sending
    - take that question out, some students already answered it, deal with that
    - upload this new version of the DFM worksheet
  args:
    post: {type: string, required: true, resolve: post, describe: "The assignment's title as you said it."}
    html: {type: string, describe: "The whole new HTML document, exactly as the file holds it. For a big file, use upload instead."}
    upload: {type: string, describe: "An upload holding the file, from start upload, for a file too big to send whole."}
    retire: {type: boolean, describe: "True to retire any answered question the new file drops, instead of refusing."}
    source: {type: string, describe: "The kit source the page was built from, the whole .src.html file, stored with the post so it can be rebuilt on a newer kit."}
    sourceUpload: {type: string, describe: "An upload holding the source file, for a source too big to send whole."}
    basis: {type: string, describe: "Which live copy this file was made from: the sha256 that reading the post returns for its document, or its saved time. Required once the post has a document; a replace made from an older copy is refused."}
    filename: {type: string, describe: "The file's name, like shop-fix.html."}
    class: {type: string, describe: "The class it is in, when the same title is in more than one."}

read_grades:
  facade: true
  level: read
  uses: [classroom_needs_grading]
  describe: Show an assignment's work and scores; or, with no assignment, everything past due with saved work and no grade yet, in every class but the ones left out.
  say:
    - who hasn't turned in Shop Fix in Block 2
    - show me the grades on Tolerance Check
    - who still needs grading on the DFM worksheet
    - I need to catch up on grading for all my classes, except for 209H Block 4
    - what still needs grading
  args:
    post: {type: string, resolve: post, describe: "The assignment's title as you said it. Leave it out for everything that needs grading."}
    class: {type: string, resolve: class, describe: "Only this class, like 209H Block 2."}
    except: {type: array, items: string, describe: "With no assignment: classes to leave out, as he said them, like 209H Block 4."}

read_answers:
  facade: true
  level: read
  uses: []
  describe: Read what a student answered on an assignment, or everyone's at once, with a link to every file and picture they handed in.
  say:
    - what did Mateo answer on question 3 of the DFM worksheet
    - read me Leo's answers on the Shop Fix
    - show everyone's answers to question 2 of the Blade worksheet
    - show me the sketch photos on the Blade worksheet
  args:
    post: {type: string, required: true, resolve: post, describe: "The assignment's title as you said it."}
    student: {type: string, resolve: student, describe: "The student, as you said the name. Leave it out for every student's answers."}
    question: {type: string, describe: "One question: its number, its name, or words from its prompt. Leave it out for every answer."}
    class: {type: string, describe: "The class it is in, when the same title is in more than one."}

# FULL GRADING FROM A CHAT (ledger 0438, feedback 6db4fbe5, gap 8fd1c0bb):
# one read carries a whole assignment and class; grade takes many at once.
grading_packet:
  facade: true
  level: read
  uses: []
  describe: Everything needed to grade one assignment in one read, the questions, rubric, worksheet, and every student's answers, file links, status, grade and notes.
  say:
    - get the grading packet for the Blade worksheet in Block 2
    - I want to grade Shop Fix, pull everything
    - show me all the turned in work on Tolerance Check
    - load the Unit 4 team assignment for grading
  args:
    post: {type: string, required: true, resolve: post, describe: "The assignment's title as you said it."}
    class: {type: string, describe: "Only this class, like 209H Block 2. Leave it out for every class it is posted to."}
    student: {type: string, describe: "Only this student, as you said the name."}
    document: {type: boolean, describe: "True to include the worksheet's HTML itself, for reading exactly what was asked."}

grade:
  facade: true
  level: undo
  uses: [classroom_grade_direct, classroom_grade_submission]
  describe: Grade one student or a whole class at once, by score or rubric, held for review unless you say return; or return everything held.
  say:
    - grade Mateo's Shop Fix 18 out of 20, comment fix the fillet callout
    - give Leo a perfect score on the trophy reflection
    - score Ana's Tolerance Check 15 and hold it
    - save those grades for the whole class, I'll check them first
    - return the held grades on the Blade worksheet
  args:
    post: {type: string, required: true, resolve: post, describe: "The assignment's title as you said it."}
    student: {type: string, resolve: student, describe: "One student, as you said the name. Leave it out when giving grades for many."}
    score: {type: number, describe: "The score. Say perfect, or leave it out with perfect true, for full points."}
    perfect: {type: boolean, describe: "True for full points."}
    comment: {type: string, describe: "A comment the student reads with the grade."}
    hold: {type: boolean, describe: "For one student: true to save the grade without returning it yet."}
    grades:
      type: array
      describe: "Many students at once, held unless return is true. Each has the student and a score, perfect, or scores by rubric criterion, and an optional comment."
      items:
        type: object
        properties:
          student: {type: string, describe: "The student, as you said the name."}
          score: {type: number, describe: "One score out of the total."}
          perfect: {type: boolean, describe: "True for full points."}
          scores: {type: object, describe: "Points for each rubric criterion, by its name or id, like Accuracy 8."}
          notes: {type: object, describe: "A note on a criterion, by its name; needed when a score falls between two levels."}
          comment: {type: string, describe: "A comment the student reads with the grade."}
    return: {type: boolean, describe: "With grades: true to return them to the students now. They are held by default."}
    returnHeld: {type: boolean, describe: "True to return every grade held on this assignment, with the score and comment it already has."}
    students: {type: array, items: string, describe: "With returnHeld: only these students."}
    class: {type: string, describe: "The class it is in, when the same title is in more than one, like 209H Block 3."}

send_feedback:
  facade: true
  level: undo
  uses: [classroom_feedback_post]
  describe: Leave a student a note on their work in progress on an assignment, which they see and can answer.
  say:
    - send Mateo feedback on his notebook, cite the datasheet next time
    - tell Leo his Shop Fix sketch needs dimensions
    - leave Ana a note on question 2 of the DFM worksheet
  args:
    post: {type: string, required: true, resolve: post, describe: "The assignment's title as you said it."}
    student: {type: string, required: true, resolve: student, describe: "The student, as you said the name."}
    message: {type: string, required: true, describe: "What the note says."}
    question: {type: string, describe: "Pin the note to one question: its number, its name, or words from its prompt."}
    class: {type: string, describe: "The class it is in, when the same title is in more than one."}

# VOICE TO ACTION (ledger 0432, feedback fba5bfcd). Measured 2026-10-23 on
# his 222 saved requests: coin awards and fines were 69 of them (185 calls),
# 1.64 calls each because a name went through find_student first. One call
# now does the whole thing; award coins and fine coins still answer by name
# for an old chat but are not offered.
coin_transact:
  facade: true
  level: undo
  uses: [coin_voice_log, coin_log_deposit]
  describe: Give, fine, charge or deposit a student's IDEA Coins from your own words, one call; it finds the student and the category, and asks only for what is missing.
  say:
    - give Mateo 5 coins for helping clean the shop
    - fine Daniel R, phone out
    - Farzad, 10 coins for hitting a sick trick shot
    - Leo bought an eating pass
    - fine Ana 3 for leaving her station a mess
    - deposit 5 coins for Dominic
  args:
    student: {type: array, items: string, describe: "The student, or each student, as he said the name. Leave it out and name a class for the whole class."}
    amount: {type: number, describe: "The number of coins, if he said one. Leave it out when he did not."}
    class: {type: string, describe: "A class to look in for the name, or the whole class when no student is named."}
    reason: {type: string, describe: "What it was for, in a few words, like helping clean the shop. It is the note the student reads; never his whole request."}
    what: {type: string, describe: "The older name for reason; send reason instead."}

award_coins:
  facade: true
  replaced_by: coin_transact
  level: undo
  uses: [coin_log_transaction]
  describe: Give one or more students IDEA Coins under an award category, with the reason you say.
  say:
    - give Mateo in Block 2 five coins for helping clean the shop
    - award the Shop Fix winners, Mateo and Leo, ten each
    - give everyone in Block 1 two coins for the clean benches
    - give Leo a Correct Answer award
  args:
    students: {type: array, items: string, resolve: student, describe: "Each student, as you said the name. Leave it out and name a class to award the whole class."}
    class: {type: string, resolve: class, describe: "A class to award every enrolled student in, or the class to look in for the names."}
    amount: {type: number, describe: "Coins each, when the award category takes an amount."}
    reason: {type: string, required: true, describe: "The reason, in your words; it is the note on the coin record."}
    kind: {type: string, describe: "The award category, like Above and Beyond or Correct Answer in Class. Leave it out to be offered the ones that fit."}

fine_coins:
  facade: true
  replaced_by: coin_transact
  level: undo
  uses: [coin_log_transaction]
  describe: Fine one or more students IDEA Coins under a fine category, with the reason you say.
  say:
    - fine Daniel R three coins, phone out
    - fine Leo for leaving without permission
    - give Ana a disruptive fine
  args:
    students: {type: array, items: string, required: true, resolve: student, describe: "Each student, as you said the name."}
    class: {type: string, resolve: class, describe: "The class to look in for the names."}
    kind: {type: string, describe: "The fine category, like Off-Task or Disruptive. Leave it out to be offered the ones that fit."}
    reason: {type: string, describe: "The reason, in your words; it is the note on the coin record."}
    amount: {type: number, describe: "The amount you said, checked against the category's set amount."}

coin_balance:
  facade: true
  level: read
  uses: [coin_admin_lookup]
  describe: Say how many IDEA Coins a student has, with their most recent coin records.
  say:
    - how many coins does Mateo have
    - what's Leo's balance
    - check Ana's coins
  args:
    student: {type: string, required: true, resolve: student, describe: "The student, as you said the name."}

undo_last:
  facade: true
  level: undo
  uses: []
  describe: Undo the most recent change made through Claude that can be undone, such as an award, a fine or a new post.
  say:
    - undo that
    - undo that fine
    - take that back
    - never mind, reverse it

connector_disconnect:
  facade: true
  level: confirm
  uses: [connector_admin_disconnect]
  describe: Disconnect this Claude connection from the site; it asks first, and connecting again means signing in again.
  say:
    - disconnect this phone
    - sign this connection out
    - revoke Claude's access from here

report_gap:
  facade: true
  level: undo
  uses: []
  describe: Record something he asked for that the site cannot do yet, so it reaches the feedback list and gets built; nothing else changes.
  say:
    - make a seating chart for Block 2
    - email every parent in Block 4
    - print the roster with photos
  args:
    missing: {type: string, required: true, describe: "What the site would need to be able to do, in plain words."}
    tried: {type: array, items: string, describe: "The tools or actions you tried, in order."}

record_eval_result:
  facade: true
  level: undo
  uses: []
  describe: Record whether one practice run of a saved request passed, for the nightly check of the request list; it writes nothing on the site.
  say:
    - record that request 12 passed
    - mark the coin award check as failed
    - log tonight's result for the roster check
  args:
    request: {type: integer, required: true, describe: "The saved request's number, from the request list."}
    passed: {type: boolean, required: true, describe: "True if it did what the request list says it must."}
    path: {type: array, items: string, describe: "The tools you called for it, in order."}
    note: {type: string, describe: "What went wrong, when it failed."}
    model: {type: string, describe: "The model that ran it, like Haiku 5.5, when it is not the one this connection reports."}

# THE SITE'S OWN FEEDBACK LIST (ledger 0416, gaps 3157f5d8, ae4a495d and the
# 2026-10-19 screenshot gap). Filing is file_site_feedback and a status is
# set_feedback_status, both function tools in site.yaml.
list_site_feedback:
  facade: true
  level: read
  uses: [app_feedback_admin_list]
  describe: List the reports people sent from the site's Send feedback button, newest first, filtered by status, fix soon or long term, app, and date.
  say:
    - what feedback came in today
    - list the open fix soon reports
    - show the classroom bug reports from this week
    - any new long term ideas
  args:
    status: {type: string, enum: [open, new, seen, resolved, spam, all], describe: "open (new or seen, the usual), one status, or all."}
    horizon: {type: string, enum: [fix soon, long term, both], describe: "fix soon (the usual), long term ideas, or both."}
    app: {type: string, describe: "Only reports about this part of the site, like classroom or portal."}
    since: {type: string, describe: "Only reports filed on or after this date, like 2026-10-16."}
    count: {type: integer, describe: "How many to list, newest first; leave it out for 25."}

feedback_screenshot:
  facade: true
  level: read
  uses: []
  describe: Get a link to the screenshot attached to one site feedback report, good for five minutes.
  say:
    - show me the screenshot on that report
    - open the picture from the matrix theme report
    - get report 551c11e3's screenshot
  args:
    report: {type: string, required: true, describe: "The report's id, or the first eight characters of it, from the feedback list."}


# BULK STATUS ON THE THREE FEEDBACK LISTS, THE ARMORY LISTS, AND ONE ARMORY
# INCIDENT WHOLE (ledger 0432, feedback 114d8101, gap 7432f89f). Measured on
# 2026-10-23 from his saved requests: 2059 of 1775-odd requests' calls were one
# status change at a time through site_call (1037 Armory incidents, 926 Armory
# notes, 96 site reports), and 181 were the Armory lists. One call now moves
# many rows with one undo; a status flip is reversible, so it never asks first.
mark_feedback:
  facade: true
  level: undo
  uses: [app_feedback_set_status_many, armory_app_feedback_set_status_many, armory_app_incidents_set_status_many]
  describe: Move many feedback reports, Armory notes or Armory incidents to new, seen, resolved or spam in one call, by ids or by status, version and date.
  say:
    - mark those 22 reports as spam
    - resolve every new Armory incident from version 0.3.3
    - mark all the Armory notes as seen
    - set every seen report since Monday to resolved
  args:
    list: {type: string, enum: [site reports, armory notes, armory incidents], describe: "Which list: site reports (the Send feedback button, the usual), armory notes, or armory incidents."}
    ids: {type: array, items: string, describe: "Each one's id, or its first eight characters. Leave it out to pick by status, version and date instead."}
    status: {type: string, required: true, describe: "The new status: new, seen, resolved or spam."}
    currently: {type: string, describe: "Without ids: only the ones that have this status now, like new."}
    version: {type: string, describe: "Without ids, for the Armory lists: only those sent by this app version, like 0.3.3."}
    since: {type: string, describe: "Without ids: only those sent on or after this date, like 2026-10-22."}

list_armory_reports:
  facade: true
  level: read
  uses: [armory_app_incidents_admin_list, armory_app_feedback_admin_list]
  describe: List what the IDEA Armory app sent, incidents or notes, newest first, filtered by status, version, kind and date, with a count of each.
  say:
    - any new Armory incidents
    - how many Armory crash reports came in today
    - show the Armory notes from version 0.4.1
    - list the slow pass incidents
  args:
    list: {type: string, enum: [incidents, notes], describe: "incidents (crash and slow pass reports, the usual) or notes people typed."}
    status: {type: string, describe: "open (new or seen, the usual), one status, or all."}
    version: {type: string, describe: "Only those from this app version, like 0.3.3."}
    kind: {type: string, describe: "Only this kind, like crash or slowPass."}
    since: {type: string, describe: "Only those sent on or after this date."}
