# SERVER ENDPOINTS, keyed by route (every method of it). An entry with
# `surface: call` is a real action a person takes by hand; site_call runs its
# handler in-process with his own session (src/lib/server/connector/endpoints.ts),
# exactly as the browser does, audited, and, for a change, asked first. Every
# other route is excluded with its reason: a file's bytes, a page served to a
# browser, someone signing in, a scheduled job, or a student's own action.

"/.well-known/oauth-authorization-server": {exclude: "The connector's own sign-in or transport, never a tool."}
"/.well-known/oauth-protected-resource": {exclude: "The connector's own sign-in or transport, never a tool."}
"/.well-known/oauth-protected-resource/mcp": {exclude: "The connector's own sign-in or transport, never a tool."}
"/_platform/[...asset]": {exclude: "Serves a page or a file to a browser; nothing a person asks for."}
"/a/[appId]/[...path]": {exclude: "Serves a page or a file to a browser; nothing a person asks for."}
"/admin/drive-connect": {exclude: "Part of someone signing in to the site or connecting a device; never a tool."}
"/admin/drive-connect/callback": {exclude: "Part of someone signing in to the site or connecting a device; never a tool."}
"/api/admin/test-accounts":
  surface: call
  tool: list_test_students
  level: read
  method: GET
  describe: List the test student accounts, each with its classes and when it was last used. Test students appear in no roster, grade, count, leaderboard or badge.
  say: ["list the test students", "what test accounts do I have", "which class is the test student in"]
"/api/admin/test-accounts/act":
  surface: call
  tool: act_as_test_student
  level: confirm
  method: POST
  describe: Do something as a test student, logged under your name in the view-as record. Only test students; a real student is acted as on the site. It asks first.
  say: ["as the test student, hand in the Bridge assignment", "answer question 2 as Test Student One", "take back the test student's hand-in"]
  args:
    student: {type: string, required: true, describe: "The test student's name or address, as list test students shows it."}
    action: {type: string, required: true, describe: "hand in, take back, or answer; or a site function's exact name for anything else."}
    post: {type: string, describe: "For hand in, take back and answer: the post's id, from get post."}
    question: {type: string, describe: "For answer: the question's id in the assignment."}
    answer: {type: string, describe: "For answer: the answer, as the student would type it."}
    args: {type: object, describe: "For a function named exactly: its arguments by their own names."}
  body: {student: $args.student, action: $args.action, post: $args.post, question: $args.question, answer: $args.answer, args: $args.args}
"/api/admin/test-accounts/create":
  surface: call
  tool: create_test_student
  level: confirm
  method: POST
  describe: Make a test student account, optionally in a class. It behaves as a student and appears in no roster, grade, count, leaderboard or badge. It asks first.
  say: ["make a test student in IDEA100 Block 2", "create a test account", "add a fake student to 209H section 3 so I can try it"]
  args:
    name: {type: string, required: true, describe: "What to call it, e.g. Test Student Block 2."}
    class: {type: string, describe: "A class by name as he says it (IDEA100 Block 2) or its id; leave it out for none."}
  body: {label: $args.name, class: $args.class}
"/api/admin/files/attach":
  surface: call
  tool: attach_file
  level: confirm
  method: POST
  describe: Put a file from a chat upload on a post, as a handout for students, an instructor-only file or the post's thumbnail picture, or on a class notice; the site's own upload steps decide. It asks first.
  say: ["attach this PDF to the Blade assignment", "make this picture the thumbnail for Shop Fix", "put the answer key on the DFM worksheet for instructors only"]
  args:
    upload: {type: string, required: true, describe: "The upload holding the file, from start upload."}
    post: {type: string, required: true, describe: "The post's title as he says it, or words from the notice, or its id."}
    as: {type: string, enum: [students, instructors, thumbnail, notice], describe: "students for a handout (the usual), instructors for instructor only, thumbnail for its picture, notice for a file on a class notice."}
    filename: {type: string, describe: "The name to show, if not the upload's own."}
  body: {upload: $args.upload, post: $args.post, as: $args.as, filename: $args.filename}
"/api/admin/files/foundry":
  surface: call
  tool: publish_foundry_app
  level: confirm
  method: POST
  describe: Publish a game or app from a chat upload (a zip, or one HTML file) to the Foundry, start to finish, on an app of yours or a new one; it asks first.
  say: ["publish this game zip to the Foundry", "put the new GREENLINE build up", "add this HTML game to the gallery as a new app"]
  args:
    upload: {type: string, required: true, describe: "The upload holding the zip or HTML file, from start upload."}
    app: {type: string, describe: "The app to add this version to, by its title; leave it out for a new app."}
    title: {type: string, describe: "For a new app: its title."}
    slug: {type: string, describe: "For a new app: its short address name, if not made from the title."}
    notes: {type: string, describe: "For a new app: build notes, in his words."}
    publish: {type: boolean, describe: "False to leave it waiting in review instead of publishing it."}
  body: {upload: $args.upload, app: $args.app, title: $args.title, slug: $args.slug, notes: $args.notes, publish: $args.publish}
"/api/admin/files/foundry-cover":
  surface: call
  tool: set_foundry_cover
  level: confirm
  method: POST
  describe: Make a picture or an HTML file from a chat upload a game's cover on its gallery card, or put the student's own cover back; it asks first.
  say: ["make this picture the cover for Blade Run", "use this animated HTML as the cover for the racing game", "put the student's own cover back on Blade Run"]
  args:
    app: {type: string, required: true, describe: "The game, by its title as he says it, or its id."}
    upload: {type: string, describe: "The upload holding the picture or HTML file, from start upload. Leave it out with clear."}
    clear: {type: boolean, describe: "True to put the student's own cover back instead."}
  body: {app: $args.app, upload: $args.upload, clear: $args.clear}
"/api/admin/files/upload":
  surface: call
  tool: start_upload
  level: read
  method: POST
  describe: Open a one-time upload for a file too big to send as text, like a worksheet with pictures, a game, a cover or a handout; it answers where to send the bytes.
  say: ["here is the worksheet file, put it on the assignment", "publish this game zip to the Foundry", "attach this PDF to the assignment"]
  args:
    filename: {type: string, required: true, describe: "The file's name, like blade-worksheet.html."}
    type: {type: string, describe: "Its kind, like text/html, application/zip, image/png or application/pdf."}
    megabytes: {type: number, describe: "About how big it is, in megabytes, up to 50."}
  body: {filename: $args.filename, type: $args.type, megabytes: $args.megabytes}
"/api/admin/files/upload-part":
  surface: call
  tool: upload_part
  level: read
  method: POST
  describe: Send one numbered piece of an upload, for a chat that cannot send a file any other way; the pieces are joined in order.
  say: ["send the next piece of the worksheet", "keep uploading the file", "here is part 3"]
  args:
    upload: {type: string, required: true, describe: "The upload, from start upload."}
    part: {type: integer, required: true, describe: "This piece's number, from 1."}
    text: {type: string, describe: "The piece, for a text file like HTML, up to 200,000 characters."}
    base64: {type: string, describe: "The piece as base64, for anything else."}
  body: {upload: $args.upload, part: $args.part, text: $args.text, base64: $args.base64}
