"/api/foundry/delete":
  surface: call
  tool: delete_foundry_app
  level: confirm
  method: POST
  describe: Delete a Foundry app, or one version of it, with its stored files, for good; it asks first.
  say: ["delete the test app from the Foundry", "remove that old version of Cookie Press", "delete Leo's broken upload"]
  args:
    app: {type: string, describe: "The app's id, to delete the whole app."}
    version: {type: string, describe: "One version's id, to delete only that version."}
  body: {appId: $args.app, versionId: $args.version}
"/api/foundry/source":
  surface: call
  tool: read_foundry_source
  level: read
  method: POST
  describe: Read the source files of a Foundry app version, as the review queue shows them.
  say: ["show me Cookie Press's code", "read the version's index file", "what files are in that upload"]
  args:
    app: {type: string, required: true, describe: "The app's id."}
    version: {type: string, required: true, describe: "The version's id."}
    path: {type: string, describe: "One file's path in the version; leave it out to list the files."}
  body: {appId: $args.app, versionId: $args.version, path: $args.path}
