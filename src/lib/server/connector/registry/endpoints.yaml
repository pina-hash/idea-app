# SERVER ENDPOINTS, keyed by route (every method of it). An entry with
# `surface: call` is a real action a person takes by hand; site_call runs its
# handler in-process with his own session (src/lib/server/connector/endpoints.ts),
# exactly as the browser does, audited, and, for a change, asked first. Every
# other route is excluded with its reason: a file's bytes, a page served to a
# browser, someone signing in, a scheduled job, or a student's own action.

