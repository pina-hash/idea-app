"/api/certifications/award":
  surface: call
  tool: issue_certification
  level: confirm
  method: POST
  describe: Issue a certification a student has earned, with its signed serial; it asks first because it is a signed public record.
  say: ["issue the SolidWorks Level 1 certification to Leo", "award Mateo his CNC cert", "give Ana her 3D printing certification"]
  args:
    attempt: {type: string, required: true, describe: "The student's passed attempt, by its id from the certifier desk."}
  body: {attempt_id: $args.attempt}
  preview: {function: cert_award_prepare, args: {p_attempt: $args.attempt}}
"/api/certifications/correct":
  surface: call
  tool: correct_certification
  level: confirm
  method: POST
  describe: Correct the name or address on an issued certification and re-sign it, with the reason; it asks first because it is a signed public record.
  say: ["fix the name on Leo's certificate", "correct Mateo's certification email", "Ana's certificate has a typo"]
  args:
    award: {type: string, required: true, describe: "The award's id."}
    holder: {type: string, required: true, describe: "The name exactly as it should read."}
    email: {type: string, required: true, describe: "The holder's school address."}
    reason: {type: string, required: true, describe: "Why it is being corrected."}
  body: {award_id: $args.award, holder_name: $args.holder, email: $args.email, reason: $args.reason}
  preview: {function: cert_award_get, args: {p_id: $args.award}}
