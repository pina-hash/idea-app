# ARMORY FUNCTIONS. The shape is described at the top of classroom.yaml.
#
# An argument with `fill: uuid` is filled by the server with a fresh id when it
# is left out: the Armory takes an operation id on every write so the Windows
# app can retry without doubling, and a person never says one.

armory_app_feedback_admin_list:
  surface: call
  level: read
  describe: The notes people sent from the IDEA Armory Windows app, newest first.
  say: ["what feedback came in from the Armory app", "show Armory app notes", "any new Armory complaints"]
  args:
    p_limit: {name: count, describe: "How many to list."}

armory_app_feedback_set_status:
  surface: call
  level: undo
  describe: Move a note from the Armory app to a new status, such as reviewed or done.
  say: ["mark that Armory note done", "set the Armory feedback to reviewing", "close the Armory app note"]
  args:
    p_id: {name: note, describe: "The note's id, from the Armory app notes."}
    p_status: {name: status, describe: "The new status, as the feedback console names it."}
  before:
    table: armory_app_feedback
    columns: [status]
    eq: {id: $args.p_id}
  undo:
    - function: armory_app_feedback_set_status
      args: {p_id: $args.p_id, p_status: $before.status}

armory_app_incident_set_status:
  surface: call
  level: undo
  describe: Move an incident report from the Armory app to a new status, such as reviewed or done.
  say: ["mark that Armory incident done", "set the crash report to reviewing", "close the Armory incident"]
  args:
    p_id: {name: incident, describe: "The incident's id, from the Armory incidents."}
    p_status: {name: status, describe: "The new status, as the feedback console names it."}
  before:
    table: armory_app_incidents
    columns: [status]
    eq: {id: $args.p_id}
  undo:
    - function: armory_app_incident_set_status
      args: {p_id: $args.p_id, p_status: $before.status}

armory_app_incidents_admin_list:
  surface: call
  level: read
  describe: The incident reports the IDEA Armory Windows app sent, newest first.
  say: ["any Armory crash reports", "show Armory incidents", "what went wrong in the Armory app"]
  args:
    p_limit: {name: count, describe: "How many to list."}

armory_break_lock:
  surface: call
  level: confirm
  describe: Force check in one file a student has checked out in the Armory, so others can edit it; it asks first.
  say: ["force check in the gearbox part", "take back Mateo's checkout on the frame", "unlock that file"]
  args:
    p_file: {name: file, describe: "The file's id, from the project's checkouts."}
    p_device: {name: computer, default: null, describe: "Leave it out; the site sends none."}
    p_operation: {name: operation, fill: uuid, describe: "Leave it out; the server fills it."}

armory_break_locks:
  surface: call
  level: confirm
  describe: Force check in several Armory files at once; it asks first because it is a bulk change.
  say: ["force check in everything Mateo has", "take back all checkouts on the robot project", "unlock every file in the drivetrain folder"]
  args:
    p_files: {name: files, describe: "Every file's id, from the project's checkouts."}
    p_device: {name: computer, default: null, describe: "Leave it out; the site sends none."}
    p_operation: {name: operation, fill: uuid, describe: "Leave it out; the server fills it."}

armory_can_take_back:
  surface: call
  level: read
  describe: Whether you can force check in files on an Armory project.
  say: ["can I take back files on the robot project", "am I allowed to force check in here", "do I have take back on that project"]
  args:
    p_project: {name: project, describe: "The project's id, from your Armory projects."}

armory_cots_add:
  exclude: Ledger 0405 ships it for the website and the SolidWorks add-in; a connector write for it needs a sample and its log tables first.

armory_cots_correct:
  exclude: Ledger 0405 ships it for the website and the SolidWorks add-in; a connector write for it needs a sample and its log tables first.

armory_cots_list:
  surface: call
  level: read
  describe: The Armory's shared library of bought parts, named by vendor and the vendor's own number.
  say: ["what's in the COTS library", "do we have a REV NEO in the parts library", "list the bought parts"]

armory_cots_retire:
  exclude: Ledger 0405 ships it for the website and the SolidWorks add-in; a connector write for it needs a sample and its log tables first.

armory_create_project:
  surface: call
  level: confirm
  describe: Create a new Armory project for CAD files; it asks first because a project is only removed by Delete forever.
  say: ["create an Armory project called Robot", "make a new CAD project for Launcher B2 Team 1", "start an Armory project for the trophy"]
  args:
    p_name: {name: name, describe: "The project's name; it becomes a folder name on every computer."}
    p_season: {name: season, default: null, describe: "Leave it out; the site sends none, so a project has no season, as it does when made on the website."}
    p_release: {name: solidworks, describe: "The SolidWorks version the project is on, 2025 or 2026; leave it out for 2025. It can move up later, never down."}
    p_operation: {name: operation, fill: uuid, describe: "Leave it out; the server fills it."}

armory_file_history:
  surface: call
  level: read
  describe: Every saved version of one Armory file, with who saved it and when.
  say: ["show the history of the gearbox part", "who changed the frame last", "list versions of that file"]
  args:
    p_file: {name: file, describe: "The file's id, from the project's files."}

armory_is_member:
  surface: call
  level: read
  describe: Whether you are on an Armory project's team.
  say: ["am I on the robot project", "am I a member of that project", "do I belong to the trophy project"]
  args:
    p_project: {name: project, describe: "The project's id."}

armory_list_changes:
  surface: call
  level: read
  describe: The recent changes on an Armory project, such as check ins, check outs and new files.
  say: ["what changed on the robot project", "show Armory activity", "who checked in files today"]
  args:
    p_project: {name: project, describe: "The project's id."}
    p_after: {name: after, describe: "Only changes after this change number."}

armory_my_projects:
  surface: call
  level: read
  describe: The Armory projects you are a member of.
  say: ["what Armory projects am I on", "list my CAD projects", "my Armory projects"]

armory_orphans_count:
  surface: call
  level: read
  describe: How many stored Armory files no project uses any more, waiting for storage cleanup.
  say: ["how much Armory storage can be cleaned up", "any orphaned Armory files", "count files waiting for cleanup"]

armory_orphans_pending:
  exclude: A step inside the Armory storage cleanup, which the cleanup action runs; never called on its own.

armory_orphans_swept:
  exclude: A step inside the Armory storage cleanup, which the cleanup action runs; never called on its own.

armory_part_number_take:
  exclude: Ledger 0405 ships it for the website and the SolidWorks add-in; a connector write for it needs a sample and its log tables first.

armory_part_subsystem_retire:
  exclude: Ledger 0405 ships it for the website and the SolidWorks add-in; a connector write for it needs a sample and its log tables first.

armory_part_subsystem_save:
  exclude: Ledger 0405 ships it for the website and the SolidWorks add-in; a connector write for it needs a sample and its log tables first.

armory_people_search:
  surface: call
  level: read
  describe: Search school accounts by name to add someone to an Armory project.
  say: ["find Mateo to add to the robot project", "search for Leo in the Armory", "who is Ana Reyes"]
  args:
    p_project: {name: project, describe: "The project's id."}
    p_query: {name: name, describe: "The name to look for."}
    p_limit: {name: count, describe: "How many to list."}

armory_project_checkouts:
  surface: call
  level: read
  describe: Every file checked out on an Armory project, and who has it.
  say: ["who has files checked out on the robot project", "show Armory checkouts", "what is Mateo editing"]
  args:
    p_project: {name: project, describe: "The project's id."}

armory_project_files:
  surface: call
  level: read
  describe: Every file in an Armory project.
  say: ["list the robot project's files", "what's in the trophy project", "show the CAD files"]
  args:
    p_project: {name: project, describe: "The project's id."}

armory_project_part_numbers:
  surface: call
  level: read
  describe: Every part number an Armory project has taken, by subsystem and assembly.
  say: ["what part numbers has the robot taken", "list the drivetrain part numbers", "what's the next shooter assembly"]
  args:
    p_project: {name: project, describe: "The project's id."}

armory_project_summaries:
  surface: call
  level: read
  describe: A summary of each Armory project, or one, with its size, team and recent activity.
  say: ["summarize the Armory projects", "how big is the robot project", "Armory overview"]
  args:
    p_project: {name: project, describe: "One project's id; leave it out for all of them."}

armory_purge_preview:
  surface: call
  level: read
  describe: What Delete forever would remove from an archived Armory project or folder, before anything is deleted.
  say: ["what would deleting the old project remove", "preview the purge of last season", "how many files would delete forever take"]
  args:
    p_project: {name: project, describe: "The project's id."}
    p_folder: {name: folder, describe: "Only this folder's removed files."}

armory_purge_project:
  exclude: Runs inside Delete forever, which also removes the project's stored files from storage; the connector reaches it through that action, never on its own.

armory_register_device:
  exclude: Registers a computer running the IDEA Armory Windows app; the app does this itself when it signs in.

armory_set_part_prefix:
  exclude: Ledger 0405 ships it for the website and the SolidWorks add-in; a connector write for it needs a sample and its log tables first.

armory_team_status:
  surface: call
  level: read
  describe: Who is on an Armory project's team, with whether their computer has Armory open.
  say: ["who's on the robot team", "is Mateo's Armory open", "show the Armory team"]
  args:
    p_project: {name: project, describe: "The project's id."}

# TEAM MEMBERSHIP BY EMAIL (ledger 0416, gap 8d500e31). A site admin acts as a
# mentor of every project (0233), so he can add anyone with any role. Asks
# first: there is no reverse that puts a changed role back as it was.
armory_add_member:
  surface: call
  level: confirm
  describe: Add someone to an IDEA Armory project's team by their school email, or change their role on it; it asks first.
  say:
    - add mateo.r@boscotech.net to the robot project as a student
    - make Leo a CAD lead on the trophy project
    - put Mr. Cosso on the 2027 robot as a mentor
  args:
    p_project: {name: project, describe: "The project's id, from your Armory projects."}
    p_email: {name: email, describe: "Their school email address."}
    p_role: {name: role, enum: [student, cad_lead, instructor, mentor], describe: "student, CAD lead, instructor, or mentor."}
    p_operation: {name: operation, fill: uuid, describe: "Leave it out; the server fills it."}

armory_remove_member:
  surface: call
  level: confirm
  describe: Take someone off an IDEA Armory project's team by their email; it asks first, and a project always keeps one mentor.
  say: ["take Leo off the robot project", "remove mateo.r@boscotech.net from the trophy team", "drop Ana from the Armory project"]
  args:
    p_project: {name: project, describe: "The project's id, from your Armory projects."}
    p_email: {name: email, describe: "Their school email address."}
    p_operation: {name: operation, fill: uuid, describe: "Leave it out; the server fills it."}

# LEDGER 0432: the Armory app's two lists in bulk, and one incident whole.
armory_app_feedback_set_status_many:
  surface: call
  level: undo
  describe: Move many notes from the Armory app to one status in one go; the mark Armory notes tool is the usual way in.
  say: ["mark these Armory notes seen", "resolve those Armory notes", "set the Armory notes to resolved"]
  args:
    p_ids: {name: notes, describe: "Every note's id."}
    p_status: {name: status, enum: [new, seen, resolved, spam], describe: "new, seen, resolved, or spam."}
  undo:
    - function: armory_app_feedback_restore_statuses
      args: {p_previous: $result.previous}

armory_app_feedback_restore_statuses:
  surface: call
  level: undo
  describe: Put many Armory app notes back to the statuses they had, as the undo of a bulk move does.
  say: ["put those Armory notes back", "undo the Armory note move", "restore the Armory notes"]
  args:
    p_previous: {name: statuses, describe: "Each note's id with the status to put back."}
  undo:
    - function: armory_app_feedback_restore_statuses
      args: {p_previous: $result.previous}

armory_app_incidents_set_status_many:
  surface: call
  level: undo
  describe: Move many Armory incident reports to one status in one go; the mark Armory incidents tool is the usual way in.
  say: ["resolve those incidents", "mark these incidents seen", "set the crash reports to resolved"]
  args:
    p_ids: {name: incidents, describe: "Every incident's id."}
    p_status: {name: status, enum: [new, seen, resolved, spam], describe: "new, seen, resolved, or spam."}
  undo:
    - function: armory_app_incidents_restore_statuses
      args: {p_previous: $result.previous}

armory_app_incidents_restore_statuses:
  surface: call
  level: undo
  describe: Put many Armory incident reports back to the statuses they had, as the undo of a bulk move does.
  say: ["put those incidents back", "undo the incident move", "restore the incidents"]
  args:
    p_previous: {name: statuses, describe: "Each incident's id with the status to put back."}
  undo:
    - function: armory_app_incidents_restore_statuses
      args: {p_previous: $result.previous}

armory_app_incident_report:
  surface: call
  level: read
  describe: One Armory incident report whole, with its events, timings and log lines; the read Armory incident tool is the usual way in.
  say: ["read that Armory incident", "show the whole crash report", "what is in incident 3fa2b1c9"]
  args:
    p_id: {name: incident, describe: "The incident's id."}

# LEDGER 0463: an Armory project linked to a class. The link adds the whole
# roster in one write, so it asks first once for everyone; making folders and
# unlinking ask first too, because nothing reverses a made folder or a roster
# that has stopped being followed.
armory_link_section:
  surface: call
  level: confirm
  proof: generic
  describe: Link an IDEA Armory project to a class, so its roster becomes the team and each student gets a Last_First folder; it asks first, once for the whole roster.
  say: ["link the IDEA 100 project to Section 3", "make the Armory project follow the class roster", "connect the Armory project to Block 1"]
  args:
    p_project: {name: project, describe: "The Armory project: its name as he says it, or its id; the site looks it up."}
    p_section_id: {name: class, describe: "The class: its name as he says it, like IDEA 100 Section 3, or its id; the site looks it up."}
    p_operation: {name: operation, fill: uuid, describe: "Leave it out; the server fills it."}

armory_unlink_section:
  surface: call
  level: confirm
  proof: generic
  describe: Stop an IDEA Armory project following its class roster; nobody is added or removed and every folder stays; it asks first.
  say: ["unlink the Armory project from its class", "stop the IDEA 100 project following the roster", "disconnect the Armory project from Section 3"]
  args:
    p_project: {name: project, describe: "The Armory project: its name as he says it, or its id; the site looks it up."}
    p_operation: {name: operation, fill: uuid, describe: "Leave it out; the server fills it."}

armory_make_personal_folders:
  surface: call
  level: confirm
  proof: generic
  describe: Bring a class-linked IDEA Armory project up to its roster now, making any missing Last_First folder for each student; it asks first.
  say: ["make the personal folders on the IDEA 100 project", "give every student their own Armory folder", "update the Armory project from the roster"]
  args:
    p_project: {name: project, describe: "The Armory project: its name as he says it, or its id; the site looks it up."}
    p_operation: {name: operation, fill: uuid, describe: "Leave it out; the server fills it."}

armory_make_team_folders:
  surface: call
  level: confirm
  proof: generic
  describe: Make Teams/<team name> folders from a linked class's posted teams, each written only by its team; re-running updates writers and moves no file; it asks first.
  say: ["make team folders from the class teams", "make the Armory team folders for Section 3", "update the team folders after the team change"]
  args:
    p_project: {name: project, describe: "The Armory project: its name as he says it, or its id; the site looks it up."}
    p_operation: {name: operation, fill: uuid, describe: "Leave it out; the server fills it."}

armory_folder_list:
  surface: call
  level: read
  describe: Every class folder of an IDEA Armory project, personal and team, with who can write in each and how many files it holds.
  say: ["list the Armory folders and who can write", "who can save in the team folders", "show the students' Armory folders"]
  args:
    p_project: {name: project, describe: "The Armory project: its name as he says it, or its id; the site looks it up."}

armory_project_class:
  surface: call
  level: read
  describe: Which class an IDEA Armory project follows, with its roster size and how many class folders it has.
  say: ["which class is the Armory project linked to", "is the IDEA 100 project linked", "what class does the Armory project follow"]
  args:
    p_project: {name: project, describe: "The Armory project: its name as he says it, or its id; the site looks it up."}
