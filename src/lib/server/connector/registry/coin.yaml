# IDEA COIN FUNCTIONS. The shape is described at the top of classroom.yaml.

coin_log_transaction:
  surface: call
  level: undo
  describe: Log one coin record for a student under a category, with a note; the award coins tool and the fine coins tool are the usual way in.
  say: ["log a coin record for Mateo", "record a Correct Answer award", "log a shop safety fine"]
  args:
    p_email: {name: student, resolve: student, describe: "The student."}
    p_category_id: {name: category, describe: "The category's short name, from the coin settings."}
    p_amount: {name: amount, describe: "Coins, when the category takes an amount."}
    p_quantity: {name: quantity, describe: "How many units, for a per unit category."}
    p_note: {name: reason, describe: "The reason, in your words."}
  undo:
    - function: coin_reverse_transaction
      args: {p_transaction_id: $result.transaction_id, p_note: "Undone through the IDEA Website connector."}

# Ledger 0455 (218b6169, 636eac71): physical coins handed in become digital
# coins, at least the deposit minimum on the settings page. The coin tool
# routes "deposit 5 coins for Dominic" here too.
coin_log_deposit:
  surface: call
  level: undo
  describe: Deposit a student's physical IDEA Coins as digital coins; a deposit under the minimum on the settings page is refused.
  say: ["deposit 5 coins for Dominic", "Ana handed in 8 physical coins", "turn Leo's 10 physical coins into digital"]
  args:
    p_email: {name: student, resolve: student, describe: "The student, as you said the name."}
    p_amount: {name: amount, describe: "How many physical coins they handed in, a whole number."}
    p_note: {name: reason, default: null, describe: "Anything else to keep on the record; it already says physical to digital."}
  undo:
    - function: coin_reverse_transaction
      args: {p_transaction_id: $result.transaction_id, p_note: "Undone through the IDEA Website connector."}

# Ledger 0455 (3bcf3c90, 649759fe): correct what past records say, their note
# or their category, in one step. Amounts never change, so no balance moves.
coin_transactions_relabel:
  surface: call
  level: confirm
  describe: Correct what past coin records say, their note or their category, in one all or nothing step; amounts and balances never change. It asks first.
  say: ["fix the notes on the tournament awards", "make those balance corrections deposits", "change that award's note"]
  args:
    p_changes: {name: changes, describe: "Each record's id with its new note, its new category's short name, or both."}

# Ledger 0471: find past records by category, school days and note, with
# their ids, so coin_transactions_relabel can correct them. Reads only.
coin_records_search:
  surface: call
  level: read
  describe: Find past coin records by category, school days and words in the note, newest first, each with its id, student, amount, note and whether it was reversed, ready to relabel.
  say: ["find the contract completion records from October 19", "show the weekly pay records logged last week", "which coin records say weekly pay, week of Oct 19"]
  args:
    p_category: {name: category, default: null, describe: "The category, by its name like Contract Completion or its short name; leave it out for every category."}
    p_from: {name: from, default: null, describe: "The first school day, as YYYY-MM-DD; leave it out for no first day."}
    p_to: {name: to, default: null, describe: "The last school day, as YYYY-MM-DD, counted in full; the same as from for one day."}
    p_note: {name: note, default: null, describe: "Words anywhere in the note, any case."}
    p_limit: {name: limit, default: 100, describe: "How many records a page, 1 to 500."}
    p_offset: {name: offset, default: 0, describe: "How many to skip, from the last answer's next offset."}

coin_reverse_transaction:
  surface: call
  level: confirm
  describe: Reverse one coin record with a reversal record beside it, exactly as Undo does on the Coin Desk; it asks first.
  say: ["reverse Mateo's last fine", "cancel that coin record", "undo the award from this morning"]
  args:
    p_transaction_id: {name: record, describe: "The coin record's id, from the student's recent records."}
    p_note: {name: reason, describe: "Why it is being reversed."}

coin_admin_lookup:
  surface: call
  level: read
  describe: A student's coin balance, wage tier, eating pass and most recent coin records.
  say: ["how many coins does Mateo have", "look up Leo's coins", "show Ana's coin history"]
  args:
    p_email: {name: student, resolve: student, describe: "The student."}

coin_settings_get:
  surface: call
  level: read
  describe: The coin economy's settings, such as each fine's amount and the payday rules.
  say: ["what's the fine for a phone", "how much is a shop safety fine", "what are the coin settings"]

coin_fine_sections:
  surface: call
  level: read
  describe: The classes you can log fines in from the fine screen.
  say: ["which classes can I fine in", "list my fine classes", "where can I log fines"]

coin_staff_scope:
  surface: call
  level: read
  describe: Which coin powers you hold and which classes they cover.
  say: ["what coin powers do I have", "am I a full coin admin", "which classes are in my coin scope"]

# ---------------------------------------------------------------------------
# Ledger 0401: every other coin function the site calls.
# ---------------------------------------------------------------------------

coin_admin_adjust_balance:
  surface: tool
  tool: adjust_balance
  level_when: [{if: "p_amount > 0", level: undo}, {else: confirm}]
  describe: Add coins to a student's balance, or take some away; taking away, or setting to zero, asks first.
  say: ["add twenty coins to Mateo's balance", "set Mateo's balance to zero", "take five coins off Leo's balance", "refund Ana three coins"]
  args:
    p_email: {name: student, resolve: student, describe: "The student, as you said the name."}
    p_amount: {name: amount, describe: "Coins to add, or a negative number to take away. To set a balance to zero, take away the whole balance."}
    p_note: {name: reason, describe: "Why, in your words; it is the note on the coin record."}
  undo:
    - function: coin_reverse_transaction
      args: {p_transaction_id: $result.transaction_id, p_note: "Undone through the IDEA Website connector."}

coin_admin_create_category:
  surface: call
  level: confirm
  describe: Add a new award, fine or purchase category to the coin economy; it asks first.
  say: ["add a fine called Tool Left Out for three coins", "create an award category for helping a classmate", "make a new purchase for a sticker"]
  args:
    p_id: {name: code, describe: "A short lowercase code for it, letters and underscores, like the name with spaces as underscores."}
    p_name: {name: name, describe: "The category's name as people see it."}
    p_kind: {name: kind, enum: [award, fine, purchase, adjustment], describe: "award, fine, purchase or adjustment."}
    p_scope: {name: courses, enum: [core, 209h], describe: "core for every course, or 209h for Engineering I Honors only."}
    p_pricing_model: {name: pricing, enum: [flat, range, per_unit, variable], describe: "flat for a set amount, range for a low and high amount, per unit, or variable for any amount."}
    p_amount: {name: amount, describe: "The set amount, for flat or per unit pricing."}
    p_min_amount: {name: lowest, describe: "The lowest amount, for range pricing."}
    p_max_amount: {name: highest, describe: "The highest amount, for range pricing."}
    p_unit_label: {name: unit, describe: "What one unit is, for per unit pricing, like page."}
    p_notes: {name: notes, describe: "A note about when to use it."}

coin_admin_set_category_active:
  surface: call
  level: confirm
  describe: Turn a coin category on or off so it can or cannot be logged; it asks first.
  say: ["turn off the donation award", "switch the eating fine back on", "retire the old printing category"]
  args:
    p_id: {name: category, describe: "The category's short name, from the coin settings."}
    p_active: {name: on, describe: "True to turn it on, false to turn it off."}

coin_settings_set:
  surface: call
  level: confirm
  describe: Change one coin economy setting, such as the payday rules, the long hall pass limits, the hall pass time students can buy, coin transfers or the stock market; it asks first.
  say:
    - change the pay raise cost to 120
    - set the long hall pass fine to start at 20 minutes
    - let students buy up to 30 extra hall pass minutes a day
    - make a hall pass time block 5 minutes
    - stop hall pass time sales
    - raise the stock trading fee to 3 percent
  args:
    p_key: {name: setting, describe: "The setting's name, exactly as the coin settings list it; hall pass time is the minutes in a block and the most extra minutes a day, and zero extra minutes stops sales."}
    p_value: {name: value, describe: "The new value, in the shape the coin settings show for it."}

coin_settings_set_category:
  surface: call
  level: confirm
  describe: Change one coin category's name, amount, limits or on and off state, such as the phone fine's amount; it asks first.
  say: ["change the phone fine to four", "make Correct Answer worth two coins", "set the Above and Beyond range to 2 to 8"]
  args:
    p_id: {name: category, describe: "The category's short name, from the coin settings; the phone fine is the Off-Task fine."}
    p_name: {name: name, default: null, describe: "A new name, or leave it out to keep the name."}
    p_amount: {name: amount, default: null, describe: "The new set amount, for a flat or per unit category."}
    p_min_amount: {name: lowest, default: null, describe: "The new lowest amount, for a range category."}
    p_max_amount: {name: highest, default: null, describe: "The new highest amount, for a range category."}
    p_cap_period: {name: period, default: null, describe: "How often the limit resets: day, week, quarter, or none for no limit."}
    p_cap_count: {name: limit, default: null, describe: "How many times it can be logged in that period."}
    p_active: {name: on, default: null, describe: "True or false to turn it on or off; leave it out to keep it as it is."}
    p_explanation: {name: explanation, default: null, describe: "The explanation students read for it."}

coin_queue:
  surface: call
  level: read
  describe: The coin requests waiting for a decision, such as purchases and payouts students asked for.
  say: ["what's in the coin queue", "any coin requests waiting", "show the payout requests"]
  args:
    p_kind: {name: kind, describe: "Only this kind of request; leave it out for all of them."}

coin_student_stats:
  surface: call
  level: read
  describe: One student's coin statistics, such as what they earned and spent and how they compare to the class.
  say: ["how is Mateo doing with coins", "show Leo's coin stats", "what has Ana earned this quarter"]
  args:
    p_email: {name: student, resolve: student, describe: "The student."}

coin_auditor_queue:
  surface: call
  level: read
  describe: What the coin auditors have to check, as the coin desk's auditor list shows it.
  say: ["what do the auditors need to check", "show the auditor list", "any coin audits waiting"]

coin_autopay_run:
  exclude: The automatic payday that runs on its own schedule; a person never runs it from a chat.

coin_bulk_log_students:
  surface: call
  level: confirm
  describe: Log the same coin record for many students at once under one category; it asks first because it is a bulk change.
  say: ["log a Correct Answer for the whole group", "give these six students a donation award", "bulk log the shop clean up fine"]
  args:
    p_emails: {name: students, describe: "Every student's school address."}
    p_category_id: {name: category, describe: "The category's short name, from the coin settings."}
    p_amount: {name: amount, describe: "Coins each, when the category takes an amount."}
    p_note: {name: reason, describe: "The reason, in your words."}

coin_contract_self_claim:
  exclude: A student claiming a coin contract for themselves; it acts as the caller, so through an admin's account it would claim for him.

coin_digest_push_due:
  exclude: The weekly coin digest's scheduled sender; it runs on its own time, never from a chat.

coin_donation_items_list:
  surface: call
  level: read
  describe: The list of supplies students can donate for coins, with what each is worth.
  say: ["what supplies can students donate", "show the donation list", "how much is a donated glue stick worth"]

coin_export:
  surface: call
  level: read
  describe: Every coin record for one student, one class or the whole economy, as a list you can read or save.
  say: ["export Mateo's coin history", "export Block 2's coins", "give me every coin record this year"]
  args:
    p_scope: {name: scope, describe: "student, class or economy."}
    p_email: {name: student, resolve: student, describe: "The student, for a student export."}
    p_section_id: {name: class, resolve: class, describe: "The class, for a class export."}

coin_fine_log:
  surface: call
  level: confirm
  describe: Log the same fine for several students at once, the way the fine screen does; it asks first because it is a bulk change.
  say: ["fine the whole back table for disruption", "log a shop not cleaned up fine for these four", "fine everyone at bench 3"]
  args:
    p_emails: {name: students, describe: "Every student's school address."}
    p_category_id: {name: category, describe: "The fine category's short name, from the coin settings."}
    p_amount: {name: amount, describe: "Coins each, when the fine takes an amount."}
    p_careless_cost: {name: dollars, describe: "For careless property damage: what it cost, in dollars."}
    p_note: {name: reason, describe: "The reason, in your words."}

coin_fine_roster:
  surface: call
  level: read
  describe: A class's roster as the fine screen shows it, with each student's balance and eating pass.
  say: ["show Block 2's fine screen", "who has an eating pass in Block 4", "balances for everyone in Block 1"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class."}

coin_log_extra_credit:
  surface: tool
  tool: extra_credit_coins
  level: undo
  describe: Spend a student's coins on extra credit points for a grading category, the way the coin desk logs it.
  say: ["Mateo is buying 3 points of extra credit on labs", "log 2 extra credit points for Leo on quizzes", "Ana wants extra credit on her project grade"]
  args:
    p_email: {name: student, resolve: student, describe: "The student, as you said the name."}
    p_points: {name: points, describe: "How many extra credit points."}
    p_grading_category: {name: toward, describe: "Where the points go, like labs, quizzes or projects."}
    p_note: {name: reason, describe: "A note for the record."}
  undo:
    - function: coin_reverse_transaction
      args: {p_transaction_id: $result.transaction_id, p_note: "Undone through the IDEA Website connector."}

coin_log_pay_raise:
  surface: call
  level: undo
  describe: Log a pay raise a student is buying, which charges them and moves their weekly wage up one tier.
  say: ["Mateo is buying a pay raise", "log a pay raise for Leo", "give Ana the next wage tier"]
  args:
    p_email: {name: student, resolve: student, describe: "The student."}
    p_note: {name: reason, describe: "A note for the record."}
  undo:
    - function: coin_reverse_transaction
      args: {p_transaction_id: $result.transaction_id, p_note: "Undone through the IDEA Website connector."}

coin_log_perfect_score:
  surface: call
  level: undo
  describe: Log a Perfect Score award by hand for work worth the points you say.
  say: ["log a perfect score award for Mateo on a 20 point lab", "Leo got a perfect score on the 50 point test", "award Ana her perfect score coins"]
  args:
    p_email: {name: student, resolve: student, describe: "The student."}
    p_points: {name: points, describe: "What the graded work was worth, in points."}
    p_note: {name: reason, describe: "A note for the record."}
  undo:
    - function: coin_reverse_transaction
      args: {p_transaction_id: $result.transaction_id, p_note: "Undone through the IDEA Website connector."}

coin_log_property_damage_careless:
  surface: call
  level: undo
  describe: Fine a student for careless property damage, priced from what the damage cost in dollars.
  say: ["Mateo broke a caliper carelessly, it cost 25 dollars", "log careless damage for Leo, 12 dollars", "fine Ana for the snapped drill bit"]
  args:
    p_email: {name: student, resolve: student, describe: "The student."}
    p_cost_dollars: {name: dollars, describe: "What the damage cost, in dollars."}
    p_note: {name: reason, describe: "What happened, in your words."}
  undo:
    - function: coin_reverse_transaction
      args: {p_transaction_id: $result.transaction_id, p_note: "Undone through the IDEA Website connector."}

coin_log_three_d_printing:
  surface: call
  level: undo
  describe: Charge a student for a 3D print by its grams and hours, the way the coin desk prices it.
  say: ["charge Mateo for a 40 gram print that took 3 hours", "log Leo's overnight print, 120 grams, 9 hours", "Ana printed a bracket, 15 grams, 1 hour"]
  args:
    p_email: {name: student, resolve: student, describe: "The student."}
    p_grams: {name: grams, describe: "How much filament the print used, in grams."}
    p_hours: {name: hours, describe: "How long the print took, in hours."}
    p_overnight: {name: overnight, describe: "True if it printed overnight."}
    p_note: {name: reason, describe: "A note for the record."}
  undo:
    - function: coin_reverse_transaction
      args: {p_transaction_id: $result.transaction_id, p_note: "Undone through the IDEA Website connector."}

coin_me:
  surface: call
  level: read
  describe: Your own coin record as the site shows it to you, which is empty for staff with no coins.
  say: ["what's my own coin record", "do I have a coin balance", "show my coin page"]

coin_my_contract_claims:
  exclude: A student's own contract claims; it acts as the caller, and contracts are retired (ledger 0432).

coin_my_contracts:
  exclude: The contracts open to the calling student; it acts as the caller, and contracts are retired (ledger 0432).

coin_my_page:
  surface: call
  level: read
  describe: Your own coin page as a student sees theirs.
  say: ["show my coin page", "what would my coin page say", "my own coins"]

coin_my_role:
  surface: call
  level: read
  describe: Your own classroom coin role, if you hold one.
  say: ["do I hold a coin role", "what's my coin role", "my role in the coin economy"]

coin_my_stats:
  surface: call
  level: read
  describe: Your own coin statistics as a student sees theirs.
  say: ["my coin stats", "what have I earned", "show my own coin numbers"]

coin_no_shop_today:
  surface: call
  level: read
  describe: Which students in a class are not allowed in the shop today because of a shop safety fine.
  say: ["who's out of the shop today in Block 2", "any shop bans today in Block 4", "who can't use the shop today"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class."}

coin_public_contracts:
  exclude: The old Ledger's contracts tab, readable without signing in; contracts are retired (ledger 0432).

coin_public_leaderboard:
  surface: call
  level: read
  describe: The coin leaderboard as the public coin ledger shows it.
  say: ["who's leading in coins", "show the coin leaderboard", "top coin earners"]

coin_public_reasons:
  surface: call
  level: read
  describe: The reasons coins are given and taken, as the public coin ledger lists them.
  say: ["what can students earn coins for", "list the coin reasons", "what are the fines on the ledger"]

coin_public_reported_coins:
  surface: call
  level: read
  describe: The coins on hand students have reported, as the public coin ledger shows them.
  say: ["what coins on hand have students reported", "show reported coins", "who reported coins this week"]

coin_public_role_badges:
  surface: call
  level: read
  describe: Who holds which coin role, as the public coin ledger shows the badges.
  say: ["who holds coin roles", "show the role badges", "which students are auditors"]

coin_public_role_questions:
  surface: call
  level: read
  describe: The questions a student answers to apply for one coin role.
  say: ["what does the auditor application ask", "show the questions for the banker role", "what's on the role application"]
  args:
    p_role_id: {name: role, describe: "The role's short name, from the list of roles."}

coin_public_roles:
  surface: call
  level: read
  describe: The coin roles students can hold, with how many seats each class has.
  say: ["what coin roles are there", "list the roles", "how many auditors can a class have"]

coin_public_student:
  surface: call
  level: read
  describe: One student's public coin ledger card, by the ledger's own student number.
  say: ["show ledger card 1234", "open that student's ledger card", "what does the ledger show for that number"]
  args:
    p_student_id: {name: number, describe: "The student's number on the public ledger."}

coin_public_transactions:
  surface: call
  level: read
  describe: The most recent coin records as the public coin ledger lists them.
  say: ["what are the latest coin records", "show recent coin activity", "last 50 coin transactions"]
  args:
    p_limit: {name: count, describe: "How many to list."}

coin_role_self_apply:
  exclude: A student applying for a coin role for themselves; it acts as the caller, so through an admin's account it would apply for him.

coin_section_role_badges:
  surface: call
  level: read
  describe: Who holds which coin role in one class.
  say: ["who holds roles in Block 2", "show Block 4's role badges", "who's the banker in Block 1"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class."}

# LEDGER 0402: the market, transfers, hall pass time, the stocks and the
# classroom banner. The student functions act as the caller, so through an
# admin's account they would trade, send or buy as him; the staff writes come
# to the connector once each has a sample and its log tables.

coin_economy_health:
  surface: call
  level: read
  describe: The coin economy's health for the last week or more, coins in circulation, students in debt, what came in against what went out, and what sits in escrow and stocks.
  say: ["how healthy is the coin economy", "how many coins are in circulation", "what came in and went out of the economy this week"]
  args:
    p_days: {name: days, describe: "How many days back; leave it out for the last seven."}

coin_banner:
  exclude: The classroom header banner's read for one class page; the page loads it for whoever is looking.
coin_buy_hall_pass_minutes:
  exclude: A student buying hall pass time for themselves; it acts as the caller, so through an admin's account it would buy for him.
coin_hall_pass_minutes_mine:
  exclude: A student's own hall pass time on their coin page; it acts as the caller.
coin_hall_pass_minutes_quote:
  exclude: A student's own price for more hall pass time; it acts as the caller.
coin_market_board:
  exclude: The IDEA Market as the signed-in student sees it, with their own trades; it acts as the caller.
coin_my_portfolio:
  exclude: A student's own stock holdings; it acts as the caller.
coin_public_stocks:
  exclude: The public Ledger's stock tile, readable without signing in; it names no person.
coin_public_transfers:
  exclude: The public Ledger's transfer feed, readable without signing in.
coin_stock_detail:
  exclude: One stock's page as the signed-in student sees it, with their own holding; it acts as the caller.
coin_stocks_board:
  exclude: The stock market as the signed-in student sees it, with their own portfolio; it acts as the caller.
coin_stocks_tick:
  exclude: Asks for the minute price update the stocks page makes on load; it throttles itself and answers counts only, so there is nothing for an admin to do with it.

# CONTRACTS ARE RETIRED (ledger 0432, migration 0296, feedback 00463d19):
# jobs live on the IDEA Market, and every contract write is closed to every
# client. Nothing about contracts is a connector tool.

coin_contracts_admin:
  exclude: Contracts are retired (ledger 0432); jobs are posted on the IDEA Market, so the old contract list is not offered.
coin_contract_post:
  exclude: Contracts are retired (ledger 0432); no client may post one, and jobs are posted on the IDEA Market.
coin_admin_edit_contract:
  exclude: Contracts are retired (ledger 0432); no client may change one.
coin_admin_assign_contract:
  exclude: Contracts are retired (ledger 0432); no client may put a student on one.
coin_admin_cancel_contract:
  exclude: Contracts are retired (ledger 0432); every contract was already closed by the migration that retired them.
coin_admin_restore_contract:
  exclude: Contracts are retired (ledger 0432); no client may reopen one.
coin_admin_reset_contract:
  exclude: Contracts are retired (ledger 0432); no client may reopen one.
coin_contract_mark_done:
  exclude: A student marking their own contract finished, through the coin student seam; through an admin's account it acted as him and answered not in the economy (gap 3f52bae9), and contracts are retired (ledger 0432).

# LEDGER 0432: voice to action. The coin transact tool logs through
# coin_voice_log; coin settings lists and edits the phrases it learns.
coin_voice_log:
  surface: call
  level: undo
  describe: Log one coin record from spoken words and save the phrase with its amount; the coin transact tool is the usual way in.
  say: ["log 5 coins for helping clean the shop", "log a phone fine", "record a custom award for a trick shot"]
  args:
    p_email: {name: student, resolve: student, describe: "The student."}
    p_category_id: {name: category, describe: "The category's short name, from the coin settings."}
    p_amount: {name: amount, default: null, describe: "Coins, when the category takes an amount."}
    p_note: {name: reason, default: null, describe: "The reason, in his words."}
    p_phrase: {name: phrase, default: null, describe: "His words for it, saved with the amount for next time."}
  undo:
    - function: coin_reverse_transaction
      args: {p_transaction_id: $result.transaction_id, p_note: "Undone through the IDEA Website connector."}

coin_voice_catalog:
  surface: call
  level: read
  describe: The award, fine and purchase categories and every phrase the coin tool has learned, with their amounts.
  say: ["what coin categories can I use", "what phrases does the coin tool know", "list the fines and awards"]

coin_alias_list:
  surface: call
  level: read
  describe: The phrases the coin tool learned from what you said, each with its category, default amount and how often it was used.
  say: ["show the coin phrases", "what coin shortcuts have I made", "list the saved award phrases"]

coin_alias_set_amount:
  surface: call
  level: undo
  describe: Change the default amount of one saved coin phrase, like making the trick shot award 5 coins.
  say: ["make the trick shot award 5 coins", "change the default for helping clean up to 2", "set that phrase to 3 coins"]
  args:
    p_id: {name: phrase, describe: "The phrase's id, from the list of coin phrases."}
    p_amount: {name: amount, describe: "The new default amount."}
  undo:
    - function: coin_alias_set_amount
      args: {p_id: $args.p_id, p_amount: $result.previous_amount}

coin_alias_promote:
  surface: call
  level: confirm
  describe: Make a saved coin phrase an official category with its own name, at its default amount; it asks first.
  say: ["make the trick shot award an official category", "turn that phrase into a real fine", "promote the helping clean award"]
  args:
    p_id: {name: phrase, describe: "The phrase's id, from the list of coin phrases."}
    p_name: {name: name, describe: "The category's name as people will see it."}

coin_alias_delete:
  surface: call
  level: confirm
  describe: Forget one saved coin phrase; it asks first.
  say: ["forget the trick shot phrase", "delete that coin phrase", "remove the saved award words"]
  args:
    p_id: {name: phrase, describe: "The phrase's id, from the list of coin phrases."}
