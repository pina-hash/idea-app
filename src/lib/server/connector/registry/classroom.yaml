    columns: [display_name, active]
    eq: {section_id: $args.p_section_id, student_email: $args.p_student_email}
  undo:
    - when: $before.found
      function: classroom_set_enrollment
      args: {p_section_id: $args.p_section_id, p_student_email: $args.p_student_email, p_display_name: $before.display_name, p_active: $before.active}
