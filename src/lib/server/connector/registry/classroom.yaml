  level: read
  describe: One file on a class notice, with how to download it.
  say: ["get the file on the safety notice", "where's the attachment on that notice", "download the notice's file"]
  args:
    p_file_id: {name: file, describe: "The file's id, from the notice."}

classroom_record_export:
  exclude: Bookkeeping the site writes after its automatic export of a post to the repository; never a person's action.

classroom_remove_enrollment:
