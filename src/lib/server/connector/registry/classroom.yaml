      args: {p_section_id: $args.p_section_id, p_student_email: $args.p_student_email}

classroom_set_instructor_attachment_order:
  surface: call
  level: undo
  describe: Put a post's instructor-only files in the order you say.
  say: ["put the key first", "reorder my instructor files", "move the notes to the end"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The post."}
    p_attachment_ids: {name: files, describe: "Every instructor-only file's id, in the new order."}
  before:
    table: classroom_instructor_attachments
    columns: [id]
    eq: {item_id: $args.p_item_id}
    order: [[sort_order, asc], [created_at, asc]]
  undo:
    - function: classroom_set_instructor_attachment_order
      args: {p_item_id: $args.p_item_id, p_attachment_ids: $before.rows.*.id}

classroom_set_instructor_resources:
  surface: call
