classroom_save_instructor_response:
  surface: call
  # Changing an answer puts the old one back; the first answer to a question
  # has no reverse (an answer cannot be cleared), so that one asks first.
  level_when:
    - {if: "$before.found", level: undo}
    - {else: confirm}
  describe: Write one answer in your own working copy of an assignment; the first answer to a question asks first, a change can be undone.
  say: ["put 12.5 millimeters as question 3 on my DFM key", "fill in my answer for the first block", "change my key's answer to question 2"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment."}
    p_block_id: {name: question, describe: "The question's block id, from the assignment's question list."}
    p_value: {name: answer, describe: "The answer, in the shape the question takes."}
  before:
    table: classroom_instructor_responses
    columns: [value]
    eq: {item_id: $args.p_item_id, block_id: $args.p_block_id, instructor_email: $user.email}
  undo:
    - when: $before.found
      function: classroom_save_instructor_response
      args: {p_item_id: $args.p_item_id, p_block_id: $args.p_block_id, p_value: $before.value}

classroom_save_response:
  exclude: A student saving their own answer; it acts as the caller, so through an admin's account it would answer as him.

classroom_save_team_set:
  surface: call
  level: undo
  describe: Save a team draw for a class so it lasts, with its teams and the seed that made it.
  say: ["save these teams for Block 2", "keep this draw", "store the Block 4 teams"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class."}
    p_label: {name: label, describe: "A name for the draw, like Blade Night."}
    p_seed: {name: seed, describe: "The draw's seed number."}
    p_mode: {name: mode, enum: [size, count], describe: "size for teams of a size, count for a number of teams."}
    p_mode_value: {name: value, describe: "The team size or the number of teams."}
    p_teams: {name: groups, describe: "Each team with its number and its members' addresses."}
  undo:
    - function: classroom_archive_team_set
      args: {p_team_set_id: $result}

classroom_set_assignment_spec:
  surface: call
  # Replacing a spec puts the old one back; the first spec on a post has no
  # reverse (nothing clears to "never had one"), so that one asks first.
  level_when:
    - {if: "$before.found", level: undo}
    - {else: confirm}
  describe: Set or clear an assignment's interactive spec; replacing one can be undone, the first one asks first.
  say: ["put this spec on Tolerance Check", "clear the spec from the Shop Fix", "replace the DFM worksheet's spec"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment."}
    p_spec: {name: spec, describe: "The whole spec, or nothing to clear it."}
  before:
    table: classroom_assignment_specs
    columns: [spec]
    eq: {item_id: $args.p_item_id}
  undo:
    - when: $before.found
      function: classroom_set_assignment_spec
      args: {p_item_id: $args.p_item_id, p_spec: $before.spec}

classroom_set_attachment_order:
  surface: call
  level: undo
  describe: Put a post's files in the order you say.
  say: ["put the chart first on Tolerance Check", "reorder the Shop Fix files", "move the rubric file to the end"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The post."}
    p_attachment_ids: {name: files, describe: "Every file's id, in the new order."}
  before:
    table: classroom_attachments
    columns: [id]
    eq: {item_id: $args.p_item_id}
    order: [[sort_order, asc], [created_at, asc]]
  undo:
    - function: classroom_set_attachment_order
      args: {p_item_id: $args.p_item_id, p_attachment_ids: $before.rows.*.id}

classroom_set_enrollment:
  surface: tool
  tool: add_student
  level: undo
  describe: Add a student to one of your classes by their school address, or mark one as no longer in it.
  say: ["add mateo.reyes@boscotech.net to Block 2", "put the new student in Block 4", "mark Leo as gone from Block 1"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class, like 209H Block 2."}
    p_student_email: {name: email, describe: "The student's school address."}
    p_display_name: {name: name, describe: "Their name as Last, First."}
    p_active: {name: active, describe: "True for in the class, false for no longer in it."}
  before:
