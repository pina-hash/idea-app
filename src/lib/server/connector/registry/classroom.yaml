  level: confirm
  describe: Take a student off a class roster; it asks first, and refuses if they have work in the class.
  say: ["remove Daniel from Block 2", "take Leo off the Block 4 roster", "drop Ana from IDEA100"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class, like 209H Block 2."}
    p_student_email: {name: student, resolve: student, describe: "The student, as you said the name."}

classroom_remove_posting:
