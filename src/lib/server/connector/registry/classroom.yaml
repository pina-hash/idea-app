    table: classroom_items
    columns: [unit_id]
    eq: {id: $args.p_item_id}
  undo:
    - function: classroom_set_item_unit
      args: {p_item_id: $args.p_item_id, p_unit_id: $before.unit_id}

classroom_set_posting_perfect_score:
  surface: call
  level: undo
  describe: Turn the Perfect Score coin award on or off for a post in one class.
  say: ["turn on perfect score coins for the Shop Fix in Block 2", "no perfect score coins on the quiz", "pay perfect score on Tolerance Check"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment."}
    p_section_id: {name: class, resolve: class, describe: "The class."}
    p_on: {name: on, describe: "True to pay it, false not to."}
  undo:
    - function: classroom_set_posting_perfect_score
      args: {p_item_id: $args.p_item_id, p_section_id: $args.p_section_id, p_on: "!$args.p_on"}

classroom_set_reference_spec:
  surface: call
  # Replacing a spec puts the old one back; the first spec on a post has no
  # reverse (nothing clears to "never had one"), so that one asks first.
  level_when:
    - {if: "$before.found", level: undo}
    - {else: confirm}
  describe: Set or clear the reference document on a material post; replacing one can be undone, the first one asks first.
  say: ["put this reference spec on the Safety Reference", "clear the reference document", "replace the Fillet Reference spec"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The material."}
    p_spec: {name: spec, describe: "The whole reference spec, or nothing to clear it."}
  before:
    table: classroom_reference_specs
    columns: [spec]
    eq: {item_id: $args.p_item_id}
  undo:
    - when: $before.found
      function: classroom_set_reference_spec
      args: {p_item_id: $args.p_item_id, p_spec: $before.spec}

classroom_set_section_active:
  surface: call
  level: undo
  describe: Archive a class so it moves under Archived, or bring it back.
  say: ["archive last year's Block 3", "unarchive IDEA100 Block 1", "move the old class to archived"]
  args:
    p_id: {name: class, resolve: class, describe: "The class."}
    p_active: {name: active, describe: "False to archive it, true to bring it back."}
  undo:
    - function: classroom_set_section_active
      args: {p_id: $args.p_id, p_active: "!$args.p_active"}

classroom_set_section_thumbnail_shape:
  surface: call
  level: undo
  describe: Set the default shape of post pictures in a class.
  say: ["make Block 2's thumbnails tiles", "turn off post pictures in Block 4", "use wide thumbnails in IDEA100"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class."}
    p_shape: {name: shape, describe: "The shape, as the site's display settings name it, or off."}
  before:
    table: classroom_sections
    columns: [thumbnail_shape]
    eq: {id: $args.p_section_id}
  undo:
    - function: classroom_set_section_thumbnail_shape
      args: {p_section_id: $args.p_section_id, p_shape: $before.thumbnail_shape}

classroom_set_submission_file_caption:
  exclude: A student captioning a file in their own hand-in; it acts as the caller.

classroom_set_team_style:
  surface: call
  level: confirm
  describe: Set a team's name, motto, color, background or badge; it asks first because the old look is not kept.
  say: ["name team 3 the Gearheads", "make team 2's color blue", "give the first team a lightning badge"]
  args:
    p_team_id: {name: team, describe: "The team's id, from the team board."}
    p_name: {name: name, describe: "The team's name."}
    p_accent_color: {name: color, describe: "A color as a hex value like #2a9d8f."}
    p_background_type: {name: background, describe: "solid or gradient."}
    p_background_value: {name: colors, describe: "The background's colors."}
    p_badge: {name: badge, describe: "A badge name from the site's badge list."}
    p_flourish: {name: flourish, describe: "A flourish name from the site's list."}
    p_tagline: {name: motto, describe: "The team's motto."}

classroom_set_unit_order:
  surface: call
  level: undo
  describe: Put a course's units in the order you say.
  say: ["put Unit 3 before Unit 2", "reorder the 209H units", "move Manufacturing to the end"]
  args:
    p_course_id: {name: course, describe: "The course's id, from your list of classes."}
    p_unit_ids: {name: units, describe: "Every unit's id, in the new order."}
  before:
    table: classroom_units
    columns: [id]
    eq: {course_id: $args.p_course_id}
    order: [[sort_order, asc], [created_at, asc]]
  undo:
    - function: classroom_set_unit_order
      args: {p_course_id: $args.p_course_id, p_unit_ids: $before.rows.*.id}

classroom_song_approve:
  surface: call
  level: confirm
  describe: Approve a student's song request, which charges their coins and plays it; it asks first because the charge is not undone.
  say: ["approve Mateo's song", "play Leo's request", "say yes to the first song in the queue"]
  args:
    p_request_id: {name: request, describe: "The request's id, from the class's song queue."}

classroom_song_queue:
  surface: call
  level: read
  describe: The song requests waiting in a class.
  say: ["what songs are requested in Block 2", "show the song queue", "any song requests"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class."}
    p_limit: {name: count, describe: "How many to list."}

classroom_song_reject:
  surface: call
  level: confirm
  describe: Turn down a student's song request with a reason; it asks first because it cannot be taken back.
  say: ["reject Mateo's song, not school appropriate", "say no to Leo's request", "turn down the first song"]
  args:
    p_request_id: {name: request, describe: "The request's id, from the class's song queue."}
    p_reason: {name: reason, describe: "Why, in your words."}

classroom_song_request:
  exclude: A student requesting a song for themselves; it acts as the caller and charges their coins.

classroom_submit_assignment:
  exclude: A student turning in their own work; it acts as the caller.

classroom_team_board:
  surface: call
  level: read
  describe: A class's saved team draws, with every team and who is on it.
  say: ["show Block 2's teams", "who's on which team", "list the team draws"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class."}

classroom_undesignate_instructor_key:
  surface: call
  level: undo
  describe: Stop using your working copy as an assignment's answer key.
  say: ["take my copy off as the key", "undesignate the answer key", "the key isn't ready, take it down"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment."}
  undo:
    - function: classroom_designate_instructor_key
      args: {p_item_id: $args.p_item_id}

classroom_unpost_team_set:
  surface: call
  level: confirm
  describe: Take a team draw off the class page; it asks first because when it was meant to come down is not kept.
  say: ["take the teams down", "unpost the Block 2 teams", "hide the team list"]
  args:
    p_team_set_id: {name: teams, describe: "The team draw's id, from the class's team board."}

classroom_unsubmit_assignment:
  exclude: A student taking back their own turned-in work; it acts as the caller.

classroom_update_enrollment:
  surface: call
  level: undo
  describe: Fix a student's name or school address on a class roster.
  say: ["fix Mateo's name to Reyes, Mateo J", "change Leo's address", "correct Ana's name on the roster"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class."}
    p_student_email: {name: student, resolve: student, describe: "The student."}
    p_new_email: {name: address, describe: "Their corrected school address, if it changes."}
    p_display_name: {name: name, describe: "Their corrected name as Last, First."}
  before:
    table: classroom_enrollments
    columns: [display_name]
    eq: {section_id: $args.p_section_id, student_email: $args.p_student_email}
  undo:
    - function: classroom_update_enrollment
      args: {p_section_id: $args.p_section_id, p_student_email: $result.student_email, p_new_email: $args.p_student_email, p_display_name: $before.display_name}

classroom_upsert_course:
  surface: call
  level: confirm
  describe: Add a course, or change an existing course's title or code; it asks first because a course cannot be deleted.
  say: ["add a course IDEA300 Capstone", "rename IDEA100 to Engineering Foundations", "retire the old course"]
  args:
    p_code: {name: code, describe: "The course code, like IDEA209H."}
    p_title: {name: title, describe: "The course's title."}
    p_active: {name: active, describe: "False to mark the course retired."}
    p_id: {name: course, describe: "The course's id, to change one that exists; leave it out to add one."}

classroom_upsert_section:
  surface: call
  level: undo
  describe: Add a class to a course, or change a class's label, block or teacher.
  say: ["add a Block 6 to 209H", "rename Block 2 to Period 2", "make Mr. Cosso the teacher of Block 4"]
  args:
    p_course_id: {name: course, describe: "The course's id, from your list of classes."}
    p_label: {name: label, describe: "The class's label, like Block 6."}
    p_block: {name: block, describe: "The block or period."}
    p_teacher_email: {name: teacher, describe: "The teacher of record's school address."}
    p_id: {name: class, resolve: class, describe: "The class to change; leave it out to add one."}
  before:
    table: classroom_sections
    columns: [label, block, teacher_email, course_id]
    eq: {id: $args.p_id}
  undo:
    - when: "!$args.p_id"
      function: classroom_delete_section
      args: {p_id: $result.section_id, p_confirm_label: $args.p_label}
    - when: $before.found
      function: classroom_upsert_section
      args: {p_course_id: $before.course_id, p_label: $before.label, p_block: $before.block, p_teacher_email: $before.teacher_email, p_id: $args.p_id}

classroom_upsert_unit:
  surface: call
  level: undo
  describe: Add a unit to a course, or rename one.
  say: ["add a unit called Manufacturing to 209H", "rename Unit 2 to Tolerancing", "make a new unit for the spring project"]
  args:
    p_course_id: {name: course, describe: "The course's id, from your list of classes."}
    p_name: {name: name, describe: "The unit's name."}
    p_id: {name: unit, describe: "The unit to rename; leave it out to add one."}
  before:
    table: classroom_units
    columns: [name]
    eq: {id: $args.p_id}
  undo:
    - when: $result.created
      function: classroom_delete_unit
      args: {p_id: $result.unit_id}
    - when: $before.found
      function: classroom_upsert_unit
      args: {p_course_id: $args.p_course_id, p_name: $before.name, p_id: $args.p_id}

classroom_view_as_students:
  surface: call
  level: read
  describe: The students you can preview the notebook as, from the view as picker.
  say: ["whose notebook can I preview", "list students for view as", "who can I view as"]

classroom_worksheet_latch:
  exclude: The browser records that a student's own worksheet reached complete; an instrument, never an action.

classroom_worksheet_latch_for:
  exclude: The grading console records a finished worksheet it found; an instrument, never an action a person asks for.

classroom_worksheet_latched:
  surface: call
  level: read
  describe: Which students' worksheets are recorded as finished, for some posts in a class.
  say: ["who finished the DFM worksheet", "which worksheets are marked complete", "has Mateo finished the Shop Fix"]
  args:
    p_item_ids: {name: posts, describe: "The worksheets' ids."}
    p_section_id: {name: class, resolve: class, describe: "Only this class."}

classroom_worksheet_past_manifests:
  surface: call
  level: read
  describe: The earlier question lists of HTML worksheets, from before they were edited.
  say: ["what questions did the DFM worksheet have before", "show the old version's questions", "list past question sets"]
  args:
    p_item_ids: {name: posts, describe: "The worksheets' ids."}

classroom_team_progress: {exclude: "A student reading their own team's progress inside their own assignment; it acts as the caller."}

classroom_html_retire_blocks:
  surface: call
  level: undo
  describe: Retire questions an HTML assignment's next document drops, keeping their answers for grading; replace html assignment with retire set is the usual way in.
  say: ["retire question 4 of the Blade worksheet", "keep the answers to the question I'm removing", "retire the old reflection question"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment's title as he said it."}
    p_blocks: {name: questions, describe: "Each question to retire, with its entry from the old document."}
  undo:
    - function: classroom_html_unretire_blocks
      args: {p_item_id: $args.p_item_id, p_block_ids: $result.block_ids}

classroom_html_unretire_blocks:
  surface: call
  level: confirm
  proof: generic
  describe: Stop keeping a retired question's answers for grading; it asks first.
  say: ["un-retire question 4", "stop keeping the old question's answers", "undo retiring that question"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment's title as he said it."}
    p_block_ids: {name: questions, describe: "The retired questions' ids."}

classroom_html_retired_blocks:
  surface: call
  level: read
  describe: The questions an HTML assignment's document no longer has, kept with their answers for grading.
  say: ["which questions did I retire from the Blade worksheet", "show the retired questions", "what was taken out of the DFM worksheet"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment's title as he said it."}

# ---- IDEA209H Unit 4: teams by voice (ledger 0436, 0307; Mr. Pina's addendum 2) ----
# Each entry is the function the site's own button calls, so a change here and
# a click write the same rows, the same change log and the same live notice.
# Levels are his: reads read; draw, post, rename, add team and swap undo;
# remove team, an owner change, approve and send back confirm.

classroom_preview_team_draw:
  surface: call
  level: read
  describe: Draw teams of 3 or 4 for a class at random and show them, saving nothing; it returns the seed, which draw teams takes to save exactly this draw.
  say: ["draw teams for Block 2", "make teams of four for Block 3, Mateo and Leo are absent", "show me a random team draw for Block 4"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class."}
    p_size: {name: size, describe: "3 or 4, the team size he wants; the other size makes up the remainder. Never 2 or 5."}
    p_leave_out: {name: absent, describe: "Students to leave out, each by name or school address."}
    p_seed: {name: seed, describe: "A seed from an earlier draw, to show that draw again."}

classroom_draw_teams:
  surface: call
  level: undo
  describe: Save a team draw for a class from its seed, and post it to the class when he says post it; undo retires the draw.
  say: ["save that draw", "post it", "keep these teams and show them to the class"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class."}
    p_size: {name: size, describe: "The same size as the draw he read."}
    p_leave_out: {name: absent, describe: "The same students left out as the draw he read."}
    p_seed: {name: seed, describe: "The seed the draw he read returned, so the saved teams are the ones he heard."}
    p_post: {name: post, describe: "True to show the teams to the class now."}
    p_label: {name: label, describe: "A name for the draw, like Launcher teams."}
  undo:
    - function: classroom_archive_team_set
      args: {p_team_set_id: $result.team_set_id}

classroom_swap_team_members:
  surface: call
  level: undo
  describe: Swap two students between their teams in a team draw.
  say: ["swap Mateo and Leo", "trade Ana and Daniel between teams", "switch Mateo with Leo on the Block 2 teams"]
  args:
    p_team_set_id: {name: teams, describe: "The team draw's id, from the class's team board."}
    p_first: {name: student, resolve: student, describe: "One student."}
    p_second: {name: other, resolve: student, describe: "The other student."}
  undo:
    - function: classroom_swap_team_members
      args: {p_team_set_id: $args.p_team_set_id, p_first: $args.p_first, p_second: $args.p_second}

classroom_add_team:
  surface: call
  level: undo
  describe: Add an empty team to the end of a team draw.
  say: ["add a team to Block 2", "make a sixth team", "add an empty team called Volt"]
  args:
    p_team_set_id: {name: teams, describe: "The team draw's id, from the class's team board."}
    p_name: {name: name, describe: "The team's name, if he gives one."}
  undo:
    - function: classroom_remove_team
      args: {p_team_id: $result.team_id}

classroom_remove_team:
  surface: call
  level: confirm
  proof: generic
  describe: Remove an empty team from a team draw; a team with anyone on it, or with saved work, is refused. It asks first.
  say: ["remove the empty team", "delete team 6", "get rid of the extra team"]
  args:
    p_team_id: {name: team, describe: "The team's id, from the class's team board."}

classroom_rename_team:
  surface: call
  level: undo
  describe: Rename a team; an empty name puts back Team and its number.
  say: ["rename team 3 to the Gearheads", "call the first team Torque", "change team 2's name"]
  args:
    p_team_id: {name: team, describe: "The team's id, from the class's team board."}
    p_name: {name: name, describe: "The new name, 40 characters at most."}
  undo:
    - function: classroom_rename_team
      args: {p_team_id: $args.p_team_id, p_name: $result.previous}

classroom_team_set_role:
  surface: call
  level: confirm
  proof: generic
  describe: Assign or change who owns a role on a team (frame and mount, energy store, drive, ball path); logged on the team's plan. It asks first, and after a team's first sign-off only a teacher can change it.
  say: ["make Mateo the drive owner on team 3", "give Leo the energy store", "Ana owns frame and mount now"]
  args:
    p_team_id: {name: team, describe: "The team's id, from the class's team board."}
    p_role_id: {name: role, describe: "The role's id from the assignment, like frame, energy, drive or ballpath."}
    p_owner_email: {name: student, resolve: student, describe: "The student who owns it."}

classroom_team_plan:
  surface: call
  level: read
  describe: One team's plan and tracker - tasks with owners, due dates and status, Behind and Slipping, the share split, the roles and the sign-offs.
  say: ["read team 3's plan in Block 2", "how is Team Torque doing", "who's behind on team 2"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class."}
    p_team_id: {name: team, describe: "The team's id, from the class's team board."}

classroom_team_task_set_due:
  surface: call
  level: confirm
  proof: generic
  describe: Move a team task's due date, logged on the plan; never past the post's due date, and only to a school day. It asks first.
  say: ["move the frame cut to Nov 5", "push team 3's test procedure to Thursday", "give the drive print one more day"]
  args:
    p_task_id: {name: task, describe: "The task's id, from the team's plan."}
    p_due_on: {name: due, describe: "The new due date, as YYYY-MM-DD."}

classroom_signoff_queue:
  surface: call
  level: read
  describe: The sign-off requests waiting for him, oldest first, each with its checklist and the items the site checks.
  say: ["read the sign-off queue", "who's waiting for a sign-off", "any sign-off requests"]

classroom_signoff_decide:
  surface: call
  level: confirm
  proof: generic
  describe: Approve a sign-off request, or send it back naming the items that failed; the failed items become the team's tasks. It asks first.
  say: ["approve Team Torque's design sign-off", "send team 3 back, the bearings failed", "sign off on Team Arc's plan"]
  args:
    p_request_id: {name: request, describe: "The request's id, from the sign-off queue."}
    p_results: {name: items, describe: "Every tap item's id with true for pass or false for fail; send back needs at least one false."}
    p_approve: {name: approve, describe: "True to approve, false to send back."}

classroom_machine_tag_set:
  surface: call
  level: confirm
  proof: generic
  describe: Add, rename or retire a shop machine teams can tag a task with (laser, router, printer, mill, lathe); it asks first.
  say: ["add the bandsaw to the machine list", "rename router to CNC router", "take the lathe off the machine list"]
  args:
    p_id: {name: machine, describe: "The machine's short id, letters and dashes, like bandsaw."}
    p_label: {name: label, describe: "The name teams see, like Bandsaw."}
    p_active: {name: active, describe: "False to take it off the list; tasks already tagged keep the tag."}

classroom_no_school_day_set:
  surface: call
  level: confirm
  proof: generic
  describe: Mark a date as a no-school day the team plans skip, or clear it with no label; it asks first.
  say: ["Nov 26 is a no-school day", "add Thanksgiving break to the calendar", "Nov 11 is a school day after all"]
  args:
    p_day: {name: date, describe: "The date, as YYYY-MM-DD."}
    p_label: {name: label, describe: "What the day is, like Veterans Day; leave it out to make it a school day again."}
