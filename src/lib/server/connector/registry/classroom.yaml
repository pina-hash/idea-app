  args:
    p_item_id: {name: post, resolve: post, describe: "The post."}
    p_resources: {name: links, describe: "Every link, each with a url and a label; an empty list clears them."}
  before:
    table: classroom_instructor_resources
    columns: [url, label]
    eq: {item_id: $args.p_item_id}
    order: [[sort_order, asc]]
  undo:
    - function: classroom_set_instructor_resources
      args: {p_item_id: $args.p_item_id, p_resources: $before.rows}

classroom_set_item_layout:
  surface: call
  level: undo
  describe: Choose where a post's files and links show, above or below its text.
  say: ["put the files above the text on the syllabus", "show Tolerance Check's links at the bottom", "move the files below"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The post."}
    p_files_placement: {name: files, describe: "Where the files go, as the site's layout choices name it."}
    p_links_placement: {name: links, describe: "Where the links go, as the site's layout choices name it."}
  before:
    table: classroom_items
    columns: [files_placement, links_placement]
    eq: {id: $args.p_item_id}
  undo:
    - function: classroom_set_item_layout
      args: {p_item_id: $args.p_item_id, p_files_placement: $before.files_placement, p_links_placement: $before.links_placement}

classroom_set_item_order:
  surface: call
  level: undo
  describe: Put posts in the order you say on the class page.
  say: ["put the syllabus first", "reorder the Unit 2 posts", "move Tolerance Check above the Shop Fix"]
  args:
    p_item_ids: {name: posts, describe: "The posts' ids, in the new order."}
  before:
    table: classroom_items
    columns: [id]
    in: {id: $args.p_item_ids}
    order: [[sort_order, asc], [created_at, asc]]
  undo:
    - function: classroom_set_item_order
      args: {p_item_ids: $before.rows.*.id}

classroom_set_item_public:
  surface: call
  level: undo
  describe: Make a post readable by anyone with its link, signed in or not, or make it class only again.
  say: ["make the safety reference public", "make the syllabus private again", "let parents see the Shop Rules"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The post."}
    p_public: {name: public, describe: "True for anyone with the link, false for the class only."}
  undo:
    - function: classroom_set_item_public
      args: {p_item_id: $args.p_item_id, p_public: "!$args.p_public"}

classroom_set_item_thumbnail:
