# IDEA CLASSROOM FUNCTIONS. One entry per database function the site calls.
#
#   surface: call     reached through site_call (site_find_tool lists it)
#   surface: tool     its own MCP tool (none in this file: the classroom's voice
#                     tools are the facades in tools.yaml, which write through
#                     the entries below and take each one's level and undo)
#   level:            read | undo (runs, logged, reversible) | confirm (asks first)
#   undo:             the reverse, as a list of alternatives; the first whose
#                     `when` holds and whose arguments all resolve is used.
#                     Templates: $args.<name>, $result.<path>, $before.<path>,
#                     $written.<table>.<column>, and a leading ! negates.
#   exclude: <reason> never reachable, and why

classroom_section_roster:
  # Ledger 0432: promoted to its own tool; 20 of his requests went through site_call for it.
  surface: tool
  tool: class_roster
  level: read
  describe: List the students on a class roster, with whether each is still enrolled.
  say: ["who's in 209H Block 2", "list the roster for Block 1", "show me everyone in IDEA100"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class, like 209H Block 2."}

classroom_create_item:
  surface: call
  level: undo
  describe: Create a post in one or more classes; the create post tool is the usual way in.
  say: ["create an assignment in Block 2", "post a material to IDEA100", "add an announcement to Block 4"]
  args:
    p_kind: {name: kind, enum: [assignment, material, post], describe: "assignment, material, or post for an announcement."}
    p_section_ids: {name: classes, describe: "The classes it goes to, by their ids from your list of classes."}
    p_title: {name: title, describe: "The title."}
    p_body: {name: text, describe: "The text, as plain text."}
    p_points: {name: points, describe: "Points, for an assignment."}
    p_due_at: {name: due, resolve: due, describe: "When an assignment is due, like Friday 11:59pm."}
    p_category: {name: category, describe: "The grading category, like labs."}
    p_published: {name: published, describe: "False to save it as a draft."}
    p_resources: {name: links, describe: "Links on the post, each with a url and a label."}
    p_pinned: {name: pinned, describe: "True to pin it to the top."}
    p_body_doc: {name: document, describe: "The text as a document in the site's document shape, instead of plain text."}
    p_publish_at: {name: showing, resolve: due, describe: "When it shows to students, for a scheduled post."}
    p_unit_id: {name: unit, describe: "The unit to file it under, by its id."}
  undo:
    - function: classroom_delete_item
      args: {p_id: $result.item_id}

classroom_update_item:
  surface: call
  level: undo
  describe: Edit a post's title, text, points, due date or category; the set points tool and the set due tool are the usual way in.
  say: ["rename Tolerance Check", "change the text of the syllabus post", "edit the Shop Fix's category"]
  args:
    p_id: {name: post, resolve: post, describe: "The post."}
    p_title: {name: title, describe: "The new title."}
    p_body: {name: text, describe: "The new text, as plain text."}
    p_points: {name: points, describe: "The new points."}
    p_due_at: {name: due, resolve: due, describe: "The new due time."}
    p_category: {name: category, describe: "The new grading category."}
    p_published: {name: published, describe: "True to show it, false to hide it."}
    p_resources: {name: links, describe: "The post's links, each with a url and a label."}
    p_body_doc: {name: document, describe: "The text as a document in the site's document shape."}
    p_publish_at: {name: showing, resolve: due, describe: "When it shows to students."}
    p_fields: {name: changing, describe: "The fields this edit changes, so nothing else changes."}
  undo:
    - function: classroom_restore_revision
      args: {p_revision_id: $written.classroom_content_revisions.id}

classroom_delete_item:
  surface: tool
  tool: delete_post
  level: confirm
  cleanup: drive_orphans
  describe: Delete a post from every class it is in, with its files; it asks first.
  say: ["delete the duplicate Tolerance Check post", "remove the old syllabus", "get rid of that test post"]
  args:
    p_id: {name: post, resolve: post, describe: "The post to delete."}

classroom_set_published:
  surface: call
  level: undo
  describe: Show a post to students or hide it as a draft.
  say: ["publish Tolerance Check", "unpublish the Shop Fix", "hide the reflection"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The post."}
    p_published: {name: published, describe: "True to show it, false to hide it."}
  undo:
    - function: classroom_set_published
      args: {p_item_id: $args.p_item_id, p_published: "!$args.p_published"}

classroom_set_item_pinned:
  surface: tool
  tool: pin_post
  level: undo
  describe: Pin a post to the top of its classes, or unpin it.
  say: ["pin the syllabus post in Block 4", "unpin the safety notice", "keep the rubric post at the top"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The post."}
    p_pinned: {name: pinned, describe: "True to pin it, false to unpin it."}
  undo:
    - function: classroom_set_item_pinned
      args: {p_item_id: $args.p_item_id, p_pinned: "!$args.p_pinned"}

classroom_set_rubric:
  surface: call
  level: undo
  describe: Set or clear an assignment's grading rubric; the set rubric tool is the usual way in.
  say: ["set the rubric on Tolerance Check", "clear the rubric on the Shop Fix", "replace the DFM rubric"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment."}
    p_criteria: {name: criteria, describe: "Every criterion with its id, name, points and score bands, or nothing to clear it."}
  undo:
    - function: classroom_restore_revision
      args: {p_revision_id: $written.classroom_content_revisions.id}
    - function: classroom_set_rubric
      args: {p_item_id: $args.p_item_id, p_criteria: null}

classroom_set_html_assignment:
  surface: call
  level: undo
  describe: Store an HTML assignment's document; the replace html assignment tool is the way in, because it checks students' answers first.
  say: ["upload the Shop Fix HTML", "replace the DFM worksheet document", "attach this HTML file to the assignment"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment."}
    p_document: {name: document, describe: "The whole HTML document."}
    p_manifest: {name: manifest, describe: "The document's question list, as the importer reads it."}
    p_filename: {name: filename, describe: "The file's name."}
  undo:
    - function: classroom_restore_revision
      args: {p_revision_id: $written.classroom_content_revisions.id}
    - function: classroom_set_html_assignment
      args: {p_item_id: $args.p_item_id, p_document: null, p_manifest: null, p_filename: null}

classroom_item_revisions:
  surface: call
  level: read
  describe: List the earlier versions of a post, its rubric and its document, newest first.
  say: ["what versions of Tolerance Check are there", "show the Shop Fix's history", "list the rubric's old versions"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The post."}

classroom_restore_revision:
  surface: call
  level: undo
  describe: Put a post, its rubric or its document back the way an earlier version had it.
  say: ["restore the previous version of Tolerance Check", "put the old rubric back", "roll the Shop Fix back to yesterday's version"]
  args:
    p_revision_id: {name: version, describe: "The version's id, from the list of earlier versions."}
  undo:
    - function: classroom_restore_revision
      args: {p_revision_id: $written.classroom_content_revisions.id}

classroom_grade_direct:
  surface: call
  level: undo
  describe: Record a score out of the assignment's total for one student; the grade tool is the usual way in.
  say: ["grade Mateo 18 out of 20", "score Leo's Shop Fix", "record Ana's grade"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment."}
    p_student_email: {name: student, resolve: student, describe: "The student."}
    p_score: {name: score, describe: "The score."}
    p_comment: {name: comment, describe: "A comment the student reads."}
    p_return: {name: return, describe: "True to return it now, false to hold it."}
    p_extra_credit: {name: extra, describe: "Extra credit points, if any."}
  undo:
    - when: $before.graded
      function: classroom_grade_direct
      args:
        p_item_id: $args.p_item_id
        p_student_email: $args.p_student_email
        p_score: $before.score
        p_comment: $before.comment
        p_return: $before.returned
        p_extra_credit: $before.extra_credit
    - function: classroom_revoke_grade
      args: {p_item_id: $args.p_item_id, p_student_email: $args.p_student_email}

classroom_revoke_grade:
  surface: tool
  tool: revoke_grade
  level: undo
  describe: Take a grade off a student's work entirely, keeping a copy that can be put back.
  say: ["revoke Mateo's grade on the Shop Fix", "take Leo's score off Tolerance Check", "clear Ana's grade"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment."}
    p_student_email: {name: student, resolve: student, describe: "The student."}
  undo:
    - function: classroom_restore_grade
      args: {p_item_id: $args.p_item_id, p_student_email: $args.p_student_email}

classroom_restore_grade:
  surface: call
  level: undo
  describe: Put back a grade that was revoked, exactly as it was.
  say: ["put Mateo's grade back", "restore Leo's score on Tolerance Check", "undo revoking Ana's grade"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment."}
    p_student_email: {name: student, resolve: student, describe: "The student."}
  undo:
    - function: classroom_revoke_grade
      args: {p_item_id: $args.p_item_id, p_student_email: $args.p_student_email}

classroom_feedback_post:
  surface: call
  level: undo
  describe: Leave a note on a student's work in progress; the send feedback tool is the usual way in.
  say: ["leave Mateo a note", "send Leo feedback on the Shop Fix", "comment on Ana's worksheet"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment."}
    p_student_email: {name: student, resolve: student, describe: "The student."}
    p_block_id: {name: question, describe: "One question's block id, to pin the note to it."}
    p_file_id: {name: picture, describe: "One handed-in picture's id, to draw on it."}
    p_body: {name: message, describe: "What the note says."}
    p_marks: {name: drawing, describe: "A drawing on the picture, in the site's drawing shape."}
  undo:
    - function: classroom_feedback_remove
      args: {p_thread_id: $result.thread.id}

classroom_feedback_remove:
  surface: call
  level: confirm
  describe: Remove a feedback note, or one message in it; it asks first.
  say: ["delete that feedback", "remove my note to Mateo", "take down the comment on Leo's work"]
  args:
    p_thread_id: {name: note, describe: "The note's id, from the feedback list."}
    p_message_id: {name: message, describe: "One message in the note, to remove only that message."}

classroom_feedback_list:
  surface: call
  level: read
  describe: List the feedback notes on an assignment, a student or a class, with every reply.
  say: ["what feedback have I left on the Shop Fix", "show my notes to Mateo", "which notes are waiting on students"]
  args:
    p_item_id: {name: post, resolve: post, describe: "Only notes on this assignment."}
    p_student_email: {name: student, resolve: student, describe: "Only notes to this student."}
    p_section_id: {name: class, resolve: class, describe: "Only notes in this class."}

classroom_quick_post_create:
  surface: call
  level: undo
  describe: Put a short notice at the top of one or more class pages until a time you choose; the create post tool with kind notice is the usual way in.
  say: ["put up a notice in Block 1", "post a notice to every 209H class", "notice until 3pm, shop closed"]
  args:
    p_section_ids: {name: classes, describe: "The classes it goes to, by their ids from your list of classes."}
    p_body: {name: text, describe: "What the notice says."}
    p_expires_at: {name: until, resolve: due, describe: "When it comes down, like end of day or Friday 3pm."}
  undo:
    - function: classroom_quick_post_take_down
      args: {p_post_id: $result.id}

classroom_quick_post_take_down:
  surface: call
  level: confirm
  describe: Take a notice down before its time; it asks first.
  say: ["take down the shop closed notice", "remove the notice in Block 1", "end that notice now"]
  args:
    p_post_id: {name: notice, describe: "The notice: words from it as he says them, or its id."}

classroom_quick_post_set_important:
  surface: call
  level: undo
  describe: Mark a notice important so it stands out at the top of the class page, or not important again.
  say: ["make the shop notice important", "mark that notice important", "it doesn't need to be important anymore"]
  args:
    p_post_id: {name: notice, describe: "The notice: words from it as he says them, or its id."}
    p_important: {name: important, describe: "True for important, false for ordinary."}
  undo:
    - function: classroom_quick_post_set_important
      args: {p_post_id: $args.p_post_id, p_important: "!$args.p_important"}

classroom_quick_posts:
  surface: call
  level: read
  describe: List the notices up in a class right now.
  say: ["what notices are up in Block 1", "show the notices in 209H", "is the safety notice still up"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class."}

classroom_student_overview:
  surface: call
  level: read
  describe: One student's page in one class, with their work, grades, notebook and activity.
  say: ["how is Mateo doing in Block 2", "show me Leo's overview", "what's missing for Ana in IDEA100"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class."}
    p_student_email: {name: student, resolve: student, describe: "The student."}

# ---------------------------------------------------------------------------
# Ledger 0401: every other classroom function the site calls. A file's bytes,
# a browser's own instruments and a student's own actions are excluded with
# their reasons; everything else is a call entry, a few promoted to tools.
#
#   before:   what to read, as him, before a write, so its undo can set a
#             value back: {table, columns, eq, in, order}. $before.<column> is
#             the first row's value, $before.rows every row, $before.found
#             whether a row was there.
#   cleanup:  what to remove after a delete commits, exactly as the site's own
#             delete route does (rows first, then files; a failed sweep is not
#             a failed delete).
#   each:     an undo that is one call per value of a list.
# ---------------------------------------------------------------------------

classroom_add_attachment:
  exclude: Records a file the browser has just uploaded to storage; a file's bytes cannot come through a chat.

classroom_add_instructor_attachment:
  exclude: Records an instructor-only file the browser has just uploaded to storage; a file's bytes cannot come through a chat.

classroom_add_postings:
  surface: call
  level: undo
  describe: Post an existing post to more of your classes, so the same post shows in each.
  say: ["post Tolerance Check to Block 4 too", "add the syllabus to every 209H class", "share the Shop Fix with IDEA100"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The post."}
    p_section_ids: {name: classes, describe: "The classes to add it to, by their ids from your list of classes."}
  undo:
    - each: $args.p_section_ids
      function: classroom_remove_posting
      args: {p_item_id: $args.p_item_id, p_section_id: $each}

classroom_add_submission_file:
  exclude: A student handing in a file on their own assignment; the bytes come from their browser and it acts as the caller.

classroom_approve_module:
  surface: call
  level: undo
  describe: Approve, or take back approval of, one module of a student's interactive assignment so they can move on.
  say: ["approve Mateo's first module on the DFM worksheet", "sign off Leo's sketch module", "unapprove Ana's module two"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment."}
    p_student_email: {name: student, resolve: student, describe: "The student."}
    p_module_id: {name: module, describe: "The module's id, from the assignment."}
    p_approved: {name: approved, describe: "True to approve, false to take approval back."}
  undo:
    - function: classroom_approve_module
      args: {p_item_id: $args.p_item_id, p_student_email: $args.p_student_email, p_module_id: $args.p_module_id, p_approved: "!$args.p_approved"}

classroom_archive_team_set:
  surface: call
  level: confirm
  describe: Retire a saved team draw so it no longer shows anywhere; it asks first because nothing brings it back.
  say: ["retire the old Block 2 teams", "archive last month's teams", "get rid of the test team draw"]
  args:
    p_team_set_id: {name: teams, describe: "The team draw's id, from the class's team board."}

classroom_close_assignment:
  surface: tool
  tool: close_assignment
  level: undo
  describe: Close an assignment so students can no longer change their work, or reopen it, for one student or the whole class.
  say: ["close the Shop Fix assignment in Block 4", "reopen Mateo's Shop Fix so he can resubmit", "open Tolerance Check back up for everyone", "close Leo's reflection"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment's title as you said it."}
    p_student_email: {name: student, resolve: student, describe: "One student. Leave it out for everyone the assignment is posted to."}
    p_closed: {name: closed, required: true, describe: "True to close it, false to reopen it."}
  undo:
    - function: classroom_close_assignment
      args: {p_item_id: $args.p_item_id, p_student_email: $args.p_student_email, p_closed: "!$args.p_closed"}

classroom_course_categories:
  surface: call
  level: read
  describe: The grading categories used in your courses, such as labs, quizzes and projects.
  say: ["what grading categories do I use", "list the categories in 209H", "which categories does IDEA100 have"]
  args:
    p_course_ids: {name: courses, describe: "The courses, by their ids from your list of classes."}

classroom_deck_ingest_abandon:
  exclude: A step of the staged slide deck upload, which the browser drives with the zip file's bytes.
classroom_deck_ingest_begin:
  exclude: A step of the staged slide deck upload, which the browser drives with the zip file's bytes.
classroom_deck_ingest_claim_stage:
  exclude: A step of the staged slide deck upload, which the browser drives with the zip file's bytes.
classroom_deck_ingest_finish:
  exclude: A step of the staged slide deck upload, which the browser drives with the zip file's bytes.
classroom_deck_ingest_record:
  exclude: A step of the staged slide deck upload, which the browser drives with the zip file's bytes.
classroom_deck_upload_cancel:
  exclude: A step of the staged slide deck upload, which the browser drives with the zip file's bytes.
classroom_deck_upload_claim:
  exclude: A step of the staged slide deck upload, which the browser drives with the zip file's bytes.
classroom_deck_upload_start:
  exclude: A step of the staged slide deck upload, which the browser drives with the zip file's bytes.

classroom_delete_attachment:
  surface: call
  level: confirm
  cleanup: classroom_attachment
  describe: Delete one file from a post, and the stored file with it when nothing else uses it; it asks first.
  say: ["delete the old handout from Tolerance Check", "remove that PDF from the Shop Fix", "take the wrong file off the post"]
  args:
    p_id: {name: file, describe: "The file's id, from the post's files."}

classroom_delete_deck:
  surface: call
  level: confirm
  cleanup: drive_orphans
  describe: Delete the slide deck attached to a post; it asks first.
  say: ["delete the deck from the Unit 2 post", "remove the slides from Tolerance Check", "take the old deck off"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The post whose deck to delete."}

classroom_delete_instructor_attachment:
  surface: call
  level: confirm
  cleanup: classroom_instructor_attachment
  describe: Delete one instructor-only file from a post; it asks first.
  say: ["delete the answer key file from the Shop Fix", "remove my teacher notes file", "take the old key off Tolerance Check"]
  args:
    p_id: {name: file, describe: "The file's id, from the post's instructor-only files."}

classroom_delete_section:
  surface: call
  level: confirm
  describe: Delete a class entirely, with its roster and postings; it asks first and needs the class's label typed exactly.
  say: ["delete the test class", "remove the empty Block 9 section", "delete last year's IDEA100 Block 3"]
  args:
    p_id: {name: class, resolve: class, describe: "The class to delete."}
    p_confirm_label: {name: label, describe: "The class's label, exactly as the site shows it, to confirm."}

classroom_delete_submission_file:
  exclude: A student removing a file from their own hand-in; it acts as the caller.

classroom_delete_unit:
  surface: call
  level: confirm
  describe: Delete a unit from a course; its posts stay but become unfiled; it asks first.
  say: ["delete the empty Unit 7", "remove the test unit from 209H", "get rid of the Spring unit"]
  args:
    p_id: {name: unit, describe: "The unit's id, from the course's units."}

classroom_designate_instructor_key:
  surface: call
  level: undo
  describe: Make your own filled-in copy of an assignment its answer key.
  say: ["make my copy the answer key for the DFM worksheet", "use my answers as the key", "set my working copy as the key"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment."}
  undo:
    - function: classroom_undesignate_instructor_key
      args: {p_item_id: $args.p_item_id}

classroom_duplicate_drafts:
  surface: call
  level: read
  describe: Find posts that were accidentally made twice in a class, with which copy to keep.
  say: ["are there duplicate posts in Block 2", "find double posts", "which posts did I make twice"]
  args:
    p_section_id: {name: class, resolve: class, describe: "Only this class; leave it out for all of them."}

classroom_duplicate_item:
  surface: tool
  tool: duplicate_post
  level: undo
  describe: Make a copy of a post, with its files, rubric and settings, in the classes you choose.
  say: ["copy Tolerance Check to Block 4", "duplicate the Shop Fix", "make a copy of the syllabus post for IDEA100"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The post to copy."}
    p_section_ids: {name: classes, describe: "The classes the copy goes to, by their ids; leave it out for the same classes."}
  undo:
    - function: classroom_delete_item
      args: {p_id: $result.item_id}

classroom_feedback_reply:
  surface: call
  level: undo
  describe: Answer a student's reply on a feedback note, in the same conversation.
  say: ["reply to Mateo's note, yes that works", "answer Leo on the Shop Fix note", "tell Ana that fixed it"]
  args:
    p_thread_id: {name: note, describe: "The note's id, from the feedback list."}
    p_body: {name: message, describe: "What your reply says."}
  undo:
    - function: classroom_feedback_remove
      args: {p_thread_id: $args.p_thread_id, p_message_id: $written.classroom_feedback_messages.id}

classroom_feedback_seen:
  surface: call
  level: confirm
  describe: Mark every feedback note on an assignment as seen, for one student or all of them; it asks first because it is a bulk change nothing can clear.
  say: ["mark all of Block 1's Shop Fix feedback as seen", "mark Mateo's notes as read", "clear the unread feedback on Tolerance Check"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment."}
    p_student_email: {name: student, resolve: student, describe: "One student; leave it out for every student."}

classroom_feedback_set_state:
  surface: call
  level: undo
  describe: Resolve a feedback note, or reopen one that was resolved.
  say: ["resolve the note on Mateo's sketch", "reopen Leo's feedback", "mark Ana's note done"]
  args:
    p_thread_id: {name: note, describe: "The note's id, from the feedback list."}
    p_state: {name: state, enum: [resolved, open], describe: "resolved, or open to reopen it."}
  undo:
    - function: classroom_feedback_set_state
      args: {p_thread_id: $args.p_thread_id, p_state: {map: $args.p_state, values: {resolved: open, open: resolved}}}

classroom_feedback_update:
  surface: call
  level: confirm
  describe: Rewrite the words of a feedback note you left; it asks first because the old words are not kept.
  say: ["change my note to Mateo to say cite page 4", "edit the feedback on Leo's sketch", "reword Ana's note"]
  args:
    p_thread_id: {name: note, describe: "The note's id, from the feedback list."}
    p_body: {name: message, describe: "The note's new words."}
    p_marks: {name: drawing, default: null, describe: "A drawing on the picture; leave it out to keep the drawing as it is."}

classroom_grade_revocation:
  surface: call
  level: read
  describe: Whether a student's revoked grade can be put back, and what it was.
  say: ["can I put Mateo's grade back", "what was Leo's revoked score", "is there a saved grade for Ana"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment."}
    p_student_email: {name: student, resolve: student, describe: "The student."}

classroom_grade_submission:
  surface: call
  level: undo
  describe: Grade a student's work criterion by criterion on the assignment's rubric, with an optional comment.
  say: ["grade Mateo's Tolerance Check, accuracy 8, drawing 9", "score Leo on the rubric", "give Ana full marks on each criterion"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment."}
    p_student_email: {name: student, resolve: student, describe: "The student."}
    p_scores: {name: scores, describe: "The points for each criterion, keyed by the criterion's id from the rubric."}
    p_comment: {name: comment, default: null, describe: "A comment the student reads with the grade."}
    p_return: {name: return, default: true, describe: "True to return it to the student now, false to hold it."}
    p_criterion_comments: {name: notes, default: null, describe: "A comment on each criterion, keyed by its id."}
    p_extra_credit: {name: extra, default: null, describe: "Extra credit points, if any."}
  before:
    table: classroom_submissions
    columns: [rubric_scores, teacher_comment, returned_at, graded_at, criterion_comments, extra_credit]
    eq: {item_id: $args.p_item_id, student_email: $args.p_student_email}
  undo:
    - when: $before.rubric_scores
      function: classroom_grade_submission
      args:
        p_item_id: $args.p_item_id
        p_student_email: $args.p_student_email
        p_scores: $before.rubric_scores
        p_comment: $before.teacher_comment
        p_return: "!!$before.returned_at"
        p_criterion_comments: $before.criterion_comments
        p_extra_credit: $before.extra_credit
    - when: "!$before.graded_at"
      function: classroom_revoke_grade
      args: {p_item_id: $args.p_item_id, p_student_email: $args.p_student_email}

classroom_grade_submissions:
  surface: call
  level: confirm
  describe: Grade many students' work on one assignment at once; it asks first because it is a bulk change with no preview per student.
  say: ["grade the whole class on the Shop Fix", "give everyone in Block 2 a 10 on the check in", "batch grade Tolerance Check"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment."}
    p_grades: {name: grades, describe: "Each student's address with their scores, comment and extra credit."}
    p_return: {name: return, describe: "True to return the grades now, false to hold them."}

# GRADING A TEAM ASSIGNMENT FROM A CHAT (ledger 0438): the Teams screen's own
# function, once per team, with the team id the grading packet lists.
classroom_grade_team:
  surface: call
  level: confirm
  proof: generic
  describe: Grade one team on a team assignment, team and role scores once for the team and any per-student scores; it asks first.
  say: ["grade the Torque team on the Unit 4 assignment", "give team 3 a 9 on design and 8 on build", "score the Gearheads and return it"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The team assignment."}
    p_team_id: {name: team, describe: "The team's id, from the grading packet's teams."}
    p_scores: {name: scores, describe: "Team and role criterion scores, keyed by the rubric criterion's id from the grading packet."}
    p_member_scores: {name: studentScores, default: null, describe: "Each student's own criterion scores, keyed by their address, then by criterion id."}
    p_comment: {name: comment, default: null, describe: "A comment every member reads with the grade."}
    p_criterion_comments: {name: notes, default: null, describe: "A comment on each criterion, keyed by its id."}
    p_return: {name: return, default: false, describe: "True to return it to the team now, false to hold it."}

classroom_team_grading:
  surface: call
  level: read
  describe: One team's grading screen on a team assignment, the roles and who owns them, and each member's grade as it stands.
  say: ["show the Torque team's grades on Unit 4", "who owns which role on team 3", "what did I give the Gearheads"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The team assignment."}
    p_team_id: {name: team, describe: "The team's id, from the grading packet's teams."}

classroom_hall_pass_close_by_id:
  surface: call
  level: confirm
  describe: Check a student back in from a hall pass; it asks first because a closed pass cannot be reopened and a long one may fine them.
  say: ["check Mateo back in", "close Leo's hall pass", "end the pass Ana is on"]
  args:
    p_pass_id: {name: pass, describe: "The pass's id, from the class's hall pass state."}

classroom_hall_pass_events:
  surface: call
  level: read
  describe: Today's hall pass record for a class, with who went, when and for how long.
  say: ["how did the hall pass go in Block 2 today", "who used the hall pass in Block 4", "show today's passes"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class."}
    p_limit: {name: count, describe: "How many passes to list."}

classroom_hall_pass_open_for:
  surface: tool
  tool: open_hall_pass
  level: undo
  describe: Send a student out on the hall pass from your class.
  say: ["open a hall pass for Mateo", "Leo is going to the bathroom", "give Ana the hall pass"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class, like 209H Block 2."}
    p_student_email: {name: student, resolve: student, describe: "The student, as you said the name."}
  undo:
    - function: classroom_hall_pass_close_by_id
      args: {p_pass_id: $result.pass_id}

classroom_hall_pass_set_limits:
  surface: call
  level: undo
  describe: Set a class's hall pass minutes per day and when a pass checks itself back in.
  say: ["give Block 2 fifteen hall pass minutes a day", "set the auto check in to 12 minutes", "put Block 4 back on the default hall pass limits"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class."}
    p_daily_minutes: {name: daily, describe: "Minutes each student gets a day; leave it out for the default."}
    p_auto_minutes: {name: auto, describe: "Minutes after which a pass checks itself back in; leave it out for the default."}
  before:
    table: classroom_sections
    columns: [hall_pass_daily_minutes, hall_pass_auto_minutes]
    eq: {id: $args.p_section_id}
  undo:
    - function: classroom_hall_pass_set_limits
      args: {p_section_id: $args.p_section_id, p_daily_minutes: $before.hall_pass_daily_minutes, p_auto_minutes: $before.hall_pass_auto_minutes}

classroom_hall_pass_state:
  surface: call
  level: read
  describe: Who is out on the hall pass in a class right now, and each student's minutes left today.
  say: ["who's out of Block 2 right now", "is anyone on the hall pass", "how many minutes does Mateo have left"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class."}
    p_history_limit: {name: count, describe: "How many recent passes to include."}

classroom_import_roster:
  surface: call
  level: confirm
  describe: Import a roster of students into classes at once; it asks first because it is a bulk change.
  say: ["import this roster", "add these thirty students to their classes", "load the new term's roster"]
  args:
    p_rows: {name: rows, describe: "One row per student, each with the class, the student's address and their name."}

classroom_manages_section:
  surface: call
  level: read
  describe: Whether you can manage a class, as the site decides it.
  say: ["can I manage Block 2", "am I a teacher of Block 4", "do I run IDEA100 Block 1"]
  args:
    p_section_id: {name: class, resolve: class, describe: "The class."}

classroom_mark_item_viewed:
  exclude: The browser records that a reader opened a post; an instrument, never an action a person asks for.

classroom_move_team_member:
  surface: call
  level: confirm
  describe: Move a student from one team to another in a saved team draw; it asks first because the team they left is not kept.
  say: ["move Mateo to team 3", "put Leo on Ana's team", "swap Daniel into team 2"]
  args:
    p_team_set_id: {name: teams, describe: "The team draw's id, from the class's team board."}
    p_student_email: {name: student, resolve: student, describe: "The student."}
    p_to_team_id: {name: team, describe: "The team to move them to, by its id from the team board."}

classroom_open_submission:
  exclude: A student starting their own hand-in; it acts as the caller. Reopening a student's work is close assignment with closed false.

classroom_post_team_set:
  surface: call
  level: undo
  describe: Show a saved team draw on the class page until a time you choose.
  say: ["post the Block 2 teams until Friday", "show the teams to the class", "put the team list up"]
  args:
    p_team_set_id: {name: teams, describe: "The team draw's id, from the class's team board."}
    p_visible_until: {name: until, resolve: due, describe: "When it comes down, like Friday 3pm; leave it out to keep it up."}
  undo:
    - function: classroom_unpost_team_set
      args: {p_team_set_id: $args.p_team_set_id}

classroom_posting_perfect_scores:
  surface: call
  level: read
  describe: Which classes of a post pay the Perfect Score coin award, and who has earned it.
  say: ["does the Shop Fix pay perfect score coins", "who got perfect scores on Tolerance Check", "which classes have perfect score on"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment."}

classroom_presence_ping:
  exclude: The heartbeat a student's open assignment page sends; an instrument, never an action.

classroom_presence_state:
  surface: call
  level: read
  describe: Who is working on an assignment right now, and for how long, as the live tab shows it.
  say: ["who's working on the Shop Fix right now", "is Mateo on Tolerance Check", "who's idle in Block 2"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The assignment."}
    p_section_id: {name: class, resolve: class, describe: "Only this class."}

classroom_public_attachment:
  surface: call
  level: read
  describe: A file on a public post, as a visitor with no account would reach it.
  say: ["can visitors open that file", "check the public link for the handout", "is the syllabus file public"]
  args:
    p_attachment_id: {name: file, describe: "The file's id."}

classroom_public_reference:
  surface: call
  level: read
  describe: A post a teacher made public, as a visitor with no account sees it.
  say: ["what does the public reference page show", "is the safety reference public", "show the public version of the syllabus"]
  args:
    p_item_id: {name: post, resolve: post, describe: "The post."}

classroom_quick_post_add_file:
  exclude: Records a file the browser has just uploaded for a notice; a file's bytes cannot come through a chat.

classroom_quick_post_file:
