# THE CONNECTOR'S OWN FUNCTIONS. The shape is described at the top of
# classroom.yaml.

connector_call:
  exclude: The connector's own transport; every connector write goes through it, so it is never a tool of its own.

connector_audit_failure:
  exclude: Records a failed connector write on its own statement; the connector calls it, never a person.

connector_admin_state:
  surface: call
  level: read
  describe: Whether the connector is on, and every connection with when it was made and last used.
  say: ["is the connector on", "what's connected to the site", "list my Claude connections"]

connector_admin_audit:
  surface: call
  level: read
  describe: The connector's own log of every change made through Claude, newest first.
  say: ["what have you changed today", "show the connector log", "list the changes you made this week"]
  args:
    p_tool: {name: tool, describe: "Only changes made by this tool."}
    p_day: {name: day, describe: "Only changes on this day, in school time."}
    p_limit: {name: limit, describe: "At most this many rows, up to 200."}

connector_admin_set_enabled:
  surface: call
  level: confirm
  describe: Switch the connector off for every connection, or back on from the admin page; it asks first.
  say: ["turn the connector off", "switch off Claude's access", "shut the connector down"]
  args:
    p_enabled: {name: on, describe: "False to switch it off. It can only be switched back on from the site."}

connector_admin_disconnect:
  surface: call
  level: confirm
  describe: Disconnect one Claude connection; it asks first.
  say: ["disconnect the laptop connection", "revoke that connection", "sign that Claude out"]
  args:
    p_token_id: {name: connection, describe: "The connection's id, from the list of connections."}

connector_admin_disconnect_all:
  surface: call
  level: confirm
  describe: Disconnect every Claude connection at once; it asks first.
  say: ["disconnect everything", "sign every Claude connection out", "revoke all connector access"]

# ---------------------------------------------------------------------------
# Ledger 0401: the request log, saved requests and gaps (DESIGN.md section 9).
# ---------------------------------------------------------------------------

connector_request_log:
  exclude: The connector's own record of each request, written by the server after every tool call; never a tool of its own.

connector_report_gap:
  exclude: Written by the report gap tool and by the server when site_call names an action the site does not have; never called on its own.

connector_eval_record:
  exclude: Written by the record eval result tool during a replay of the saved requests; never called on its own.

connector_endpoint_begin:
  exclude: The audit row the server writes before it runs a site route as him; never a tool of its own.

connector_endpoint_finish:
  exclude: The audit row the server completes after it runs a site route as him; never a tool of its own.

connector_admin_gaps:
  surface: call
  level: read
  describe: The things he asked for that the site cannot do yet, open ones first, with what was tried.
  say: ["what can't the connector do yet", "show the open gaps", "what have I asked for that isn't built"]
  args:
    p_status: {name: status, enum: [open, built, declined], describe: "Only gaps in this state: open, built or declined."}

connector_admin_set_gap:
  surface: call
  level: undo
  describe: Mark a gap as built, with the ledger number that built it, or as declined, or open again.
  say: ["mark the seating chart gap built in 0402", "decline the parent email gap", "reopen that gap"]
  args:
    p_id: {name: gap, describe: "The gap's id, from the list of gaps."}
    p_status: {name: status, enum: [open, built, declined], describe: "open, built or declined."}
    p_ledger: {name: ledger, describe: "For built: the four digit ledger number that built it."}
    p_note: {name: note, describe: "A note about it."}
  before:
    rpc: connector_admin_gaps
    args: {}
    find: {id: $args.p_id}
  undo:
    - when: $before.found
      function: connector_admin_set_gap
      args: {p_id: $args.p_id, p_status: $before.status, p_ledger: $before.built_ledger, p_note: null}

connector_admin_evals:
  surface: call
  level: read
  describe: Every saved request with what must happen, its expected path and its last practice result; the replay starts here.
  say: ["list the saved requests", "which requests failed last night", "show the request list"]

connector_lookup:
  surface: call
  level: read
  describe: Find a record's id by its name, for any action that needs one, like a class, post, notice, person, tournament, Foundry app, market card, contract or certification.
  say: ["what's the id of the tissue box card", "find the Blade Night tournament", "look up the go cart contract"]
  args:
    p_kind: {name: kind, enum: [section, course, post, quick_post, student, user, tournament, app, listing, contract, track, challenge, team_set, stock, project, cert, role_holder], describe: "What kind of record."}
    p_said: {name: name, describe: "Its name, as he said it."}
