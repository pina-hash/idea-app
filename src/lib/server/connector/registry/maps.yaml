# IDEA MAPS FUNCTIONS. The shape is described at the top of classroom.yaml.

maps_editor_grant:
  surface: call
  level: undo
  describe: Let someone edit one part of IDEA Maps, such as a room or a cabinet, and what is inside it.
  say: ["let Mateo edit the shop map", "give Leo editing on the tool wall", "Ana can edit room 214"]
  args:
    p_email: {name: person, describe: "Their school address."}
    p_node_id: {name: place, describe: "The place's id, from the map."}
    p_note: {name: note, describe: "Why, in your words."}
  undo:
    - function: maps_editor_revoke
      args: {p_email: $args.p_email, p_node_id: $args.p_node_id}

maps_editor_revoke:
  surface: call
  level: undo
  describe: Take back someone's editing on one part of IDEA Maps.
  say: ["stop Mateo editing the shop map", "remove Leo's tool wall editing", "Ana is done editing room 214"]
  args:
    p_email: {name: person, describe: "Their school address."}
    p_node_id: {name: place, describe: "The place's id, from the map."}
  before:
    table: maps_editor_grants
    columns: [note]
    eq: {email: $args.p_email, node_id: $args.p_node_id}
  undo:
    - when: $before.found
      function: maps_editor_grant
      args: {p_email: $args.p_email, p_node_id: $args.p_node_id, p_note: $before.note}

maps_editor_roster:
  surface: call
  level: read
  describe: Who can edit IDEA Maps, everywhere or in one place.
  say: ["who can edit the map", "list map editors", "who edits the shop"]
  args:
    p_node_id: {name: place, describe: "Only this place, by its id."}

maps_my_editor_grants:
  surface: call
  level: read
  describe: The places in IDEA Maps you can edit.
  say: ["what can I edit on the map", "my map editing", "where am I a map editor"]

maps_publish:
  surface: call
  level: confirm
  describe: Publish the pending edits to one place or item on IDEA Maps so everyone sees them; it asks first because publishing clears the draft history.
  say: ["publish the shop map changes", "make the tool wall edits live", "publish room 214"]
  args:
    p_object_table: {name: kind, describe: "What it is, as the map editor names the kind."}
    p_object_id: {name: place, describe: "Its id, from the map editor."}

maps_search:
  surface: call
  level: read
  describe: Search IDEA Maps for a room, a tool or a part, and say where it is.
  say: ["where are the calipers", "find the drill press on the map", "which cabinet has the taps"]
  args:
    p_query: {name: query, describe: "What to look for."}
    p_limit: {name: count, describe: "How many to list."}
