name: Deploy

# THE ONE PATH THAT WRITES `main`, AND THEREFORE THE ONE PATH THAT DEPLOYS
# `ideabosco.com`. It merges `integration` into `main` with `--no-ff` after CI
# has run on `integration`'s exact tip, and only when every migration in range
# is already applied to production -- read from production's own catalog, or,
# where the machine cannot read it, asserted by a person who typed so.
#
# ---------------------------------------------------------------------------
# IT WAS A BUTTON, AND WHAT MADE IT ONE IS GONE.
#
# `integrate.yml`'s header gives two reasons no machine may push `main`. A
# night window answered the first and not the second:
#
#   * Students are on the site during class. A deploy at 03:00 Pacific removes
#     that risk, which is exactly why an unattended nightly deploy kept getting
#     proposed.
#   * Migrations are applied BY HAND in the Supabase SQL editor, and several
#     must be applied BEFORE the code that calls them goes live. CI cannot see
#     this: the suite runs against an embedded Postgres with every migration
#     file applied, so a branch whose migration has never touched production is
#     green. A nightly merge would ship an RPC call to a function the database
#     does not have, at night, with nobody watching.
#
# The typed confirmation was the second bullet, asked of a person because
# nothing could ask the database. `docs/decisions/entries/10-unattended-nightly-deploy.md`
# recorded that as the blocker and "not yet" as the answer, and named exactly
# what would unblock it: a read-only Postgres credential in a GitHub secret.
# Mr. Pina approved that on 2026-09-03. `tools/deploy-probe.mjs` now reads
# production's `pg_catalog` with it and answers per migration, so the second
# bullet is answered by the thing it is about.
#
# WHAT IS STILL A PERSON'S. Applying a migration. That needs a credential that
# can WRITE to production, which nothing in CI and no cloud session may hold.
# When this refuses, the job summary prints the SQL of every unapplied
# migration in a copyable block, so the remaining step is paste and run.
#
# ---------------------------------------------------------------------------
# THE PROBE NEVER TREATS AN UNKNOWN AS APPLIED, and its four exit statuses are
# the whole of the contract (`tools/deploy-probe.mjs` header):
#
#   0  every migration in range is applied            -> deploy
#   2  at least one is NOT applied                    -> REFUSE, on any trigger
#   3  every probe that ran said applied, but at least one migration has no
#      probe to run                                   -> the machine is silent
#   1  the probe could not run at all (no secret, unreachable, query error)
#                                                     -> the machine is silent
#
# WHERE THE MACHINE IS SILENT, A PERSON MAY STILL SPEAK, AND ONLY ON THE
# BUTTON. 1 and 3 are not "applied" and are never read as one: on a scheduled
# run they stop the deploy, quietly, because nothing is wrong and a red mark
# every night is a red mark nobody reads. On `workflow_dispatch` the typed
# confirmation below is what carries them, exactly as it carried everything
# before this bundle -- so the fallback is today's safety level, kept for a
# checkout with no secret, and the summary says which path was taken and which
# migrations a person asserted. Status 2 is a machine-read FACT about
# production and no typed string overrides it.
# ---------------------------------------------------------------------------

on:
  # 03:00 Pacific (10:00 UTC), which is the night window decision 0010 was
  # about. GitHub only runs a schedule from the DEFAULT BRANCH, so this does
  # nothing until it reaches `main`.
  schedule:
    - cron: '0 10 * * *'

  workflow_dispatch:
    inputs:
      confirm:
        description: 'Only needed if the probe cannot read production. Type exactly: every migration on integration is applied to production'
        required: false
        type: string

# SERIALIZE, AND NEVER CANCEL. Two deploys merging into `main` at once produce
# a rejected push at best. `cancel-in-progress: false` makes a second press
# WAIT rather than killing a run that may already have pushed.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------------
  # 1. Refuse early. A wrong phrase must not cost a five-minute CI run, and
  #    the ancestry check is the difference between a deploy and a surprise.
  # ------------------------------------------------------------------------
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      integration_sha: ${{ steps.resolve.outputs.sha }}
      integration_subject: ${{ steps.resolve.outputs.subject }}
      ahead: ${{ steps.resolve.outputs.ahead }}
      proceed: ${{ steps.resolve.outputs.proceed }}
      confirmed: ${{ steps.confirm.outputs.confirmed }}
    steps:
      - name: Check the typed confirmation, if one was typed
        id: confirm
        env:
          # Through env, never interpolated into the script body: `${{ }}`
          # pastes a person's typed string into the shell before bash sees a
          # quote, and this input is free text.
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          EXPECTED='every migration on integration is applied to production'

          # EMPTY IS NOT WRONG ANY MORE, and that is the whole change here. The
          # field is what carries a run the probe cannot speak for; on a run
          # the probe CAN speak for, nobody should have to type anything, and
          # on a scheduled run there is nobody to type it.
          if [ -z "${CONFIRM:-}" ]; then
            echo "confirmed=no" >> "$GITHUB_OUTPUT"
            echo "nothing typed; the probe has to carry this run on its own"
            exit 0
          fi

          # SOMETHING WAS TYPED AND IT IS WRONG. Refuse now rather than after
          # CI: a typo is much likelier than a deliberate empty field, and this
          # is the cheapest place to say so.
          if [ "$CONFIRM" != "$EXPECTED" ]; then
            echo "::error::refusing to deploy: something was typed in the confirmation field and it did not match."
            {
              echo "## Refused"
              echo
              echo "The confirmation field was not empty and did not read **exactly**:"
              echo
              echo '```'
              echo "$EXPECTED"
              echo '```'
              echo
              echo "Leave it EMPTY to let \`tools/deploy-probe.mjs\` answer from production's own"
              echo "catalog. Type it only when the probe cannot -- no secret, or a migration it"
              echo "has no probe for."
              echo
              echo "Nothing was merged and nothing was pushed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "confirmed=yes" >> "$GITHUB_OUTPUT"
          echo "confirmation matched"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve integration, and refuse if main is not an ancestor of it
        id: resolve
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          if ! git rev-parse --verify --quiet refs/remotes/origin/integration >/dev/null; then
            echo "::error::there is no origin/integration branch to deploy."
            exit 1
          fi

          SHA="$(git rev-parse origin/integration)"
          MAIN="$(git rev-parse origin/main)"
          SUBJECT="$(git log -1 --format=%s "$SHA")"

          # MAIN MUST BE CONTAINED IN INTEGRATION. `main` moves on its own all
          # day -- the classroom GitHub export commits under `materials/` on
          # every item save -- so `integration` is routinely BEHIND main even
          # while it is ahead. Merging in that state would produce a merge
          # commit resolving files this run never tested. The Integrate
          # workflow merges main into integration first, every time, which is
          # exactly the repair.
          if ! git merge-base --is-ancestor "$MAIN" "$SHA"; then
            BEHIND="$(git rev-list --count "origin/integration..origin/main")"
            echo "::error::origin/main is not an ancestor of origin/integration ($BEHIND commit(s) on main are missing from it). Run the Integrate workflow first, then press Deploy again."
            {
              echo "## Refused: integration is behind main"
              echo
              echo "\`origin/main\` is **not** an ancestor of \`origin/integration\`:"
              echo "**$BEHIND** commit(s) are on \`main\` and not on \`integration\`."
              echo
              echo "Press **Run workflow** on **Integrate** first. It merges \`main\` into"
              echo "\`integration\` before anything else, which is what closes this gap. Then"
              echo "press Deploy again."
              echo
              echo "Nothing was merged and nothing was pushed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          AHEAD="$(git rev-list --count origin/main..origin/integration)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"

          # NOTHING TO DEPLOY IS NOT A FAILURE, and on a nightly schedule it is
          # the ORDINARY outcome. A red mark on most nights is a red mark
          # nobody reads, and the one night it means something would look
          # exactly like the others.
          if [ "$AHEAD" = 0 ]; then
            echo "proceed=no" >> "$GITHUB_OUTPUT"
            echo "::notice::integration is level with main; there is nothing to deploy."
            {
              echo "## Nothing to deploy"
              echo
              echo "\`integration\` is level with \`main\`. No job ran, nothing was merged, and"
              echo "this run is green because that is the ordinary state on most nights."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "proceed=yes" >> "$GITHUB_OUTPUT"
          {
            echo "## Deploy candidate"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| \`integration\` tip | \`$SHA\` |"
            echo "| subject | $SUBJECT |"
            echo "| commits ahead of \`main\` | $AHEAD |"
            echo "| triggered by | \`${{ github.event_name }}\` |"
            echo
            echo "Production's applied migration set is read next. CI then runs on that exact"
            echo "sha, and the merge happens only if both are satisfied."
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------------
  # 2. ASK PRODUCTION WHICH MIGRATIONS IT HAS. This is the job decision 0010
  #    was waiting for, and it is the only thing in this repository that can
  #    answer the question: no file records applied state, and the remote has
  #    no `supabase_migrations.schema_migrations` table at all.
  # ------------------------------------------------------------------------
  migrations:
    needs: guard
    if: needs.guard.outputs.proceed == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # `yes` only when this job decided the deploy may proceed. A job that
      # FAILS takes the deploy with it through `needs`; this flag is for the
      # one outcome that is a STOP and not a failure -- a scheduled run the
      # probe cannot speak for, which is green because nothing is wrong.
      go: ${{ steps.probe.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read production's applied migration set
        id: probe
        env:
          # THE SECRET IS PASSED AS AN ENV VAR AND IS NEVER INTERPOLATED INTO A
          # SCRIPT, NEVER PRINTED, AND NEVER PASSED ON A COMMAND LINE THIS FILE
          # BUILDS. `tools/deploy-probe.mjs` hands it to `psql` as an argument
          # in an `execFile` argument list, with no shell anywhere on the path,
          # and redacts it out of anything it prints.
          #
          # UNSET IS A SUPPORTED STATE, not a broken one: the probe answers
          # "cannot run", and the run falls back to the typed confirmation
          # exactly as it worked before this bundle. That is what keeps this
          # repository usable by somebody who does not have the secret.
          DEPLOY_PROBE_URL: ${{ secrets.DEPLOY_PROBE_URL }}
          # OPTIONAL, AND A VARIABLE RATHER THAN A LITERAL IN THIS FILE. It is
          # the lowest migration number the probe asks about; unset takes
          # `tools/idea-status.py`'s own default. It is here so the watermark
          # can be moved past a migration that has no probeable object -- a
          # tombstone, a data-only fix -- without editing a workflow, and every
          # run prints the window it used and every row it read.
          DEPLOY_PROBE_SINCE: ${{ vars.DEPLOY_PROBE_SINCE }}
          SHA: ${{ needs.guard.outputs.integration_sha }}
          CONFIRMED: ${{ needs.guard.outputs.confirmed }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail

          ARGS=(--ref "$SHA")
          if [ -n "${DEPLOY_PROBE_SINCE:-}" ]; then ARGS+=(--since "$DEPLOY_PROBE_SINCE"); fi

          # BOTH FORMS, ONE RUN EACH. The text goes in the log for a person and
          # the JSON is what the summary is built from, so the two cannot
          # disagree about a row: the JSON run is the one whose status decides.
          node tools/deploy-probe.mjs "${ARGS[@]}" || true
          node tools/deploy-probe.mjs "${ARGS[@]}" --json > probe.json 2> probe.err
          PROBE=$?

          echo "probe exit: $PROBE"

          # THE FLAG IS WRITTEN ONCE, HERE, AND FLIPPED ONLY BY A BRANCH THAT
          # DECIDES TO GO. Written last it would be missing on every `exit`
          # path above it, and a missing output reads as an empty string, which
          # is not `yes` -- so the default is already the safe one and this is
          # belt to that.
          echo "go=no" >> "$GITHUB_OUTPUT"

          # ---------------------------------------------------------------
          # THE DECISION. Exactly one of these runs.
          # ---------------------------------------------------------------
          case "$PROBE" in
            0)
              {
                echo "## Migrations: every one in range is applied"
                echo
                jq -r '"Window: migrations from \(.since) up, read on `\(.ref[0:12])`.\n"' probe.json
                echo "| migration | state | object |"
                echo "| --- | --- | --- |"
                jq -r '.findings[] | "| `\(.num)` | APPLIED | \(.object) |"' probe.json
                echo
                echo "Read from production's own \`pg_catalog\` by \`tools/deploy-probe.mjs\`."
                echo "Nobody typed anything and nobody had to."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "go=yes" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            2)
              # A MACHINE-READ FACT ABOUT PRODUCTION. No typed string carries
              # this and no trigger is exempt from it: the code about to go
              # live calls something the database does not have.
              {
                echo "## REFUSED: a migration on this candidate is not applied to production"
                echo
                echo "| migration | state | object |"
                echo "| --- | --- | --- |"
                jq -r '.findings[] | "| `\(.num)` | \(.state | ascii_upcase) | \(.object) |"' probe.json
                echo
                echo "**Nothing was merged and nothing was pushed.**"
                echo
                echo "Apply each of these in the Supabase SQL editor, then run Deploy again."
                echo "Applying a migration needs a credential that can WRITE to production, which"
                echo "no workflow and no cloud session may hold, so this is the step that stays"
                echo "yours."
                echo
                for f in $(jq -r '.findings[] | select(.state == "not-applied") | .file' probe.json | sort -u); do
                  p="supabase/migrations/$f"
                  echo "<details><summary><code>$p</code></summary>"
                  echo
                  echo '```sql'
                  git show "$SHA:$p" 2>/dev/null || git show "origin/main:$p" 2>/dev/null || echo "-- could not read $p at $SHA or on origin/main"
                  echo '```'
                  echo
                  echo "</details>"
                  echo
                done
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::at least one migration on this candidate is not applied to production. The job summary names each one and carries its SQL."
              exit 1
              ;;
            *)
              # 1 or 3: THE MACHINE IS SILENT, WHICH IS NOT "APPLIED".
              WHY="the probe could not run at all"
              [ "$PROBE" = 3 ] && WHY="every probe that ran said applied, but at least one migration has no probe to run"
              {
                echo "## The probe could not carry this run on its own"
                echo
                echo "$WHY."
                echo
                if [ -s probe.json ]; then
                  echo "| migration | state | object |"
                  echo "| --- | --- | --- |"
                  jq -r '.findings[] | "| `\(.num)` | \(.state | ascii_upcase) | \(.object)\(if .why == "" then "" else " -- " + .why end) |"' probe.json
                  echo
                fi
                if [ -s probe.err ]; then
                  echo '```'
                  cat probe.err
                  echo '```'
                  echo
                fi
              } >> "$GITHUB_STEP_SUMMARY"

              if [ "$EVENT" != workflow_dispatch ]; then
                # A SCHEDULED RUN STOPS HERE AND STAYS GREEN. Nothing is wrong;
                # the machine simply may not speak, and a red mark every night
                # is one nobody reads.
                {
                  echo "**Stopped, and this run is green.** A scheduled deploy runs only when the"
                  echo "probe can answer for every migration in range. Press **Run workflow** and"
                  echo "type the confirmation to deploy anyway."
                } >> "$GITHUB_STEP_SUMMARY"
                echo "::notice::the probe cannot confirm every migration in range; a scheduled deploy will not run. Use the button with the typed confirmation."
                exit 0
              fi

              if [ "$CONFIRMED" != yes ]; then
                {
                  echo "**Nothing was merged and nothing was pushed.**"
                  echo
                  echo "Run this workflow again and type, exactly:"
                  echo
                  echo '```'
                  echo "every migration on integration is applied to production"
                  echo '```'
                  echo
                  echo "That line is the fallback this repository has always had, and it is what a"
                  echo "person asserts when the machine cannot. Read"
                  echo "\`tools/idea-status.py\`'s probe block against the Supabase SQL editor before"
                  echo "typing it."
                } >> "$GITHUB_STEP_SUMMARY"
                echo "::error::the probe cannot confirm every migration in range and nothing was typed. Nothing was merged."
                exit 1
              fi

              {
                echo "### A person carried it"
                echo
                echo "The confirmation was typed, so this run proceeds on that assertion rather"
                echo "than on a reading of production. The rows above are what the machine could"
                echo "and could not say."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "go=yes" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

  # ------------------------------------------------------------------------
  # 3. The SAME checks CI runs, on that exact sha, in this run.
  #
  #    Deliberately NOT a query to the Actions API for a prior run's
  #    conclusion. A prior conclusion is a claim about a sha that may no longer
  #    be the tip, and `integration` gets no push-triggered run of its own at
  #    all (GITHUB_TOKEN loop-breaker -- see ci.yml's schedule comment), so
  #    there is frequently no run to find. Calling ci.yml is the checks
  #    themselves.
  # ------------------------------------------------------------------------
  checks:
    needs: [guard, migrations]
    if: needs.migrations.outputs.go == 'yes'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.guard.outputs.integration_sha }}

  # ------------------------------------------------------------------------
  # 4. Merge and push. LEAST PRIVILEGE: contents write and nothing else.
  #
  #    ALL THREE GATES OR IT DOES NOT RUN, and each is a separate `needs`: the
  #    ancestry check and a non-empty candidate (`guard`), production's applied
  #    set (`migrations`), and CI green on the exact sha (`checks`). A job that
  #    fails or is skipped takes this with it.
  # ------------------------------------------------------------------------
  deploy:
    needs: [guard, migrations, checks]
    if: needs.migrations.outputs.go == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Merge integration into main and push
        env:
          SHA: ${{ needs.guard.outputs.integration_sha }}
          SUBJECT: ${{ needs.guard.outputs.integration_subject }}
          CONFIRMED: ${{ needs.guard.outputs.confirmed }}
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout -B main origin/main

          # WHO ANSWERED THE MIGRATION QUESTION, IN THE COMMIT MESSAGE. The
          # merge commit is the only durable record of a deploy, and "a person
          # asserted it" and "production's catalog was read" are different
          # claims that should not both read as the second one.
          if [ "$CONFIRMED" = yes ]; then
            WHO="after a person confirmed every migration on integration is applied to production."
          else
            WHO="after tools/deploy-probe.mjs read production's catalog and found every migration in range applied."
          fi

          # THE TESTED SHA, NOT `origin/integration`. If integration moved
          # while CI was running, what CI proved green is this sha and nothing
          # else, so this is what lands.
          # The message is built here rather than written inline, because a
          # multi-line string at column 0 would end this block scalar.
          MSG="$(printf '%s\n\n%s\n\n%s\n%s\n' \
            "Deploy: merge integration ${SHA} into main" \
            "${SUBJECT}" \
            "Merged by the Deploy workflow after CI ran on that exact sha, and" \
            "${WHO}")"

          if ! git merge --no-ff -m "$MSG" "$SHA"; then
            git merge --abort || true
            echo "::error::merging $SHA into main conflicted. Nothing was pushed. Resolve it by running the Integrate workflow (which merges main into integration) and pressing Deploy again."
            {
              echo "## Refused: the merge conflicted"
              echo
              echo "\`main\` moved while this run was checking \`integration\`, and the two"
              echo "now touch the same file. **Nothing was pushed.**"
              echo
              echo "Press **Run workflow** on **Integrate**, which merges \`main\` into"
              echo "\`integration\` and surfaces the conflict where it can be resolved on a"
              echo "branch, then press Deploy again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # NEVER --force, and no retry. A rejected push means `main` moved
          # under this run; the honest response is to do nothing and let a
          # person press the button again against the new tip.
          if ! git push origin HEAD:refs/heads/main; then
            echo "::error::the push to main was rejected -- main moved during this run. Nothing was force-pushed. Press Deploy again."
            exit 1
          fi

      - name: Read main back and report what is live
        env:
          CONFIRMED: ${{ needs.guard.outputs.confirmed }}
        run: |
          set -euo pipefail
          git fetch origin main
          NEW="$(git rev-parse origin/main)"
          SUBJ="$(git log -1 --format=%s "$NEW")"
          if [ "$CONFIRMED" = yes ]; then
            HOW="a person typed the confirmation"
          else
            HOW="the probe read production's catalog"
          fi
          {
            echo "## Deployed"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| \`main\` is now | \`$NEW\` |"
            echo "| merge subject | $SUBJ |"
            echo "| migrations answered by | $HOW |"
            echo
            echo "**Every push to \`main\` deploys \`ideabosco.com\`.** This one is live, or"
            echo "will be as soon as Vercel finishes building it."
            echo
            echo "\`integration\` is not deleted or reset. The next Integrate sweep merges"
            echo "\`main\` back into it, which after this deploy is a fast-forward."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "main is now $NEW ($SUBJ)"
