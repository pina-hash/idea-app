name: CI

on:
  push:
  pull_request:
    branches: [main]

  # `integration` GETS NO CI RUN OF ITS OWN FROM A PUSH, EVER, AND THAT IS
  # GITHUB'S RULE RATHER THAN A GAP HERE. `integrate.yml` pushes `integration`
  # with GITHUB_TOKEN, and GitHub's loop-breaker starts no workflow run from a
  # push made with that token. So every commit on `integration` was green on
  # its own source branch and the MERGE RESULT was never checked by anything.
  # On 2026-08-29 `integration` went red silently and stopped eight branches.
  #
  # This schedule is the answer: one run a day against `integration` itself.
  #
  # THE HOUR IS CHOSEN, NOT ARBITRARY, AND MOVING IT COSTS DETECTION. A suite
  # that only ever runs during the working day samples one part of the clock
  # and calls it coverage. `tests/db/classroom-hall-pass-limits.test.ts` sat in
  # the tree from prompt 0016 and passed every CI run for weeks; six of its 24
  # tests fail ONLY between 00:00 and 02:00 America/Los_Angeles, because the
  # fixtures backdate up to 120 minutes and land on the previous LA calendar
  # day. It surfaced when a person happened to re-run a branch at 00:58, not
  # because anything tested for it. The defect CLASS is general: a fixture
  # positioned relative to `now()` feeding an assertion scoped to a calendar
  # day. Nothing but the clock finds one.
  #
  # WHY `0 8` SPECIFICALLY, and it is the only quarter-hour that works:
  #   * GitHub cron is UTC and does NOT shift with daylight saving, so one cron
  #     lands on two different local hours across the year. 08:00 UTC is
  #     01:00 PDT in summer and 00:00 PST in winter. Both are inside the
  #     window, so ONE entry covers both halves of the year -- the whole
  #     intersection is UTC [08:00, 09:00), and anything outside it is inside
  #     the window for only half the year. The retired `30 4` was 21:30 PDT
  #     and 20:30 PST: never once inside it.
  #   * Detection DEGRADES across the window rather than being flat. Measured
  #     at fixed Pacific instants: 6 failures at 00:05, 00:30 and 01:00, but
  #     only 2 at 01:30 (the tests backdating 90 minutes or more), and 0 at
  #     02:05. So `0 8` is the latest minute at which BOTH local hours still
  #     sit at or before the last full-strength reading. `30 8` would put the
  #     summer run at 01:30, catching 2 of the 6.
  #   * The top of the hour is the worst slot for GitHub's own scheduler
  #     delay, and that is accepted deliberately: a delay moves the run LATER,
  #     which in winter goes deeper into the window and in summer degrades to
  #     the still-detecting 01:30 reading. Moving the cron later to dodge the
  #     queue would cost summer detection immediately and unconditionally,
  #     which is the worse trade.
  #
  # It still satisfies everything the schedule was added for: one run a day,
  # against `integration`, well outside class hours, and it now lands roughly
  # two hours BEFORE `deploy.yml`'s own 10:00 UTC nightly rather than five and
  # a half, so the signal that `integration` is broken arrives before the
  # deploy that would trip over it.
  #
  # A red scheduled run is the signal that `integration` is broken and no
  # branch will merge until somebody looks.
  schedule:
    - cron: '0 8 * * *'

  # For a person: check any ref on demand, which is what the Deploy workflow's
  # own summary tells them to do after a conflict.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to check out and test (branch, tag or sha). Default: integration.'
        required: false
        default: 'integration'

  # CALLABLE, so `deploy.yml` runs THESE checks on `integration`'s exact tip
  # rather than querying the Actions API for some earlier run's conclusion. A
  # prior run is a claim about a sha that may no longer be the tip; this is the
  # checks themselves, on the sha about to be merged, in the deploy's own run.
  workflow_call:
    inputs:
      ref:
        description: 'Ref to check out and test.'
        required: true
        type: string

# ONE LIVE RUN PER BRANCH, FOR PUSHES TO ANY BRANCH BUT `main` (ledger 0335).
# A session pushes a branch several times in a few minutes, and every run but
# the newest is testing a tip nobody will merge: `integrate.yml` keys on the
# newest completed run for the branch's exact tip, and a cancelled run is not
# `success`, so cancelling one can only ever leave a branch waiting for the run
# that replaced it -- never merge something untested.
#
# EVERYTHING ELSE GETS A GROUP OF ITS OWN, WHICH IS HOW "NEVER CANCELLED" IS
# SPELLED: a push to `main` (every one is a deploy, and its CI is the record of
# what shipped), `pull_request`, the nightly `schedule`, a hand-pressed
# `workflow_dispatch`, and `workflow_call` from `deploy.yml`. The run id makes
# each of those a group nothing else can join. It also keeps a CALLED run out
# of its caller's group: in a `workflow_call`, `github.*` is the caller's
# context, and a group string equal to `deploy.yml`'s own `deploy` would
# deadlock the two -- `ci-` in front of every value here is what rules that out.
concurrency:
  group: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && format('ci-push-{0}', github.ref) || format('ci-{0}-{1}-{2}', github.event_name, github.run_id, github.run_attempt) }}
  cancel-in-progress: true

env:
  # PLACEHOLDER VALUES, COMMITTED HERE ON PURPOSE -- never a real credential.
  #
  # `svelte-check` type-checks against `$env/static/public`, which
  # `svelte-kit sync` GENERATES from whatever PUBLIC_-prefixed vars are in
  # process.env at sync time (.svelte-kit/ambient.d.ts). It does not read
  # their VALUES, only their PRESENCE -- src/routes/+layout.ts and
  # src/hooks.server.ts import PUBLIC_SUPABASE_URL and
  # PUBLIC_SUPABASE_ANON_KEY by name, and with neither set the generated
  # module exports nothing, which is a type error at both import sites
  # ("has no exported member ..."), not a missing-value error. A fake URL and
  # a fake key satisfy the type checker exactly as well as real ones, and
  # nothing in `npm run check` or `npm test` makes a network call that would
  # need the real project -- the test suite talks to an embedded Postgres,
  # never to Supabase.
  PUBLIC_SUPABASE_URL: 'https://ci-placeholder.supabase.co'
  PUBLIC_SUPABASE_ANON_KEY: 'ci-placeholder-anon-key'

jobs:
  # ------------------------------------------------------------------------
  # THE SHAPE (ledger 0335): `scope` decides, then `check` and a sharded
  # `test` run in parallel, then `ci` reads every result. Before this the
  # whole of CI was one job running 625 test files one after another, and a
  # push that changed nothing but a ledger entry waited nineteen minutes for
  # the same answer as a push that changed the database layer.
  #
  #   scope  ALWAYS. Decides `full` or `docs`, runs the two document checks
  #          that need no dependencies, and on a docs-only push runs the test
  #          files that read documents (see `docs_only_paths` below and
  #          `docsReaderTests` in tools/run-tests.mjs).
  #   check  `npm run check`, on a full run.
  #   test   the suite, split N ways by `--shard`, on a full run.
  #   ci     reads the other three and fails unless every part that had to
  #          run passed. A red shard is red CI with or without it; what it adds
  #          is that a job SKIPPED when it should have run is red too.
  #
  # WHICH REF IS TESTED, and the empty string is the important case -- every
  # checkout below uses the same expression:
  #   workflow_call / workflow_dispatch -> `inputs.ref`, what the caller
  #     or the person named.
  #   schedule -> `integration`, per the comment on the trigger above;
  #     `github.ref` on a scheduled run is the DEFAULT branch, so without
  #     this a nightly run would test `main` and prove nothing about the
  #     branch that never gets a run of its own.
  #   push / pull_request -> '' , which actions/checkout treats as
  #     unspecified and resolves to the ref that triggered the run. It is
  #     not "check out nothing".
  # ------------------------------------------------------------------------
  scope:
    name: Scope and document checks
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      # SHALLOW, THEN THE HISTORY OF EXACTLY TWO BRANCHES -- AND NOT
      # `fetch-depth: 0`, WHICH IS WHAT MADE CI TAKE NINETEEN MINUTES.
      #
      # History IS read, by name: `tests/apply-migration-guard.test.ts`,
      # `tests/apply-migration-trace.test.ts` and `tests/deploy-probe-cli.test.ts`
      # drive the real `tools/apply-migration.mjs` / `tools/deploy-probe.mjs`
      # with `--ref origin/integration`, which asks git to list
      # `supabase/migrations` on BOTH `origin/main` and that ref; under a
      # plain depth-1 checkout neither ref exists and the tool answers
      #   REFUSING: the applied set could not be read
      # -- its designed fail-closed path, which made `main` red on 2026-09-06
      # (run 34060552250). `tools/idea-status.py` also dates each migration
      # from `git log origin/main`, and `npm run history:verify` compares
      # against a pre-split commit on `main`'s history. So both refs, with
      # their whole history, are required.
      #
      # WHAT `fetch-depth: 0` ALSO FETCHED WAS EVERY OTHER BRANCH, AND THAT
      # COST 596 SECONDS A RUN. `idea-status.py`'s ledger reader runs one
      # `git show` per ledger entry PER REMOTE BRANCH (`ledger_refs`), and the
      # origin carried 98 `claude/**` and `codex/**` branches on 2026-09-27,
      # so every probe call did roughly 45,000 `git show`s instead of about
      # 900. Measured from run 36343240552's own log timestamps: the three
      # files above took 490 s, 72 s and 34 s of a 1,102 s suite. The same
      # three against `main` + `integration` only: 40 s, 13 s and 4 s; and
      # `deploy-probe-cli` alone, same machine, all 102 branches fetched
      # again: 647 s (ledger 0335's history entry has the runs).
      # No test reads an agent branch: `tests/idea-status.test.ts` and
      # `tests/migration-claims.test.ts` build their own fixture repositories.
      #
      # `--unshallow` completes the history of what the checkout already has
      # (HEAD) as well as fetching `main`'s, so a push's `before` commit is
      # present whenever it is an ancestor of the tip. `integration` is
      # fetched separately and allowed to be absent: a test that needs it
      # says so itself (`tests/git-refs-precondition.ts`) rather than this
      # step guessing.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || (github.event_name == 'schedule' && 'integration') || '' }}

      - name: Fetch main and integration, with history
        run: |
          git fetch --quiet --no-tags --unshallow origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch --quiet --no-tags origin '+refs/heads/integration:refs/remotes/origin/integration' \
            || echo "integration is not on the remote; tests that need it will say so"
          git for-each-ref --format='%(refname:short) %(objectname:short)' refs/remotes/origin

      # adapter-vercel (node_modules/@sveltejs/adapter-vercel/utils.js,
      # resolved via package-lock.json) hard-rejects any Node major outside
      # 20, 22 or 24 -- confirmed by running the build against Node 26
      # locally, which fails with "Unsupported Node.js version". 24 is the
      # newest of the three the adapter accepts. Every job pins the same one;
      # here it is also what the decision below runs `tools/run-tests.mjs` on.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # FULL OR DOCS-ONLY. Docs-only is a PUSH whose every changed path is
      # under `docs/` or ends `.md`, and nothing under `src/`, `tests/`,
      # `supabase/`, `tools/` or `.github/`, and neither package file -- a
      # README inside `src/` is still a push to `src/`. Anything this step
      # cannot establish is FULL: a non-push trigger, a `workflow_call` (its
      # `inputs.ref` is set), an empty or unreadable diff, and a document that
      # code under `src/` names (`--names-in-src`, tools/run-tests.mjs).
      #
      # THE BASE of the diff is the merge base with `origin/main` -- a branch
      # is judged on EVERYTHING it changes relative to `main`, on every push.
      # NOT the push's own `before`, and that is load-bearing rather than
      # conservative: a session pushes a code commit, then a ledger entry a
      # minute later; the concurrency group below CANCELS the first run, and
      # a `before`-based diff would call the second push docs-only -- a green
      # tip over code no run ever tested, which `integrate.yml` then merges.
      # A push to `main` is the one exception and diffs from its `before`
      # (when that is an ancestor of the tip): `main`'s runs are never
      # cancelled, so every range pushed to it has a run of its own.
      #
      # The two functions sit between markers because
      # `tests/workflows.test.ts` cuts THIS text out of this file and runs it
      # against fixture path lists and a fixture repository. Do not rename the
      # markers or move the bodies out from between them.
      - name: Decide full or docs-only
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          CALLED_REF: ${{ inputs.ref }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # docs_only_marker:begin
          docs_only_paths() {
            # Reads changed paths on stdin, one per line. Returns 0 only when
            # there is at least one and every one of them is documentation.
            local any=0 p
            while IFS= read -r p; do
              [ -z "$p" ] && continue
              any=1
              case "$p" in
                src/*|tests/*|supabase/*|tools/*|.github/*|package.json|package-lock.json) return 1 ;;
                docs/*|*.md) ;;
                *) return 1 ;;
              esac
            done
            [ "$any" = 1 ]
          }
          scope_mode() {
            # $1 the event, $2 the push's `before`, $3 a called/dispatched ref,
            # $4 the pushed ref. Prints `docs` or `full`; runs git in the
            # current directory.
            local base='' changed=''
            if [ "$1" != push ] || [ -n "$3" ]; then echo full; return; fi
            if [ "$4" = refs/heads/main ] && [ -n "$2" ] \
              && [ "$2" != 0000000000000000000000000000000000000000 ] \
              && git merge-base --is-ancestor "$2" HEAD 2>/dev/null; then
              base=$2
            else
              base=$(git merge-base origin/main HEAD 2>/dev/null) || base=''
            fi
            if [ -z "$base" ] || ! changed=$(git diff --name-only --no-renames "$base" HEAD); then
              echo full; return
            fi
            # Documentation by PATH, and then not named by any code under
            # `src/` -- `mdm-content-seed.md` is a root `*.md` file that
            # `src/lib/frc/mdm-content.ts` imports as page content, and it is
            # not documentation whatever its extension says.
            if printf '%s\n' "$changed" | docs_only_paths \
              && printf '%s\n' "$changed" | node "${RUN_TESTS:-tools/run-tests.mjs}" --names-in-src >&2; then
              echo docs
            else
              echo full
            fi
          }
          # docs_only_marker:end
          mode=$(scope_mode "$EVENT" "$BEFORE" "$CALLED_REF" "$REF")
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "CI scope: $mode (event $EVENT)"
          echo "### CI scope: \`$mode\`" >> "$GITHUB_STEP_SUMMARY"

      # Every gate below runs even if an earlier one failed, so one push
      # reports all of them rather than only the first.
      #
      # Asserts the VERSION constant baked into the served VANGUARD build has
      # a matching CHANGELOG entry (tools/check-vanguard-changelog.mjs). A
      # version bump with no changelog line used to ship silently -- there was
      # no CI, and no local hook, that ever caught it. This does not generate
      # a missing entry; it fails so a human writes one. No dependencies, so
      # it runs here on every run rather than waiting on `npm ci`.
      - name: VANGUARD changelog check
        id: vanguard-changelog
        if: always()
        continue-on-error: true
        run: node tools/check-vanguard-changelog.mjs

      # `npm run history:verify` (docs/history/_tools/verify-split.mjs)
      # reassembles the 168 pre-split docs/history/record-*.md files and
      # compares a sha256 of the result against the pinned pre-split body --
      # fast (~1.3s wall including node startup, measured; no embedded
      # Postgres, no network) and deterministic (it reads only committed
      # files and hashes them). It also tries a byte-for-byte `git show`
      # against the pre-split commit, and THAT LEG RUNS because `main`'s
      # history is fetched above: it reports `IDENTICAL against ea9f043b6c`.
      # It is still best-effort: the script catches a failed `git show` and
      # falls back to the sha256 compare, so a checkout that cannot reach that
      # commit is not a reason it can fail. The only way this step goes red
      # is a genuinely malformed or drifted entry (a retyped `## ` heading, a
      # title that stopped matching, a broken record_order, or the reassembled
      # body itself changing), which is exactly what it exists to catch before
      # a bad entry reaches `main` and a push to `main` deploys mid-class.
      - name: History record check
        id: history-verify
        if: always()
        continue-on-error: true
        run: npm run history:verify

      # THE DOCS-ONLY PATH'S TESTS: every test file whose own source names a
      # document or a tool (`docsReaderTests`, tools/run-tests.mjs), which
      # includes the standards version-header test and the CLAUDE.md name
      # check. On a full run these same files run inside the shards instead,
      # so this is skipped there and the final step below says which.
      #
      # THREE VITEST PROCESSES AT ONCE, each with its own embedded Postgres,
      # because one process took 105 s for the 42 files and three took 81 s
      # (measured locally, 2026-09-27). The floor is one file:
      # `tests/deploy-probe-cli.test.ts` is ~42 s on its own and reads
      # `docs/migrations-applied/`, so it belongs here. Every log is printed
      # whatever happened, and any one process failing fails the step.
      - name: Install dependencies (docs-only)
        if: steps.scope.outputs.mode == 'docs'
        run: npm ci

      - name: Document-reading tests (docs-only)
        id: docs-tests
        if: always() && steps.scope.outputs.mode == 'docs'
        continue-on-error: true
        run: |
          npx svelte-kit sync
          pids=()
          for i in 1 2 3; do
            npm test -- --docs-only --shard="$i/3" > "$RUNNER_TEMP/docs-tests-$i.log" 2>&1 &
            pids+=("$!")
          done
          rc=0
          for i in 1 2 3; do
            wait "${pids[$((i - 1))]}" || rc=1
            echo "::group::document-reading tests, part $i of 3"
            cat "$RUNNER_TEMP/docs-tests-$i.log"
            echo "::endgroup::"
          done
          exit "$rc"

      - name: Fail the job if any step failed
        if: always()
        env:
          MODE: ${{ steps.scope.outputs.mode }}
        run: |
          echo "ref tested:         $(git rev-parse HEAD) ($(git rev-parse --abbrev-ref HEAD))"
          echo "mode:               $MODE"
          echo "vanguard-changelog: ${{ steps.vanguard-changelog.outcome }}"
          echo "history-verify:     ${{ steps.history-verify.outcome }}"
          echo "docs-tests:         ${{ steps.docs-tests.outcome }}"
          if [ "${{ steps.vanguard-changelog.outcome }}" != "success" ] || [ "${{ steps.history-verify.outcome }}" != "success" ]; then
            exit 1
          fi
          if [ "$MODE" = docs ] && [ "${{ steps.docs-tests.outcome }}" != "success" ]; then
            exit 1
          fi

  # `npm run check` reads no history -- svelte-kit sync and svelte-check read
  # the working tree and nothing else, measured in a depth-1 clone -- so this
  # checkout stays shallow.
  check:
    name: Type and a11y check
    needs: scope
    # `!= 'docs'`, never `== 'full'`: a `scope` job that died before it could
    # answer leaves the output empty, and an empty answer runs everything.
    # `!cancelled()` rather than `always()`, so a superseded run's cancel
    # reaches this job too instead of leaving it running on a dead tip.
    if: ${{ !cancelled() && needs.scope.outputs.mode != 'docs' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || (github.event_name == 'schedule' && 'integration') || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type and a11y check
        run: npm run check

  # THE FULL SUITE, DATABASE TESTS INCLUDED, SPLIT ACROSS A MATRIX. Every
  # DB-backed test (`tests/db/harness.ts`) runs against `embedded-postgres`,
  # a real Postgres binary vitest boots itself (tests/db/cluster.ts,
  # globalSetup) -- not Supabase, not a network service; the binary is a
  # public npm optionalDependency fetched by `npm ci`. EACH SHARD IS ITS OWN
  # VITEST RUN AND BOOTS ITS OWN CLUSTER, which is what `globalSetup` means.
  #
  # `--shard=i/N` is vitest's own split, with one change in
  # `tests/db/sequencer.ts`: the isolation pair (`db-isolation-a` leaves a
  # database behind on the cluster, `db-isolation-b` must see it) always
  # lands in one shard. N comes from `strategy.job-total`, so the matrix list
  # is the only place the count is written.
  #
  # `fail-fast: false`, so one red shard does not cancel the others and a
  # push still reports every failure, as the single job used to.
  #
  # THIS RUNS `npm test`, NOT `vitest` DIRECTLY, and that is load bearing:
  # importing `embedded-postgres` registers an `async-exit-hook` that calls
  # `process.exit(0)` unconditionally, so vitest exits 0 on a failing suite.
  # `tools/run-tests.mjs` reads vitest's own JSON report instead. And
  # `svelte-kit sync` runs first because a fresh checkout has no
  # `.svelte-kit/tsconfig.json`, without which vitest dies in dependency
  # optimisation before any test body (decision 21).
  test:
    name: Test suite (shard ${{ matrix.shard }})
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.mode != 'docs' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      # The same checkout and the same two-branch fetch as `scope`, for the
      # reasons written there; `tests/workflows.test.ts` holds the two equal.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || (github.event_name == 'schedule' && 'integration') || '' }}

      - name: Fetch main and integration, with history
        run: |
          git fetch --quiet --no-tags --unshallow origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch --quiet --no-tags origin '+refs/heads/integration:refs/remotes/origin/integration' \
            || echo "integration is not on the remote; tests that need it will say so"
          git for-each-ref --format='%(refname:short) %(objectname:short)' refs/remotes/origin

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate SvelteKit types
        run: npx svelte-kit sync

      - name: Test suite
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm test -- --shard="$SHARD"

  # THE ONE RESULT. `integrate.yml` and `deploy.yml` read the WORKFLOW's
  # conclusion, which a failing job already turns red; this job exists for
  # the case that does not -- a `check` or `test` job SKIPPED on a run that
  # was supposed to be full, which GitHub counts as a pass. Docs-only is the
  # only mode in which a skip is the right answer.
  ci:
    name: CI result
    needs: [scope, check, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every part that had to run passed
        env:
          MODE: ${{ needs.scope.outputs.mode }}
          SCOPE: ${{ needs.scope.result }}
          CHECK: ${{ needs.check.result }}
          TEST: ${{ needs.test.result }}
        run: |
          # ci_result_marker:begin
          ci_result() {
            # $1 mode, $2 scope result, $3 check result, $4 test result.
            [ "$2" = success ] || return 1
            if [ "$1" = docs ]; then
              [ "$3" = skipped ] && [ "$4" = skipped ]
            else
              [ "$3" = success ] && [ "$4" = success ]
            fi
          }
          # ci_result_marker:end
          echo "mode:  ${MODE:-(none)}"
          echo "scope: $SCOPE"
          echo "check: $CHECK"
          echo "test:  $TEST"
          ci_result "$MODE" "$SCOPE" "$CHECK" "$TEST"
