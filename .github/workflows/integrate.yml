name: Integrate

# Canonical agent branch-prefix registry. Every branch guard in this workflow
# reads this list; the status and migration tools mirror it and their tests pin parity.
env:
  AGENT_BRANCH_PREFIXES: 'claude/ codex/'

# Collects finished session branches onto ONE long-lived branch, `integration`,
# so a person merges once instead of nine times.
#
# The shape:
#   1. CI passes on a `claude/**` or `codex/**` branch.
#   2. This workflow merges `main` into `integration` (main advances all day on
#      its own -- the classroom GitHub export pushes `materials/` commits with
#      no human involved), then merges the green branch into `integration`.
#   3. It pushes `integration` and deletes the source branch.
#   4. A PERSON merges `integration` into `main` when they want to deploy.
#
# ---------------------------------------------------------------------------
# THIS WORKFLOW MUST NEVER PUSH TO `main`. NOT ON ANY CONDITION, NOT BEHIND ANY
# FLAG, NOT AS A FALLBACK.
#
# If you are reading this because you want to make it end to end, here is what
# step 4 is protecting, and neither half is hypothetical:
#
#   * Every push to `main` deploys `ideabosco.com`. Students are on it during
#     class. A deploy is a decision about a room full of people, made by
#     somebody who knows what time it is.
#   * Migrations are applied BY HAND in the Supabase SQL editor, and several
#     must be applied BEFORE the code that calls them goes live -- two branches
#     in one week carried exactly that. A machine that merged to `main` on green
#     CI would ship an RPC call to a function the database does not have yet.
#     CI cannot see this: the suite runs against an embedded Postgres with the
#     migration files applied, so a branch whose migration has never touched
#     production is green.
#
# `integration` exists so that everything mechanical happens without a person,
# and the one judgement call still needs one. Automating step 4 does not save a
# merge; it removes the only place that judgement is exercised.
#
# STEP 4 IS `deploy.yml` NOW, AND NOTHING ABOVE IS WEAKENED BY IT. That
# workflow is the ONE path that writes `main`. It is `workflow_dispatch` only:
# a person presses Run workflow and TYPES that every migration on
# `integration` is applied to production, and the job refuses on any other
# string. It then runs CI on `integration`'s exact tip and merges with
# `--no-ff`. So the git commands moved off somebody's laptop and the judgement
# did not move at all -- the typed line IS the second bullet above, asked at
# the moment it matters.
#
# It is a BUTTON AND NOT A SCHEDULE for that same bullet. An unattended
# nightly merge was proposed on 2026-09-02 and declined: a night window
# removes the students-in-class risk and does nothing about migrations, and CI
# cannot see production's catalog to check. It becomes safe when a workflow can
# read production's applied set, which needs a read-only credential in a
# GitHub secret -- Mr. Pina's decision, recorded at
# `docs/decisions/entries/10-unattended-nightly-deploy.md`.
# ---------------------------------------------------------------------------

on:
  # THE `workflow_run` TRAP, and it is the one that wastes an afternoon:
  # GitHub runs the copy of THIS FILE THAT IS ON THE DEFAULT BRANCH, not the
  # copy on the branch whose CI just finished. So:
  #   * edits to this file do nothing until they are merged to `main`;
  #   * this workflow will not run at all until it is on `main` once;
  #   * `github.ref` / the checkout default point at `main`, never at the
  #     branch being integrated -- every ref this job touches is named
  #     explicitly below rather than inherited from the event.
  #
  # The upside of the same rule is that a session branch cannot change what
  # this workflow does to it.
  workflow_run:
    workflows: ['CI']
    types: [completed]

  # For a person: re-run the sweep by hand after resolving a conflict, or to
  # pick up branches a cancelled queue entry skipped (see `concurrency` below).
  # It reaches exactly the same code path and it still cannot push to `main`.
  workflow_dispatch:

# SERIALIZE. Three sessions can finish within seconds of each other, and two
# runs merging into one branch at once produce a rejected push at best.
# `cancel-in-progress: false` makes a second run WAIT instead of racing.
#
# WORTH KNOWING: GitHub queues at most ONE pending run per group -- a third
# arrival cancels the one already pending. That would silently drop a merge if
# this job only ever handled its own trigger, so it does not: the job sweeps
# EVERY eligible `claude/**` or `codex/**` branch, and a cancelled queue entry therefore costs
# nothing but a little latency. Whatever it would have merged, the next run
# merges.
concurrency:
  group: integrate
  cancel-in-progress: false

# LEAST PRIVILEGE. Two scopes, and nothing else is granted:
#   contents: write -- push `integration`, and delete a `claude/**` or `codex/**` ref.
#                      (This is also what `main` is protected from by the
#                      refusal above rather than by a token scope. If this repo
#                      ever gains a branch protection rule on `main`, that is a
#                      second, independent lock and it is welcome.)
#   actions:  read  -- read the CI conclusion of a branch OTHER than the one
#                      that triggered this run, so the sweep can tell a green
#                      branch from a red one.
permissions:
  contents: write
  actions: read

jobs:
  integrate:
    # ONLY ON GREEN, and only for our own branches:
    #   conclusion == success  -- a red or cancelled CI run merges nothing.
    #   event == push          -- a same-repo branch produces BOTH a push run
    #                             and (once a PR is open) a pull_request run.
    #                             Taking only the push run keeps one trigger
    #                             per finished branch.
    #   head_repository        -- a fork's CI run must not move our branches.
    # `workflow_dispatch` has no `workflow_run` payload at all, so it is
    # allowed through on its own and the per-branch CI check below is what
    # gates it. Every branch is re-checked there regardless of trigger, so
    # "only on green" is enforced in one place, not two.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Merges need real history and every branch, not a shallow cone.
          fetch-depth: 0

      # NODE, BECAUSE THIS JOB NOW RUNS THE REPOSITORY'S OWN SUITE ON THE TREE
      # IT PUSHES. `24` is not a preference: `ci.yml` pins it because
      # adapter-vercel hard-rejects any Node major outside 20, 22 or 24, and a
      # sweep that ran the suite on a different major from the one CI runs it on
      # would be answering a question nobody asked. Two files naming one version
      # is the duplication this repo's own rules are against, and it is accepted
      # here for exactly one reason: `ci.yml` is READ-ONLY to the bundle that
      # added this, and a shared value would have to live in one of them anyway.
      # `tests/workflows.test.ts` asserts the two agree, which is the cheap half
      # of extracting it.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Merge main, then every green claude/** or codex/** branch, into integration
        env:
          # The CI workflow's FILENAME, which is what the Actions API keys on.
          # Rename ci.yml and this lookup 404s -- which fails CLOSED (every
          # branch reads as "CI: unknown" and nothing is merged), rather than
          # merging on no evidence.
          CI_WORKFLOW_FILE: ci.yml
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read through env, never interpolated into the script body: a branch
          # name is attacker-controllable text and `${{ }}` pastes it into the
          # shell before bash ever sees a quote.
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          # PLACEHOLDERS, COMMITTED ON PURPOSE, and the same two values
          # `ci.yml`'s own env block carries -- where the full reasoning is
          # written out. `npm test` reaches `svelte-kit sync` through the vitest
          # config, which generates `$env/static/public` from whatever
          # `PUBLIC_`-prefixed variables are in the environment; it reads their
          # PRESENCE and never their value, and with neither set the generated
          # module exports nothing and eight files fail to type-check. Nothing
          # in the suite makes a network call -- it talks to an embedded
          # Postgres, never to Supabase. NEVER a real credential here: this
          # workflow holds `contents: write`.
          PUBLIC_SUPABASE_URL: 'https://ci-placeholder.supabase.co'
          PUBLIC_SUPABASE_ANON_KEY: 'ci-placeholder-anon-key'
        run: |
          set -euo pipefail

          TARGET=integration

          # Cheap, deliberate assertion of the rule at the top of this file.
          # If a future edit ever points TARGET at the deploy branch, the job
          # stops here instead of deploying to a classroom.
          if [ "$TARGET" = main ] || [ "$TARGET" = master ]; then
            echo "::error::refusing to run: this workflow may never write to the deploy branch"
            exit 1
          fi

          # -----------------------------------------------------------------
          # THE LEDGER GATE. A branch is not swept while the ledger entry it
          # introduced still says its session is RUNNING.
          #
          # The failure it exists for, and it is measured rather than
          # imagined: `docs/prompt-ledger/README.md` requires a session to
          # commit its entry as its FIRST commit, so a rival chat fetching the
          # directory can see the work is in flight. CI goes green on that
          # first commit. This workflow then merged the branch and DELETED it
          # minutes into a session that was still working -- no work was lost,
          # the session kept pushing, but the branch list stopped measuring the
          # in-flight queue. On 2026-09-02 two prompts were in flight and
          # `git ls-remote --heads origin` read as ZERO standing branches.
          #
          # So the ENTRY is the signal and the branch's existence is not.
          # `Status: issued` means the session is still running; its own final
          # commit sets `pushed`, which is the moment the branch is finished
          # and this workflow may have it.
          #
          # THIS GATE ONLY EVER ADDS A SKIP, AND IT SKIPS ON EXACTLY TWO
          # THINGS: an entry the branch ADDED whose status reads `issued`, and
          # a surprise it cannot read past (no merge base with `origin/main`;
          # an added entry that yields no blob at the tip). Both surprises are
          # argued at their own sites below, and both fail in the same
          # direction as the CI check beside them. Everything else -- a branch
          # that adds no entry, an entry with no `Status:` line, a value nobody
          # has seen before, an entry the branch merely MODIFIED -- merges
          # exactly as it did before the gate existed. A branch that records
          # nothing is not the branch this is about, and a status a tool does
          # not recognise must never be able to pin a branch open forever.
          #
          # It is a FUNCTION and not four lines inline because it is PROVED
          # from fixtures: `tools/integrate-gate-proof.sh` cuts the text
          # between the two markers below out of THIS FILE and runs that exact
          # text against throwaway git repositories, so the proof cannot drift
          # into testing its own private copy of the rule. The markers are that
          # harness's cut points: do not rename them, and do not move the body
          # out from between them.
          # ledger_gate_marker:begin
          ledger_gate() {
            # $1 is the branch's remote-tracking ref. Prints a skip reason and
            # returns 0 to SKIP; returns 1, silently, to let the merge proceed.
            local ref="$1"
            local dir='docs/prompt-ledger/entries'
            local -a fields=()
            local n
            local i
            local path
            local body
            local line
            local token

            # WHICH ENTRIES ARE THIS BRANCH'S: THE ONES IT ADDED SINCE IT
            # FORKED, AND ONLY THOSE. A branch routinely MODIFIES a
            # higher-numbered entry belonging to somebody else -- advancing
            # another session's Status from `pushed` to `deployed` is
            # bookkeeping `docs/prompt-ledger/README.md` asks for -- and a
            # modified entry is a statement about SOMEBODY ELSE'S work, so it
            # decides nothing here.
            #
            # Measured on the branch that wrote this: it ADDED 0007 (`issued`,
            # its own, still running) and MODIFIED 0010 (`deployed`, somebody
            # else's). The rule this replaces was "the highest-numbered CHANGED
            # entry decides", so it read 0010, never looked at 0007, and merged
            # and deleted a session's branch while the session was working.
            #
            # A session's own entry is an ADD by construction: the ledger
            # README has the session commit it as its FIRST commit on its
            # branch, so it cannot exist at the merge base.
            #
            # Three dots, so the base is the MERGE BASE and not main's tip.
            # `origin/main` and not `$TARGET` as that base, deliberately: an
            # entry that has reached `integration` got there on some other
            # branch, and basing on integration would hide this branch's own
            # entry the moment it merged integration in.
            #
            # `-c core.quotePath=false` because git C-quotes any path holding a
            # non-ASCII byte by default -- `0012-cafe.md` with an accent
            # arrives as `"docs/.../0012-caf\303\251.md"`, quotes and all -- and
            # a slug is hand-written from a prompt title, so that is an ordinary
            # thing to see and not an exotic one. `-z` so the delimiter is a NUL
            # that cannot occur inside a path. Under the old quoting such an
            # entry matched nothing and an `issued` branch merged.
            #
            # AND THE LIST NEVER GOES THROUGH A COMMAND SUBSTITUTION, because
            # `$(...)` DROPS NUL BYTES -- bash 5.2 says `ignored null byte in
            # input` out loud and older bashes say nothing at all. Captured that
            # way, `-z` output arrives as one run-on string with every delimiter
            # gone and nothing matches: measured on the branch that wrote this,
            # which read as a single unmatched path and MERGED, exactly the
            # verdict this whole change exists to correct. `mapfile -d ''` off a
            # process substitution keeps the NULs, and git's own exit status
            # rides along as a final record so a diff that FAILED is still
            # distinguishable from a diff that found nothing.
            mapfile -d '' -t fields < <(
              git -c core.quotePath=false diff --name-status --diff-filter=A -z \
                "origin/main...$ref" -- "$dir" 2>/dev/null
              printf 'rc=%s\0' "$?"
            )

            n="${#fields[@]}"
            if [ "${fields[n-1]}" != rc=0 ]; then
              echo "ledger entry unreadable (no merge base with origin/main)"
              return 0
            fi

            # `--name-status -z` writes one NUL-terminated STATUS field then
            # one NUL-terminated PATH field per record, so the paths are the
            # ODD indices and the last element is the status record appended
            # above. `--diff-filter=A` is what makes that alternation safe to
            # rely on: only R and C records carry a SECOND path, and both are
            # excluded here.
            i=1
            while [ "$i" -lt "$((n - 1))" ]; do
              path="${fields[i]}"
              i=$((i + 2))
              case "$path" in *.md) ;; *) continue ;; esac

              # READ IT AT THE BRANCH TIP, never at the merge base and never
              # at main. The value the entry was ADDED with is `issued` by
              # construction -- that is what the session commits first -- and
              # the whole question is what the session last said about itself.
              # A copy on main's tip is no better: an entry gets there when
              # somebody else's branch lands, and it says whatever it said then.
              #
              # BY ITS FULL PATH, at whatever depth it sits. The diff already
              # gives the path, so an entry filed one directory deeper
              # (`entries/sub/0012-a.md`) is read exactly like a top-level one.
              # The rule this replaces rebuilt `$dir/<basename>` out of an
              # anchored `sed` that matched only the top level, so a nested
              # entry was invisible and an `issued` branch merged.
              if ! body="$(git show "$ref:$path" 2>/dev/null)"; then
                # Git named the path as added and then could not produce a blob
                # for it at the tip -- a gitlink, an object it cannot read. It
                # should not happen, and it is a surprise, so it fails in the
                # same direction as the CI check beside it: leave the branch
                # standing and say why in the summary.
                echo "ledger entry ${path##*/} could not be read at the branch tip"
                return 0
              fi

              # STRIP CARRIAGE RETURNS BEFORE READING ANYTHING. `.gitattributes`
              # records `core.autocrlf=true` on the authoring machine, so a CRLF
              # blob is not exotic. Python's `.split()` splits on `\r` and
              # bash's `read` uses IFS, which does not -- so `- Status: issued`
              # with a CR normalised to `issued` in `tools/idea-status.py` and
              # to `issued` PLUS A CARRIAGE RETURN here, the comparison below
              # failed, and the gate merged a live session's branch.
              body="${body//$'\r'/}"

              # EVERY `Status:` BULLET IN THE ENTRY IS READ, not just the first,
              # and ANY of them reading `issued` holds the branch.
              #
              # The bullet shapes: an optional indent, `-`/`*`/`+`, and optional
              # `*`/`_` emphasis around the word, so `  - Status:`,
              # `* Status:` and `- **Status**:` are all the field they look
              # like. A bullet is still REQUIRED, so a `Status:` written in the
              # middle of a sentence is prose and is not read.
              #
              # WHAT THIS STILL CANNOT DO, said plainly: a QUOTED `Status:`
              # bullet on its own line -- an entry whose Notes reproduce another
              # entry's field -- is indistinguishable from the real one by any
              # regex, because it IS the real shape. Reading every occurrence
              # rather than the first is what makes that safe in the direction
              # that matters: a quoted `pushed` can no longer mask a real
              # `issued` below it. The cost is the other direction, an entry
              # that QUOTES the word `issued` holding a finished branch, which
              # costs a branch standing until somebody looks at it.
              #
              # (This replaces a `sed -n '1p'` that carried a warning about `q`
              # or `head -n 1` sending SIGPIPE upstream and `pipefail` turning
              # that into a skipped branch. That warning was FALSE where it
              # stood: the assignment ended in `|| true`, and errexit is
              # suspended anyway for everything called from an `if` condition,
              # which is how this function is called. The reason not to stop at
              # the first line is the quoted-prose case above, not a signal.)
              while IFS= read -r line; do
                read -r token _ <<<"$line" || true

                # NORMALISE AS A STRICT SUPERSET OF `tools/idea-status.py`
                # (`.split()[0].strip(".,").lower()`), NOT AS A DISAGREEMENT
                # WITH IT: first whitespace-separated token, surrounding
                # punctuation stripped, lowercased. Every value the tool reads
                # as `issued` this reads as `issued` too, because `.` and `,`
                # are punctuation; this additionally holds a few the tool would
                # not -- `issued;`, `"issued"`, `issued'`, `issued)`,
                # `(issued`, `issued:`, `-issued`, `issued!`, each of which
                # MERGED a live session's branch when only `.` and `,` were
                # stripped.
                #
                # That is the safe direction for a gate whose only job is to
                # HOLD a branch: reading one shape too many costs a finished
                # branch standing until somebody looks, and reading one too few
                # costs a running session its branch. A strict equality with the
                # tool would have been worse for exactly that reason -- it
                # would have made a typo the thing that decides whether a live
                # branch is deleted. It is still the same four-word vocabulary
                # the ledger README defines and adds no fifth state.
                token="$(printf '%s' "$token" | sed 's/^[[:punct:]]*//; s/[[:punct:]]*$//' | tr '[:upper:]' '[:lower:]')"

                # ONLY THE EXACT TOKEN HOLDS A BRANCH, and NO ORDERING DECIDES
                # WHICH ENTRY IS ASKED. There is no sort and no "newest wins":
                # every entry the branch added is asked, and one `issued`
                # among them is enough. Sorting was a second defect on its own
                # -- two entries sharing an id were resolved by whichever slug
                # sorted last, which is a coin toss, and an added 0007=issued
                # beside an added 0012=pushed merged a running session.
                if [ "$token" = issued ]; then
                  echo "ledger entry ${path##*/} still says its session is running (Status: issued)"
                  return 0
                fi
              #
              # A VALUE FOLDED ONTO THE NEXT LINE IS STILL THE VALUE, and this
              # is the one shape in which the superset claim above was FALSE.
              # `tools/idea-status.py` parses a continuation line, so an entry
              # written
              #
              #     - Status:
              #       issued
              #
              # reads as `issued` to the tool and read as EMPTY here, which
              # merged a running session's branch -- the one direction the
              # widening was chosen to avoid. `awk` and not `sed` because this
              # needs a line of lookahead: an empty inline value arms `want`,
              # and the next non-blank line answers it. That is also why the
              # entry format's own continuation shape (0006 carried one) cannot
              # be dismissed as hypothetical.
              done < <(printf '%s\n' "$body" | awk '
                match($0, /^[[:space:]]*[-*+][[:space:]]*[*_]*Status[*_]*[[:space:]]*:[[:space:]]*/) {
                  value = substr($0, RSTART + RLENGTH)
                  if (value ~ /^[[:space:]]*$/) { want = 1; next }
                  print value; want = 0; next
                }
                want && $0 !~ /^[[:space:]]*$/ { print $0; want = 0 }
              ')
            done

            # No added entry, or none of them says `issued`. The no-entry case
            # is the ordinary one for most branches and must stay the cheapest
            # path through here.
            return 1
          }
          # ledger_gate_marker:end

          # -----------------------------------------------------------------
          # THE CROSS-BRANCH GATE. A branch is not swept while another unmerged
          # branch holds the same migration number, or bumps the same standards
          # document to the same version string.
          #
          # THIS IS THE ONE QUESTION NO BRANCH CAN ANSWER FOR ITSELF, which is
          # why it is here and not a test. A `claude/**` or `codex/**` branch cannot see
          # another agent branch and neither can its CI: `ci.yml` checks
          # out one ref, shallow, with no sibling branch refs, so every check in
          # this repository that relates two files is green on each side of a
          # collision and red only where both edits first exist. Prompt 0075
          # answered half of that by running the suite on the MERGED tree
          # (`merged_suite` below). This is the other half: the sweep is the
          # first moment two branches are in one process at the same time, so it
          # is the only place a question ABOUT THE PAIR can be asked, and the
          # cheap ones are worth asking BEFORE the merge rather than after.
          #
          # TWO MEASURED COLLISIONS, both from 2026-09-06:
          #
          #   * MIGRATION NUMBERS. Five in two days. Sweeping both sides of a
          #     contested number gives `integration` two files with one number,
          #     which reddens the contiguity assertion in
          #     `tests/db/migration-0177-tombstone.test.ts` for a reason neither
          #     author can fix alone. Specified by prompt 0084, which owned the
          #     tool and not this file.
          #   * STANDARDS VERSIONS. Two lanes bumped `IDEA_instructions.md` to
          #     the IDENTICAL string `**Version 4.21 - 2026-09-06**`. Measured
          #     with `git merge-tree` on the two real tips: the header line
          #     merges with NO CONFLICT MARKER, because a 3-way merge whose two
          #     sides made the same change has, by definition, nothing to
          #     report. `tests/standards-version-header.test.ts` cannot see it
          #     either -- it compares a file's header to its own changelog, and
          #     both sides were internally consistent.
          #
          # IT FAILS TOWARD MERGING, WHICH IS THE OPPOSITE DIRECTION FROM
          # `ledger_gate`, AND THAT IS DELIBERATE. Either read failing leaves
          # its half of the table empty and every branch sweeps exactly as it
          # did before this existed; the failure is NAMED in the job summary and
          # never swallowed. `ledger_gate` holds a branch on a surprise because
          # the cost of getting it wrong is a live session losing its branch.
          # Here the cost of a broken read is a contested number reaching
          # `integration`, which is recoverable and visible; the cost of failing
          # the other way is a queue stalled on a tool nobody has to have. So
          # this gate can only ever ADD a skip.
          #
          # It is FUNCTIONS and between markers for `ledger_gate`'s reason: they
          # are PROVED by cutting this exact text out of THIS FILE and running
          # it against throwaway git repositories, so no proof can drift into
          # testing a private copy of the rule. Do not rename the markers and do
          # not move the bodies out from between them.
          # cross_branch_marker:begin
          contested_number_rows() {
            # Prints `<branch>\t<reason>` for every branch holding a migration
            # number another unmerged branch also holds. Returns 1, having
            # printed nothing, when the tool could not answer at all.
            #
            # THE TOOL IS ASKED FOR BRANCH NAMES AND NOT FOR JSON. A shell loop
            # that parses JSON is a second parser of the tool's own output, and
            # `--contested-branches` exists so there is one. Its filters -- only
            # agent-branch holders, and two DISTINCT ones -- are argued in
            # `contestedBranches` in `tools/migration-claims.mjs`; the important
            # one is that the sweep runner's own working tree is `integration`
            # mid-merge and would otherwise contest with the branch that wrote
            # the number.
            #
            # EMPTY OUTPUT AND EXIT 0 IS THE ORDINARY ANSWER and is not the same
            # as the tool failing. Those two take the sweep in opposite
            # directions, so they are distinguished by the exit status alone.
            local out one
            out="$(node tools/migration-claims.mjs --contested-branches 2>/dev/null)" || return 1
            [ -n "$out" ] || return 0
            while IFS= read -r one; do
              [ -n "$one" ] || continue
              printf '%s\t%s\n' "$one" \
                'holds a migration number another unmerged branch also holds; run `node tools/migration-claims.mjs` to see which'
            done <<<"$out"
            return 0
          }

          standards_version() {
            # $1 ref, $2 path. Prints the version out of the document's HEADER
            # (`**Version 4.21 - 2026-09-06**` -> `4.21`), or nothing when the
            # file has no such header. Returns 1 only when the blob is missing.
            #
            # THE FIRST TWELVE LINES ONLY, because these documents discuss their
            # own version numbers in prose ("stale at 1.1 since that version")
            # and a body mention must never be read as the header. Same bound
            # `tests/standards-version-header.test.ts` uses for the same reason.
            #
            # NO `head` AND NO `exit` IN THE awk, and that is not style. Either
            # one stops reading before `git show` has finished writing, `git`
            # takes SIGPIPE, and under the `set -o pipefail` this step runs with
            # the whole pipeline reports failure -- which here would read as a
            # missing header on a document that has one.
            local blob
            blob="$(git show "$1:$2" 2>/dev/null)" || return 1
            printf '%s\n' "$blob" | awk '
              !found && NR <= 12 && match($0, /^\*\*Version[ \t]+[0-9][0-9.]*/) {
                v = substr($0, RSTART, RLENGTH)
                sub(/^\*\*Version[ \t]+/, "", v)
                print v
                found = 1
              }'
          }

          contested_version_rows() {
            # Prints `<branch>\t<reason>` for every branch bumping a standards
            # document to a version string another unmerged branch also bumps it
            # to. Returns 1, having printed nothing, when a read failed.
            #
            # A BRANCH CLAIMS A VERSION ONLY WHEN IT MOVED IT OFF `origin/main`'s.
            # Carrying main's own version is not a claim, so a document nobody
            # touched cannot contest with anything.
            #
            # AND THE COLLISION IS `SAME VERSION, DIFFERENT BYTES`, WHICH IS THE
            # PRECISE SHAPE AND NOT AN APPROXIMATION. Two branches can hold one
            # version string legitimately -- branch B merged branch A, or both
            # merged a third -- and in every one of those the BLOB is identical,
            # so the merge is a no-op and there is nothing to contest. Comparing
            # blobs rather than walking ancestry gets that exactly right in one
            # `git rev-parse`, where an ancestor check would have reported both
            # sides of a shared third branch as a collision.
            #
            # WHAT IT DELIBERATELY DOES NOT CATCH, said plainly: two branches
            # editing one standards document WITHOUT bumping it. That is a
            # different defect (nobody claimed a version at all), git will
            # usually conflict on it, and widening this to cover it would hold
            # every branch that touches a standards file main also moved.
            local dir='docs/standards'
            local refs ref branch path mine theirs blob rows=''
            local -a fields=()
            local n i
            refs="$(git for-each-ref --format='%(refname:short)' refs/remotes/origin 2>/dev/null)" || return 1
            [ -n "$refs" ] || return 0
            while IFS= read -r ref; do
              [ -n "$ref" ] || continue
              branch="${ref#origin/}"
              case " $AGENT_BRANCH_PREFIXES " in *" ${branch%%/*}/ "*) ;; *) continue ;; esac

              # NUL-DELIMITED AND NEVER THROUGH `$(...)`, for the reason written
              # out at `ledger_gate`: command substitution DROPS NUL bytes, so a
              # captured `-z` list arrives as one run-on string that matches no
              # path. `--name-only` writes ONE record per path (no status
              # field), which is why this steps by one where `ledger_gate`'s
              # `--name-status` walk steps by two.
              mapfile -d '' -t fields < <(
                git -c core.quotePath=false diff --name-only -z "origin/main...$ref" -- "$dir" 2>/dev/null
                printf 'rc=%s\0' "$?"
              )
              n="${#fields[@]}"
              [ "${fields[n-1]}" = rc=0 ] || return 1
              i=0
              while [ "$i" -lt "$((n - 1))" ]; do
                path="${fields[i]}"
                i=$((i + 1))
                case "$path" in *.md) ;; *) continue ;; esac
                mine="$(standards_version "$ref" "$path")" || continue
                [ -n "$mine" ] || continue
                theirs="$(standards_version origin/main "$path")" || theirs=''
                [ "$mine" != "$theirs" ] || continue
                blob="$(git rev-parse "$ref:$path" 2>/dev/null)" || continue
                # TAB-DELIMITED AND BUILT WITH `$'\t'`/`$'\n'` RATHER THAN LITERAL
                # WHITESPACE: a real newline inside this string would sit at column
                # zero of the YAML block scalar and end the `run:` block.
                rows+="${branch}"$'\t'"${path}"$'\t'"${mine}"$'\t'"${blob}"$'\n'
              done
            done <<<"$refs"
            [ -n "$rows" ] || return 0

            # GROUPED ON (path, version), REPORTED ONLY WHERE THE GROUP HOLDS
            # TWO OR MORE DISTINCT BLOBS, and every branch in such a group is
            # named to every other one. Neither side is wrong and there is no
            # rule here for picking one; what there is, is a reason a person
            # needs to read.
            printf '%s' "$rows" | awk -F'\t' '
              {
                key = $2 SUBSEP $3
                if (!((key SUBSEP $4) in seenblob)) { seenblob[key SUBSEP $4] = 1; blobs[key]++ }
                if (!((key SUBSEP $1) in seenbranch)) {
                  seenbranch[key SUBSEP $1] = 1
                  who[key] = who[key] (who[key] == "" ? "" : ", ") $1
                }
                rk[NR] = key; rb[NR] = $1; rp[NR] = $2; rv[NR] = $3
              }
              END {
                for (i = 1; i <= NR; i++) {
                  if (blobs[rk[i]] < 2) continue
                  others = ""
                  parts = split(who[rk[i]], w, ", ")
                  for (j = 1; j <= parts; j++)
                    if (w[j] != rb[i]) others = others (others == "" ? "" : ", ") w[j]
                  printf "%s\tbumps %s to version %s, and so does %s, from different content -- one of the two has to renumber\n", \
                    rb[i], rp[i], rv[i], others
                }
              }'
          }

          cross_branch_gate() {
            # $1 the branch, $2 the table both producers above wrote. Prints a
            # skip reason and returns 0 to SKIP; returns 1, silently, to let the
            # merge proceed.
            #
            # ONE LOOKUP FOR BOTH PRODUCERS, on purpose. Two gates asking the
            # same "is this branch in a list" question in two spellings is the
            # duplication this repository's own rules are against, and the skip
            # reads the same way in the job summary whichever produced it.
            #
            # AN EMPTY TABLE IS THE ORDINARY CASE and must stay the cheapest
            # path through here: most sweeps contest nothing.
            local branch="$1" table="$2" who why
            [ -n "$table" ] || return 1
            while IFS="$(printf '\t')" read -r who why; do
              [ "$who" = "$branch" ] || continue
              [ -n "$why" ] || continue
              printf '%s\n' "$why"
              return 0
            done <<<"$table"
            return 1
          }
          # cross_branch_marker:end


          # A BRANCH THE TARGET ALREADY CONTAINS IS DELETED NOW, AND THAT
          # REVERSES WHAT THIS FILE USED TO SAY.
          #
          # The skip below used to read "it is deliberately not deleted. A
          # branch can be contained in $TARGET because THIS system merged it, or
          # because it was merged to `main` by hand long ago, and from here those
          # two are indistinguishable." Both halves are true and the conclusion
          # did not follow: the question a delete has to answer is not WHO
          # merged it, it is whether anything would be lost, and a ref whose
          # every commit is already reachable from a branch on the remote holds
          # nothing that deleting the ref can take away.
          #
          # The cost of the old reading is measured rather than argued: every
          # branch landed by a merge bundle became a permanent ref, ten
          # accumulated across two rounds, and five were deleted by hand.
          #
          # CONTAINMENT IS TESTED AGAINST A REF THAT IS ALREADY ON THE REMOTE,
          # never against the local HEAD, and that distinction is the whole
          # safety argument. By the time the loop runs, HEAD is $TARGET plus
          # origin/main plus whatever this run has merged so far, and NONE of
          # that is pushed yet -- so a branch contained only in HEAD is a branch
          # whose only copy could still be this runner's disk if the push is
          # rejected. `origin/$TARGET` and `origin/main` are durable, so a
          # branch contained in either is safe to delete whatever happens next
          # in this job, which is also why the delete does not wait on the push
          # the way the post-merge delete must.
          #
          # THREE REFS ARE NEVER DELETED WHATEVER THE CONTAINMENT ANSWER, and
          # the loop's own agent-prefix filter is not treated as sufficient: this
          # is the one place in the file that removes a ref nothing merged, so
          # it names `main` (every push to which deploys ideabosco.com),
          # `integration` and $TARGET itself explicitly, and refuses anything
          # that is not an agent branch, before it looks at containment at
          # all.
          #
          # It is a FUNCTION and between markers for `ledger_gate`'s reason: it
          # is PROVED by cutting this exact text out of this file and running it
          # against throwaway git repositories, so no proof can drift into
          # testing a private copy of the rule. Do not rename the markers and do
          # not move the body out from between them.
          #
          # THE HARNESS THAT CUTS THESE MARKERS IS NOT IN THE REPO YET, AND THAT
          # IS A GAP RATHER THAN A DESIGN. Fourteen assertions were executed
          # against throwaway `mktemp -d` repositories when this landed -- a
          # contained tip deleted, a tip only `origin/main` contains deleted, an
          # outstanding tip left, a red branch left (by the ORDERING above, which
          # is asserted by line number: the gate alone would say delete, and the
          # loop never asks it), and `main`, `integration`, the target by name
          # and a non-agent branch all refused whatever the containment
          # answer -- plus the single-delete-loop shape below, and a negative
          # control confirming the cut refuses to run, loudly, when the markers
          # are renamed. That harness belongs beside
          # `tools/integrate-gate-proof.sh`, which does exactly this for
          # `ledger_gate`; the bundle that wrote this owned this file and not
          # `tools/`, so it is named here rather than smuggled in.
          # contained_delete_marker:begin
          contained_delete_gate() {
            # $1 branch name, $2 the tip sha this run measured, $3 the target
            # branch. Prints a reason and returns 0 to DELETE; returns 1,
            # silently, to leave the branch standing.
            local branch="$1"
            local sha="$2"
            local target="$3"
            local ref

            # PROTECTED FIRST, so no containment answer can reach a delete.
            case "$branch" in
              main | integration | "$target") return 1 ;;
            esac
            case " $AGENT_BRANCH_PREFIXES " in
              *" ${branch%%/*}/ "*) ;;
              *) return 1 ;;
            esac

            for ref in "refs/remotes/origin/$target" refs/remotes/origin/main; do
              git rev-parse --verify --quiet "$ref" >/dev/null || continue
              if git merge-base --is-ancestor "$sha" "$ref"; then
                echo "already in ${ref#refs/remotes/origin/}"
                return 0
              fi
            done
            return 1
          }
          # contained_delete_marker:end

          # THE PUSH DECISION, AND IT IS A FUNCTION FOR THE REASON THE TWO
          # GATES ABOVE ARE: it is PROVED by cutting this exact text out of
          # THIS FILE and running it against throwaway git repositories, so no
          # proof can drift into testing a private copy of the rule. Do not
          # rename the markers and do not move the body out from between them.
          #
          # WHAT IT DECIDES, and what it deliberately does not. It answers one
          # question -- did $TARGET move -- and it answers it from two shas
          # rather than from any array this job built. The condition it
          # replaces was `[ ${#merged[@]} -gt 0 ]`, which asked whether a
          # BRANCH merged and therefore threw away a main-merge on every run
          # where every outstanding branch conflicted. That is the deadlock
          # argued at the main-merge below.
          #
          # It cannot push a broken tree, and the reason is upstream of here
          # rather than inside it: a main-merge conflict aborts and exits the
          # step before this is ever called, and a BRANCH conflict aborts that
          # one merge and leaves HEAD exactly where it was, so a conflicted
          # branch contributes nothing to the comparison. Every sha it can be
          # handed is a tree git itself resolved.
          # target_push_marker:begin
          target_push_gate() {
            # $1 the sha the remote already has for the target, EMPTY when the
            # target branch does not exist on the remote yet. $2 the sha HEAD
            # is at now. Returns 0 to PUSH, 1 to leave the remote alone.
            #
            # THE EMPTY CASE IS A PUSH, on purpose: a first run must create the
            # branch even if it merged nothing into it, and an empty string
            # cannot equal a sha.
            [ "$2" != "${1:-}" ]
          }
          # target_push_marker:end

          # THE CI CONCLUSION FOR ONE BRANCH TIP, AND IT IS A FUNCTION FOR THE
          # REASON THE THREE GATES ABOVE ARE: it is PROVED by cutting this exact
          # text out of THIS FILE and running it against fixture JSON, so no
          # proof can drift into testing a private copy of the rule. Do not
          # rename the markers and do not move the body out from between them.
          #
          # THE TRIGGER FILTER IS GONE, AND ITS ABSENCE IS THE POINT. This query
          # used to pass `-f event=push`, so it asked GitHub only for CI runs a
          # PUSH had started. On 2026-09-04 three finished branches were re-run
          # green by `workflow_dispatch` -- which is the obvious thing to do to
          # a branch whose CI went red for a reason since fixed -- the query
          # returned nothing for their shas, all three read as `unknown`, the
          # sweep skipped every one of them, nothing merged, so the push was
          # discarded, so the deploy stayed blocked, and a person merged all
          # three by pull request instead. `ci.yml` declares FOUR triggers that
          # can start a run of it (`push`, `pull_request`, `schedule`,
          # `workflow_dispatch`) plus `workflow_call`; a green run is a green
          # run whichever of them started it, because what CI checked is the
          # SHA and not the button.
          #
          # WHAT MUST NOT WEAKEN, and what replaced what:
          #   head_sha == $sha   THE SECURITY PROPERTY, untouched. A green run
          #                      against a DIFFERENT commit says nothing about
          #                      this one, so a branch that was green two
          #                      commits ago is still not green. Widening the
          #                      trigger set must never widen this.
          #   head_repository    NEW HERE, and it is not gold-plating: it
          #                      replaces a protection `event=push` was quietly
          #                      providing at this level. A fork's CI run lands
          #                      in OUR Actions as a `pull_request` run, which
          #                      the trigger filter excluded as a side effect;
          #                      dropping that filter without this would newly
          #                      admit one. The job-level `if` above only ever
          #                      covered the TRIGGERING branch.
          #   newest wins        `sort_by(.run_number) | last`, and it matters
          #                      more now than it did. With one trigger a sha
          #                      had one run; with every trigger a sha can
          #                      carry a red `push` run AND the green
          #                      `workflow_dispatch` re-run that fixed it. The
          #                      answer is the LATER one, and BOTH directions
          #                      are proved -- a green run followed by a red
          #                      re-run on the same tip must skip.
          #
          # IT FAILS CLOSED ON ABSENCE, exactly as `CI_WORKFLOW_FILE` does: no
          # run for the tip, a payload with no `workflow_runs`, a run whose
          # repository cannot be read, or jq refusing the input at all, each
          # reduce to `unknown`, which is not `success`, which skips. The one
          # thing this must never do is answer `success` on no evidence.
          # ci_gate_marker:begin
          ci_conclusion() {
            # $1 the runs payload, $2 the branch tip sha, $3 owner/repo.
            # Prints the conclusion of the NEWEST completed run for that exact
            # sha in that repository, or `unknown` when there is none.
            #
            # SPLIT FROM THE FETCH ON PURPOSE. The `gh api` call needs a token,
            # a network and a repository full of real runs; the DECISION needs
            # none of the three, and the decision is the half that got this
            # wrong. So the fetch stays at the call site and this takes its
            # answer as a string, which is what makes every case below drivable
            # against fixture JSON by the proof harness.
            #
            # `.workflow_runs // []` rather than `.workflow_runs[]`: jq cannot
            # iterate null, and a payload without the key -- which is what a
            # 404 body or a rate-limit body looks like -- would otherwise abort
            # the whole step under `pipefail` instead of skipping one branch.
            printf '%s' "$1" \
              | jq -r --arg sha "$2" --arg repo "$3" \
                  '[(.workflow_runs // [])[]
                      | select(.head_sha == $sha)
                      | select(.head_repository.full_name == $repo)]
                     | sort_by(.run_number) | last | .conclusion // "unknown"' \
                  2>/dev/null \
              || printf 'unknown\n'
          }
          # ci_gate_marker:end

          # MECHANICAL RESOLUTION, FOR EXACTLY TWO FILES AND NOTHING ELSE.
          #
          # The merge above says FAIL LOUD, NEVER FORCE, and it stays true:
          # what a machine may not do is PICK A SIDE of somebody's writing.
          # Two files in this repository conflict constantly and neither has a
          # side to pick, because neither is written by hand at the point of
          # conflict.
          #
          # MEASURED, not assumed. Replaying every merge in this repository
          # since 2026-08-30 with `git merge-tree` gives 24 conflicted merges
          # and 30 conflicting paths: 19 `tools/browser-verify/README.md`,
          # 6 `classroom-updates.json`, and 4 genuine source conflicts in 3
          # merges (`docs/history/...`, one notebook page, and two maps files).
          # Twenty-five of thirty had a deterministic answer and cost five hand
          # deletions and three landing bundles anyway.
          #
          #   * `tools/browser-verify/README.md` -- the conflict is always
          #     inside `<!-- counts:begin -->`/`<!-- counts:end -->`, which is
          #     GENERATED. Its own header says so: "a conflict here is resolved
          #     by running one sub-second command, never by choosing a side and
          #     never by finding a browser". `--static` is a tree read, measured
          #     at 0.386s in a checkout with no `node_modules`, no browser and
          #     no dev server. So the resolution is: take the target's side
          #     INSIDE the markers, then regenerate the static half against the
          #     MERGED tree, which is the only tree whose answer is right.
          #   * `classroom-updates.json` -- an append-only array of entries.
          #     Two sessions each append; the answer is both appends.
          #
          # THE RULES THIS OBEYS, and each is a refusal it can reach:
          #   * A conflict in ANY OTHER PATH leaves the branch conflicted,
          #     exactly as before. The allowlist is checked over every unmerged
          #     path before a single one is touched.
          #   * A conflict in that README's PROSE -- outside the markers -- is a
          #     person's conflict and is left conflicted. That is not a
          #     heuristic: see `_counts_merge`.
          #   * A `classroom-updates.json` change that is not an append -- an
          #     entry edited or removed on either side -- is left conflicted.
          #   * IT NEVER TAKES A WHOLE SIDE OF A FILE. Everything git merged
          #     cleanly stays merged; only the conflicting hunks inside the
          #     generated region take the target's side.
          #   * Every resolution is NAMED in the job summary, per branch and per
          #     file, with what it did.
          #
          # THE ONE THING IT TRUSTS FROM THE TREE is the generator it runs,
          # `tools/browser-verify/readme-counts.mjs`, which comes off the merged
          # tree and is therefore mutable by a session branch -- unlike this
          # file, which GitHub always takes from the default branch. That is
          # inherent: regenerating a generated region needs the generator. Its
          # output is checked back into the same refusals as everything else
          # here (a marker left behind, an unmerged stage) and `--static` writes
          # nothing outside the two static markers.
          #
          # It is a FUNCTION and between markers for `ledger_gate`'s reason: it
          # is PROVED by cutting this exact text out of THIS FILE and running it
          # against throwaway git repositories, so no proof can drift into
          # testing a private copy of the rule. Do not rename the markers and do
          # not move the bodies out from between them.
          # auto_resolve_marker:begin
          auto_resolve() {
            # $1 the branch being merged, used only in what this prints.
            #
            # Called ONLY with a conflicted merge in progress. It resolves EVERY
            # unmerged path or it resolves none of them: one line per file on
            # stdout and 0 when the index is ready to commit, silence and 1
            # otherwise. The caller aborts the merge on 1, so a half-resolved
            # tree is never what gets committed.
            local branch="$1"
            local readme='tools/browser-verify/README.md'
            local updates='classroom-updates.json'
            local -a unmerged=()
            local -a did=()
            local n path

            # THE UNMERGED SET, READ THE WAY `ledger_gate` READS ITS DIFF:
            # NUL-delimited, never through `$(...)` (which DROPS NUL bytes and
            # would leave one run-on string that matches no path), with git's
            # own exit status riding back as a final record so a diff that
            # FAILED is distinguishable from one that found nothing.
            mapfile -d '' -t unmerged < <(
              git diff --name-only --diff-filter=U -z
              printf 'rc=%s\0' "$?"
            )
            n="${#unmerged[@]}"
            [ "${unmerged[n-1]}" = rc=0 ] || return 1
            unset "unmerged[$((n - 1))]"
            [ "${#unmerged[@]}" -gt 0 ] || return 1

            # THE ALLOWLIST IS ASKED ABOUT EVERY PATH BEFORE ANY PATH IS
            # TOUCHED. One file outside it and this is a person's conflict,
            # whatever the other files are.
            for path in "${unmerged[@]}"; do
              case "$path" in
                "$readme" | "$updates") ;;
                *) return 1 ;;
              esac
            done

            for path in "${unmerged[@]}"; do
              case "$path" in
                "$readme")
                  _counts_resolve "$path" || return 1
                  did+=("\`$path\` -- the conflict was inside the generated counts markers, so the target's side was taken there and the static region was regenerated on the merged tree")
                  ;;
                "$updates")
                  _updates_resolve "$path" || return 1
                  did+=("\`$path\` -- an append from each side; every entry from both is in the result")
                  ;;
              esac
            done

            # NOTHING LEAVES HERE CARRYING A MARKER, and the index is ASKED
            # again rather than assumed. `=======` is deliberately not one of
            # the three: it is also a markdown setext underline, and this runs
            # over a markdown file.
            for path in "${unmerged[@]}"; do
              if grep -qE '^(<<<<<<< |\|\|\|\|\|\|\| |>>>>>>> )' "$path"; then return 1; fi
              git add -- "$path" || return 1
            done
            [ -z "$(git diff --name-only --diff-filter=U)" ] || return 1

            printf '%s\n' "${did[@]}"
            return 0
          }

          # The two resolvers are wrappers so that every refusal inside them
          # still removes the scratch directory; the bodies below return early
          # from a dozen places and a `trap` cannot be scoped to a function.
          _counts_resolve() {
            local d rc=0
            d="$(mktemp -d)" || return 1
            _counts_merge "$1" "$d" || rc=$?
            rm -rf "$d"
            return "$rc"
          }

          _updates_resolve() {
            local d rc=0
            d="$(mktemp -d)" || return 1
            _updates_merge "$1" "$d" || rc=$?
            rm -rf "$d"
            return "$rc"
          }

          _counts_merge() {
            # GIT RESOLVES THE HUNKS AND NO MARKER PARSER EXISTS HERE, which is
            # what makes "only inside the generated region" a fact rather than a
            # regex. `git merge-file --ours` and `--theirs` run the SAME
            # three-way merge over the same three stages and differ ONLY where
            # that merge conflicted -- a hunk both sides merged cleanly comes
            # out identical in both. So requiring the two outputs to be
            # BYTE-IDENTICAL from the top of the file down to the begin marker,
            # and from the end marker down to the last byte, proves every
            # conflict lay strictly between them. A prose conflict above the
            # block makes the prefixes differ and this returns 1.
            local path="$1" d="$2" rc=0 f bm em by ey
            local beginm='<!-- counts:begin -->'
            local endm='<!-- counts:end -->'

            # No stage 1 is an add/add: two whole files with no base, so there
            # is no three-way merge to take a side within. Refused.
            git show ":1:$path" > "$d/base" 2>/dev/null || return 1
            git show ":2:$path" > "$d/ours" 2>/dev/null || return 1
            git show ":3:$path" > "$d/theirs" 2>/dev/null || return 1

            # merge-file exits with the CONFLICT COUNT, so a non-zero status is
            # the ordinary case; 127 and above is its error range and is refused.
            rc=0; git merge-file -p --ours   "$d/ours" "$d/base" "$d/theirs" > "$d/mine"  || rc=$?
            [ "$rc" -lt 127 ] || return 1
            rc=0; git merge-file -p --theirs "$d/ours" "$d/base" "$d/theirs" > "$d/yours" || rc=$?
            [ "$rc" -lt 127 ] || return 1

            # EXACTLY ONE OF EACH MARKER IN EACH OUTPUT. A conflict that
            # duplicated a marker line would otherwise make "inside" ambiguous,
            # and the ambiguous answer is the one that must not be acted on.
            for f in "$d/mine" "$d/yours"; do
              [ "$(grep -cF "$beginm" "$f" || true)" = 1 ] || return 1
              [ "$(grep -cF "$endm"   "$f" || true)" = 1 ] || return 1
            done

            bm="$(grep -nF "$beginm" "$d/mine"  | cut -d: -f1)"
            em="$(grep -nF "$endm"   "$d/mine"  | cut -d: -f1)"
            by="$(grep -nF "$beginm" "$d/yours" | cut -d: -f1)"
            ey="$(grep -nF "$endm"   "$d/yours" | cut -d: -f1)"
            [ "$bm" -lt "$em" ] || return 1
            [ "$by" -lt "$ey" ] || return 1

            head -n "$bm" "$d/mine"  > "$d/pre-a"
            head -n "$by" "$d/yours" > "$d/pre-b"
            cmp -s "$d/pre-a" "$d/pre-b" || return 1
            tail -n +"$em" "$d/mine"  > "$d/post-a"
            tail -n +"$ey" "$d/yours" > "$d/post-b"
            cmp -s "$d/post-a" "$d/post-b" || return 1

            cp "$d/mine" "$path" || return 1

            # THEN THE MERGED TREE'S OWN ANSWER, which is neither side's. The
            # static region is a pure function of the tree, so this is the only
            # step that can be right, and on a tree whose counts did not move it
            # writes nothing at all.
            node tools/browser-verify/readme-counts.mjs --static >/dev/null 2>&1 || return 1
            return 0
          }

          _updates_merge() {
            # APPEND-ONLY IS CHECKED, NOT ASSUMED, and the check is what makes
            # "keep both appends" the whole of the question: the `_readme` block
            # must be identical on both sides, and EVERY entry in the merge base
            # must still be present in both. An entry edited or removed on
            # either side is a decision about somebody's words and is left
            # conflicted. Entries are compared by VALUE with their keys sorted,
            # so key order in the file cannot make one entry read as two.
            #
            # ORDER DOES NOT MATTER TO THE READER and is still deterministic
            # here: `src/lib/classroom/updates.ts` sorts by date, newest first,
            # and the file's own `_readme` says entries may go anywhere. The
            # result is the target's list in the target's order, with the
            # branch's new entries appended in the branch's order.
            local path="$1" d="$2"

            git show ":1:$path" > "$d/base" 2>/dev/null || return 1
            git show ":2:$path" > "$d/ours" 2>/dev/null || return 1
            git show ":3:$path" > "$d/theirs" 2>/dev/null || return 1

            jq --tab -n \
              --slurpfile base "$d/base" \
              --slurpfile ours "$d/ours" \
              --slurpfile theirs "$d/theirs" '
                def canon: to_entries | sort_by(.key) | from_entries | tojson;
                ($base[0]) as $b | ($ours[0]) as $o | ($theirs[0]) as $t
                | ($b.entries // []) as $be
                | ($o.entries // []) as $oe
                | ($t.entries // []) as $te
                | ($oe | map(canon)) as $ok
                | ($te | map(canon)) as $tk
                | if ($o._readme != $t._readme)
                  then error("the _readme block differs between the two sides")
                  else . end
                | if ($be | map(canon) | map(. as $x | ($ok | index($x)) != null and ($tk | index($x)) != null) | all)
                  then . else error("an entry in the merge base is gone from one side: this is an edit or a removal, not an append")
                  end
                | { _readme: $o._readme,
                    entries: ($oe + [ $te[] | select((. | canon) as $x | ($ok | index($x)) == null) ]) }
              ' > "$d/out" || return 1

            # IT MUST STILL BE THE SHAPE THE READER IMPORTS.
            jq -e 'has("_readme") and has("entries") and (.entries | type == "array")' \
              "$d/out" >/dev/null || return 1

            # AND NOTHING LOST, NOTHING INVENTED -- asserted as a SET
            # comparison, which is a different expression from the construction
            # above rather than a second copy of it. A program checked against
            # its own rule cannot fail.
            [ "$(jq -n --slurpfile o "$d/ours" --slurpfile t "$d/theirs" --slurpfile r "$d/out" '
                   def canon: to_entries | sort_by(.key) | from_entries | tojson;
                   ($r[0].entries | map(canon) | unique) as $got
                   | ((($o[0].entries // []) + ($t[0].entries // [])) | map(canon) | unique) as $want
                   | ($got == $want)
                 ' || true)" = true ] || return 1

            cp "$d/out" "$path" || return 1
            return 0
          }
          # auto_resolve_marker:end

          # THE STATIC COUNTS REGION AFTER A MERGE THAT DID NOT CONFLICT, which
          # is a DIFFERENT GAP from the one `auto_resolve` closes and is not
          # covered by it. That function runs when a merge CONFLICTS on the
          # counts README; this runs when it does not.
          #
          # THE SHAPE, REPRODUCED BEFORE IT WAS WRITTEN RATHER THAN ARGUED. Two
          # branches each add ONE route spec. Each is green on its own CI,
          # because `tests/derived-numbers.test.ts` checks the static region
          # against the tree on every run and each branch regenerated for its
          # own tree -- and each therefore wrote the SAME number, base + 1. Git
          # sees an IDENTICAL edit on both sides of the second merge, takes it
          # with no conflict at all, and `integration` is pushed with a region
          # saying 103 over a tree holding 104. Measured in throwaway
          # repositories: base 102/102, after the first merge 103/103, after
          # the second 103/104, `--static --check` stale. Prompt 0035's own
          # fixture names the shape in a comment ("two branches that each add
          # exactly one page regenerate to the SAME number, git merges the
          # identical text cleanly") and steered around it, because it was
          # proving the resolver and this is not the resolver's case.
          #
          # ONCE, AFTER EVERY MERGE IN THE SWEEP, ON THE FINAL TREE. Per merge
          # would be several commits saying the same thing and would still have
          # to be redone at the end: the only tree whose counts are right is
          # the one that gets pushed.
          #
          # ONLY THE STATIC HALF, AND THAT IS ASSERTED RATHER THAN INTENDED.
          # `--static` is a tree read -- no browser, no dev server, no network,
          # no `node_modules`; measured at 96-313ms on a checkout with none of
          # them. The MEASURED half needs a browser and about six minutes, and a
          # sweep that rewrote it would be publishing a measurement it never
          # took; prompt 0046's covered-set check is what carries that half. So
          # this refuses to commit unless the ONE file it expects is the only
          # thing that moved.
          #
          # IT NEVER LOSES A MERGE. Every failure returns non-zero having
          # committed nothing, the caller reports it and pushes the merges
          # anyway, and the region is left exactly as stale as every run before
          # this one left it.
          #
          # THE EXTRA COMMIT IS SAFE AND STARTS NOTHING. It rides the same
          # single `git push` as the merges, and `ci.yml`'s own header records
          # why that push triggers no workflow run at all: GitHub starts none
          # from a push made with `GITHUB_TOKEN`. So there is no loop to break
          # here and none is added.
          #
          # It is a FUNCTION and between markers for `auto_resolve`'s reason: it
          # is PROVED by cutting this exact text out of THIS FILE and running it
          # against throwaway git repositories, so no proof can drift into
          # testing a private copy of the rule. Do not rename the markers and do
          # not move the bodies out from between them.
          # counts_refresh_marker:begin
          counts_refresh() {
            # Called with a merged, committed tree and nothing staged. Prints
            # ONE line -- the region's counts before and after -- and returns 0
            # when it committed; prints NOTHING and returns 0 when the region
            # was already the merged tree's own answer; returns non-zero, having
            # committed nothing, on every failure.
            local readme='tools/browser-verify/README.md'
            local before after
            local -a moved=()

            [ -f "$readme" ] || return 1
            [ -f tools/browser-verify/readme-counts.mjs ] || return 1

            # THE DATA LINE, NOT THE RENDERED TABLE. The table is derived from
            # it, so a summary quoting the derived copy would be a second
            # reading of one fact.
            before="$(_counts_data "$readme")" || return 1

            node tools/browser-verify/readme-counts.mjs --static >/dev/null 2>&1 || return 1

            # NOTHING BUT THAT ONE FILE MAY HAVE MOVED, and this is where that
            # is CHECKED rather than trusted. A generator that wrote anywhere
            # else is exactly the case where committing "the regeneration"
            # would carry something nobody looked at into $TARGET. An empty set
            # is the ordinary answer on a tree whose counts did not move: the
            # static region carries no clock and no commit, so regenerating it
            # unchanged rewrites the bytes that were already there.
            mapfile -t moved < <(
              {
                git diff --name-only
                git diff --cached --name-only
                git ls-files --others --exclude-standard
              } | sort -u
            )
            case "${#moved[@]}" in
              0) return 0 ;;
              1) [ "${moved[0]}" = "$readme" ] || return 1 ;;
              *) return 1 ;;
            esac

            # THE COUNTS ACTUALLY MOVED. Reaching here with an unchanged data
            # line means the generator rewrote the file without changing what
            # it claims, which is not a state this understands, so it refuses
            # rather than committing a diff it cannot describe.
            after="$(_counts_data "$readme")" || return 1
            [ "$before" != "$after" ] || return 1

            # ONE PATH NAMED EXPLICITLY. `git commit -- <path>` commits that
            # path's working-tree content and nothing else, so even a staged
            # something-else could not ride along.
            git commit -q -m 'Regenerate the static browser-verify counts on the merged tree' -- "$readme" || return 1
            printf '%s -> %s\n' "$before" "$after"
            return 0
          }

          _counts_data() {
            # What the static region CLAIMS, as one short string: the numbers on
            # its own `counts:static:data` line. Exactly one such line or this
            # refuses -- a merge that duplicated the region would otherwise make
            # "the counts" ambiguous, and the ambiguous answer is the one that
            # must not be reported.
            local line
            line="$(grep -F '<!-- counts:static:data ' "$1")" || return 1
            [ "$(printf '%s\n' "$line" | grep -c .)" = 1 ] || return 1
            printf '%s' "$line" | sed -e 's/.*<!-- counts:static:data //' -e 's/ -->[[:space:]]*$//'
          }
          # counts_refresh_marker:end

          # THE SUITE, ON THE TREE THAT WAS ACTUALLY PUSHED. This is the half
          # `counts_refresh` does not cover and could not: it repairs ONE
          # generated region, and the shape it repairs is general.
          #
          # A CHECK THAT RELATES TWO FILES IS DEFEATED BY TWO BRANCHES EACH
          # TOUCHING ONE OF THEM, and neither branch can see it. Measured, not
          # argued: `74be202` added `tools/gauntlet-doc-check.mjs`, which
          # requires every GAUNTLET migration to have a row in
          # `docs/GAUNTLET.md`; `7d848d7`, its sibling off merge base
          # `fdf8c68`, added `0184_gauntlet_run_event_bounds.sql` and touched
          # no document. Each tree is green on its own -- re-run in this
          # container on 2026-09-06, exit 0 on the first, the checker does not
          # exist on the second. The files are disjoint, so git merged them
          # with no conflict, and the merge `5877f19` is red. Nothing on either
          # branch could have caught it and nothing looked at the merge.
          #
          # AFTER THE PUSH AND AFTER THE DELETES, WHICH IS THE WHOLE OF WHERE
          # IT MAY GO. `npm ci` and a three-minute suite are the two longest
          # things this job does and the two most able to end it from outside
          # -- an out-of-memory kill, a runner eviction, the six-hour job cap.
          # Run BEFORE the push, any of those discards every merge in the
          # sweep, each of which was individually fine. Run after, the merges
          # are on the remote before this function is entered and nothing it
          # can do reaches them. That is the same rule `counts_refresh` states
          # for itself -- a failure here is never a lost merge -- taken to the
          # one step big enough to lose the job rather than the step.
          #
          # SO A RED TREE IS PUSHED, DELIBERATELY. The alternative is throwing
          # away several good merges to avoid recording one bad interaction,
          # which leaves the branches outstanding, the target behind `main`,
          # and nobody told. A red `integration` is information a person needs;
          # it is not a reason to lose work. What changes is that the run goes
          # RED and the summary NAMES the assertions.
          #
          # WHY THE WHOLE SUITE AND NOT THE CROSS-FILE CHECKS ALONE. A subset
          # would have to be a list, the list would be the same kind of
          # two-file agreement it is meant to police, and it lets through every
          # merge-only failure that is not one of the listed checks -- two
          # branches editing one function's callers, a rename against a new
          # call site. Measured on the runner that found `5877f19`: the suite
          # is 174.50s over 287 files, and `npm ci` here is 15s. Against a
          # window this reconstruction measured in HOURS, four minutes on a
          # serialized job is not the expensive side of the trade.
          #
          # ONCE, ON THE FINAL TREE, for `counts_refresh`'s own reason: the
          # only tree whose answer matters is the one that gets pushed, and
          # per-merge would be O(branches) suites to learn something the
          # summary's merge list already narrows.
          #
          # IT IS A FUNCTION AND BETWEEN MARKERS for the reason the four gates
          # above are: it is PROVED by cutting this exact text out of THIS FILE
          # and running it against throwaway repositories with a stub `npm` on
          # PATH, so no proof can drift into testing a private copy. Do not
          # rename the markers and do not move the body out from between them.
          # merged_suite_marker:begin
          merged_suite() {
            # Called with the merged tree checked out and already pushed.
            # Prints a VERDICT on its first line and, when the suite ran and
            # failed, one failing assertion per line after it. Returns
            #   0  the suite ran and passed
            #   1  the suite ran and reported failures
            #   2  the suite could not be run at all
            # and never exits, so no caller can lose a merge to it.
            local log rc=0 plain findings summary
            log="$(mktemp)"

            # THE INSTALL IS PART OF "COULD IT RUN", not a separate concern: a
            # lockfile two branches both touched is exactly the kind of merge
            # this exists to look at, and it fails here rather than looking
            # like a test failure. `npm ci` never writes package-lock.json, so
            # it cannot dirty the tree that was pushed.
            if ! npm ci >"$log" 2>&1; then
              printf 'unrun could not install dependencies on the merged tree (npm ci failed)\n'
              tail -n 40 "$log" >&2
              rm -f "$log"
              return 2
            fi

            # `npm test`, NEVER `vitest` DIRECTLY, and `tools/run-tests.mjs`'s
            # own header is the reason: importing `embedded-postgres` registers
            # a `beforeExit` handler that calls `process.exit(0)`, so vitest's
            # exit code reports success however many tests failed. That wrapper
            # reads vitest's JSON report instead -- and then DELETES it, which
            # is why the findings below are parsed out of the printed output
            # rather than read from a file.
            # THE OUTPUT GOES TO THE LOG AND THEN TO STDERR, NEVER THROUGH
            # STDOUT, and that is not tidiness. This function's stdout IS its
            # verdict -- the caller reads it through `$(merged_suite)` -- so a
            # `tee` to stdout puts several hundred lines of reporter output
            # ahead of the verdict line and the caller reads an empty verdict
            # and treats a red tree as skipped. `tools/integrate-gate-proof.sh`
            # case 61 caught exactly that on the first run of this function.
            # Stderr reaches the step log and nothing else.
            npm test >"$log" 2>&1 || rc=$?
            cat "$log" >&2

            # THE DEFAULT REPORTER COLOURS ITS OUTPUT ON A RUNNER AND NOT IN A
            # PIPE, so the escape between the space and the F is enough to make
            # a `grep '^ FAIL '` match nothing locally-verified and nothing at
            # all in CI. Strip first, match after.
            plain="$(sed -e 's/\x1b\[[0-9;]*m//g' "$log")"
            findings="$(printf '%s\n' "$plain" | grep -E '^[[:space:]]*FAIL[[:space:]]' | sed -e 's/^[[:space:]]*FAIL[[:space:]]*//' -e 's/[[:space:]]*$//' | sort -u || true)"
            summary="$(printf '%s\n' "$plain" | grep -E '^[[:space:]]*Tests[[:space:]]+[0-9]' | tail -n 1 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' || true)"
            rm -f "$log"

            if [ "$rc" -eq 0 ]; then
              printf 'green %s\n' "${summary:-the suite reported no failures}"
              return 0
            fi

            # NON-ZERO WITH NOTHING TO NAME IS `unrun`, NOT `red`, and the
            # distinction is the one a reader needs: a suite that never got to
            # a test body is a broken runner or a broken checkout, and
            # reporting it as a test failure sends somebody to read a diff that
            # has nothing wrong with it.
            if [ -z "$findings" ]; then
              printf 'unrun the suite exited %s without naming a failing test\n' "$rc"
              return 2
            fi

            printf 'red %s\n' "${summary:-the suite reported failures}"
            printf '%s\n' "$findings"
            return 1
          }

          run_is_red() {
            # THE WHOLE EXIT DECISION, IN ONE PLACE AND UNDER THE MARKERS, so
            # the proof harness drives the real rule instead of a second copy
            # of it. $1 is the number of conflicted branches, $2 the suite
            # verdict. Returns 0 when this run must go red.
            #
            # TWO INDEPENDENT CAUSES, AND NEITHER SHORT-CIRCUITS THE OTHER'S
            # REPORT: the ::error:: lines are emitted at the two places that
            # know their own cause, and this only decides the status. A run
            # that merged four branches into a tree that fails the suite while
            # a fifth conflicted is red for both, and says both.
            if [ "${1:-0}" -gt 0 ]; then return 0; fi
            case "${2:-skipped}" in
              red|unrun) return 0 ;;
            esac
            return 1
          }
          # merged_suite_marker:end

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          if git rev-parse --verify --quiet "refs/remotes/origin/$TARGET" >/dev/null; then
            git checkout -B "$TARGET" "origin/$TARGET"
            # THE TIP THE REMOTE ALREADY HAS, captured before anything moves.
            # The push below asks "did $TARGET move at all", which is this
            # value against HEAD at the end -- so it is read once, here, from
            # the remote-tracking ref rather than recomputed later from a HEAD
            # that has by then absorbed the whole sweep.
            remote_tip="$(git rev-parse "origin/$TARGET")"
          else
            echo "::notice::$TARGET does not exist; creating it from origin/main"
            git checkout -B "$TARGET" origin/main
            # EMPTY, AND DELIBERATELY NOT origin/main's SHA. A branch that does
            # not exist on the remote must be created even when this run merges
            # nothing into it, and an empty string cannot compare equal to a
            # sha, so the comparison below reaches the push on its own.
            remote_tip=
          fi

          # MAIN FIRST, EVERY TIME. `main` moves on its own all day (the
          # classroom GitHub export commits under `materials/` on every item
          # save), so integrating onto a stale base is how a branch that merges
          # cleanly today conflicts next week.
          #
          # AND WHAT IT PRODUCES IS PUSHED WHETHER OR NOT ANY BRANCH MERGES.
          # That is a DEADLOCK FIX and not a refinement. This step used to push
          # only `if [ ${#merged[@]} -gt 0 ]`, so on a run where every
          # outstanding branch conflicted the main-merge was computed on this
          # runner's disk and thrown away -- every run, forever. Meanwhile
          # `deploy.yml` refuses to deploy while $TARGET is behind `main` and
          # tells the operator to press Integrate first. Migrations commit
          # straight to `main` by design and the classroom export commits there
          # unattended, so the gap re-opens constantly; branches conflict
          # routinely while several lanes run. Integrate-then-Deploy in that
          # state could not terminate. It was pressed three times on 2026-09-03
          # and a person broke out by merging `main` into `integration` through
          # a pull request by hand.
          #
          # The two things this has to do at once are NOT in tension, and the
          # old code made them look like they were: catching $TARGET up to
          # `main` is mechanical and always safe to land, while a conflicted
          # branch is a person's problem and must stay loud. So the push
          # condition becomes "did the target move", and the exit code below is
          # left exactly as it was.
          target_start="$(git rev-parse HEAD)"
          behind="$(git rev-list --count HEAD..origin/main)"
          if ! git merge --no-edit origin/main; then
            # A MAIN-MERGE CONFLICT STILL PUSHES NOTHING, and that is the state
            # the "push whenever the target moved" rule must not swallow: the
            # abort restores HEAD to `target_start`, and this exit is taken
            # before the comparison is ever reached, so a half-resolved tree
            # cannot become $TARGET on the remote.
            git merge --abort || true
            echo "::error::$TARGET conflicts with main. Resolve it on $TARGET by hand; nothing was merged, pushed or deleted."
            exit 1
          fi

          # MEASURED, NOT INFERRED FROM `behind`. The merge either moved HEAD or
          # it did not, and reading that back is one command; deriving it from a
          # count taken beforehand is a second idea of the same fact.
          caught_up=no
          if [ "$(git rev-parse HEAD)" != "$target_start" ]; then
            caught_up=yes
          fi

          # THE CROSS-BRANCH TABLE, READ ONCE, BEFORE ANY BRANCH IS TOUCHED.
          # See `cross_branch_gate` above for what it is and why it fails toward
          # merging. Read HERE rather than inside the loop for one reason: the
          # question is about the WHOLE SET of outstanding branches, so asking
          # it per branch would be the same answer computed N times -- and it
          # would change under the loop's own merges, so a branch swept early
          # would be judged against a different set from one swept late.
          #
          # EACH HALF FAILS ON ITS OWN. A migration read that cannot answer must
          # not take the version read down with it, and neither may take the
          # sweep down: both are reported in the summary and both leave their
          # half of the table empty.
          cross_rows=''
          cross_note=''
          if cross_numbers="$(contested_number_rows)"; then
            [ -z "$cross_numbers" ] || cross_rows+="$cross_numbers"$'\n'
          else
            cross_note+="the migration-number read did not answer (\`node tools/migration-claims.mjs --contested-branches\` failed), so no branch was held for a contested number this run. "
          fi
          if cross_versions="$(contested_version_rows)"; then
            [ -z "$cross_versions" ] || cross_rows+="$cross_versions"$'\n'
          else
            cross_note+="the standards-version read did not answer, so no branch was held for a contested version this run. "
          fi

          merged=()
          merged_shas=()
          conflicted=()
          resolved=()
          skipped=()
          contained=()
          contained_shas=()
          contained_why=()

          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin); do
            branch="${ref#origin/}"
            case " $AGENT_BRANCH_PREFIXES " in
              *" ${branch%%/*}/ "*) ;;
              *) continue ;;
            esac

            sha="$(git rev-parse "$ref")"

            # THE TWO "LEAVE IT ALONE" QUESTIONS ARE ASKED FIRST NOW, AHEAD OF
            # THE CONTAINMENT QUESTION, AND THE REORDER IS THE PRICE OF THE
            # DELETE BELOW.
            #
            # Containment used to be asked first, which was free while its only
            # outcome was a skip. It is not free now that its outcome can be a
            # DELETE: asked first, a branch whose CI is red and whose tip
            # happens to be contained would have been deleted without its CI
            # conclusion ever being read, and a red branch is a signal that this
            # system must not destroy. Same for a session still running. So the
            # order is: is anything holding this branch, and only then, what
            # should be done with it.
            #
            # The cost is one Actions API call per contained branch per run,
            # which was previously skipped. That is a handful of calls on a
            # sweep, against the alternative of a delete path that can act on a
            # branch nobody has checked.
            #
            # ONLY ON GREEN, per branch and per COMMIT: the newest completed CI
            # run for this branch must be for the exact tip we are about to
            # merge. A branch that was green two commits ago is not green.
            #
            # NO `-f event=` FILTER. See `ci_conclusion` above for the whole
            # argument; the short version is that a green run counts however it
            # was triggered, and asking only for `push` runs made three green
            # branches invisible on 2026-09-04. `per_page` is 50 rather than 30
            # because the window now has to hold a branch's runs from every
            # trigger, not just its pushes.
            runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/$CI_WORKFLOW_FILE/runs" \
                      -f branch="$branch" -f status=completed -f per_page=50 \
                      2>/dev/null || echo '{"workflow_runs":[]}')"
            conclusion="$(ci_conclusion "$runs" "$sha" "$GITHUB_REPOSITORY")"

            if [ "$conclusion" != success ]; then
              skipped+=("$branch -- CI on ${sha:0:7} is $conclusion")
              continue
            fi

            # STILL RUNNING? Leave it alone. See `ledger_gate` above for the
            # failure this exists for. It sits AFTER the CI check for reading
            # order rather than precedence -- the two are independent, and a
            # branch that is both red and running is more usefully reported as
            # red -- and its reason goes into the same `skipped` array as every
            # other one, so it lands in the job summary under "Left alone".
            if ledger_reason="$(ledger_gate "$ref")"; then
              skipped+=("$branch -- $ledger_reason")
              continue
            fi

            # A NUMBER OR A VERSION ANOTHER UNMERGED BRANCH ALSO HOLDS? Leave it
            # alone, and the other side is left alone by the same table on its
            # own pass. `cross_branch_gate` above carries the whole argument.
            #
            # HERE, AFTER `ledger_gate` AND BEFORE THE CONTAINMENT CHECK, which
            # is where prompt 0084 specified it and is right for a reason worth
            # writing down: a branch already contained in $TARGET has had its
            # number LANDED (`origin/integration` is a landed ref to the claims
            # tool, so it stops being a holder), and a version it already merged
            # is byte-identical on both sides, so neither producer can name a
            # contained branch anyway. Ahead of containment, a branch that IS
            # somehow named is left standing rather than deleted, which is the
            # direction every surprise in this loop goes.
            if cross_reason="$(cross_branch_gate "$branch" "$cross_rows")"; then
              skipped+=("$branch -- $cross_reason")
              continue
            fi

            # IDEMPOTENT. A branch whose commits are already in $TARGET is a
            # no-op and not an error -- a re-run, a CI re-run, or a
            # workflow_dispatch sweep all land here.
            #
            # IT IS ALSO THE ONE SKIP THAT NOW DELETES, and by the time control
            # reaches this line the branch is green and its session has
            # finished. `contained_delete_gate` above carries the argument and
            # the three refs it refuses; when it declines -- the branch is
            # protected, or its containment holds only in this runner's unpushed
            # HEAD -- the skip reads exactly as it always did.
            if git merge-base --is-ancestor "$ref" HEAD; then
              if contained_why_one="$(contained_delete_gate "$branch" "$sha" "$TARGET")"; then
                contained+=("$branch")
                contained_shas+=("$sha")
                contained_why+=("$contained_why_one")
              else
                skipped+=("$branch -- already in $TARGET")
              fi
              continue
            fi

            # --no-ff so a bundle reverts as one commit, which is the repo's
            # own merge convention.
            if git merge --no-ff --no-edit -m "Merge $branch into $TARGET" "$ref"; then
              merged+=("$branch")
              merged_shas+=("$sha")
            elif resolved_lines="$(auto_resolve "$branch")" &&
                 git commit -m "Merge $branch into $TARGET"; then
              # MECHANICAL, AND ONLY EVER THE TWO FILES ARGUED AT
              # `auto_resolve`. It either resolved every unmerged path or it
              # changed nothing, so reaching here means git's own merge plus a
              # generated region regenerated on the merged tree -- never a side
              # of a file picked by a machine.
              merged+=("$branch")
              merged_shas+=("$sha")
              while IFS= read -r resolved_one; do
                [ -n "$resolved_one" ] || continue
                resolved+=("$branch -- $resolved_one")
              done <<<"$resolved_lines"
            else
              # FAIL LOUD, NEVER FORCE. A conflict that reaches here is two
              # bundles genuinely touching one file, which is exactly the thing
              # a machine must not resolve by picking a side. Abandon this one
              # branch, leave it undeleted and unmerged, keep going with the
              # others (they are independent), and fail the job at the end so a
              # person sees it.
              #
              # THE ABORT IS WHAT MAKES A PARTIAL RESOLUTION SAFE: `auto_resolve`
              # can have written one file before refusing on the next, and this
              # puts the whole tree back where the merge found it.
              git merge --abort || true
              conflicted+=("$branch")
            fi
          done

          # THE STATIC COUNTS REGION, ONCE, ON THE FINAL TREE. See
          # `counts_refresh` above for the gap this closes and why it is here
          # rather than inside the loop.
          #
          # GATED ON THE TREE HAVING MOVED, which is exactly the two ways it
          # can: a branch merge, or the main catch-up. Those are also the two
          # ways a spec file can arrive. A run that merged nothing and caught
          # nothing up has nothing to push, and repairing staleness this run did
          # not cause is a different job with a different argument -- the daily
          # scheduled CI run against `integration` is what reports that one.
          #
          # A FAILURE HERE IS NOT A LOST MERGE. It is a warning and a summary
          # line; the push below runs either way.
          counts_note=''
          counts_failed=no
          if [ ${#merged[@]} -gt 0 ] || [ "$caught_up" = yes ]; then
            if counts_note="$(counts_refresh)"; then
              if [ -n "$counts_note" ]; then
                echo "::notice::static counts regenerated on the merged tree: $counts_note"
              fi
            else
              counts_note=''
              counts_failed=yes
              echo "::warning::the static counts region could not be regenerated on the merged tree. Everything that merged is still being pushed and nothing was lost; the region is left as it was, and running 'npm run verify:counts' on $TARGET and committing the result is what fixes it."
            fi
          fi

          # THE TARGET MOVED AT ALL -- the main-merge above, a branch merge in
          # the loop, or both. NOT "a branch merged", which is the condition
          # this replaces and the whole of the deadlock argued at the
          # main-merge above.
          #
          # It subsumes the old condition rather than widening past it: a
          # non-empty `merged` means at least one `--no-ff` merge commit, so
          # HEAD is necessarily different and every run that used to push still
          # pushes. What is new is the run that merged nothing and caught the
          # target up, which used to discard its own work.
          pushed=no
          if target_push_gate "${remote_tip:-}" "$(git rev-parse HEAD)"; then
            # NEVER --force, and no retry on rejection. A rejected push means
            # $TARGET moved under us; the honest response is to do nothing and
            # let the next run redo the whole sweep from the new tip. Nothing
            # has been deleted at this point, so nothing is lost.
            if git push origin "HEAD:refs/heads/$TARGET"; then
              pushed=yes
            else
              echo "::error::push to $TARGET was rejected -- it moved during this run. Nothing was deleted; the next run will redo this sweep."
              exit 1
            fi
          fi

          # ONE DELETE LIST, ONE LEASE, TWO REASONS FOR BEING ON IT. There is
          # exactly one `git push --delete` in this file and there must stay
          # exactly one: two loops would be two spellings of the lease, the
          # warning and the "what is safe to remove" rule, and
          # `tests/workflows.test.ts` pins the file's push shape precisely so a
          # second one cannot arrive unnoticed.
          #
          # WHAT DIFFERS IS WHEN A BRANCH JOINS THE LIST, and that is the whole
          # of the difference between the two reasons:
          #
          #   * MERGED THIS RUN -- only if the push above SUCCEEDED. Until
          #     $TARGET is pushed the merge exists on this runner's disk and
          #     nowhere else, so a branch deleted before then is work that
          #     existed and does not.
          #   * ALREADY CONTAINED -- unconditionally, because
          #     `contained_delete_gate` established containment against a ref
          #     that was ALREADY on the remote before this job started. Gating
          #     these on `pushed` would mean a sweep that merged nothing -- the
          #     ordinary re-run, and exactly the run on which a stale ref is
          #     noticed -- deleted nothing either.
          #
          # The lease pins the tip this run measured: if the session pushed
          # another commit while the job was running, the delete is refused and
          # the branch survives with that commit on it. A refusal is a warning
          # and never a job failure.
          delete_names=()
          delete_shas=()
          delete_why=()
          if [ "$pushed" = yes ]; then
            i=0
            while [ "$i" -lt ${#merged[@]} ]; do
              delete_names+=("${merged[$i]}")
              delete_shas+=("${merged_shas[$i]}")
              delete_why+=("merged")
              i=$((i + 1))
            done
          fi
          i=0
          while [ "$i" -lt ${#contained[@]} ]; do
            delete_names+=("${contained[$i]}")
            delete_shas+=("${contained_shas[$i]}")
            delete_why+=("${contained_why[$i]}")
            i=$((i + 1))
          done

          deleted_contained=()
          i=0
          while [ "$i" -lt ${#delete_names[@]} ]; do
            b="${delete_names[$i]}"
            s="${delete_shas[$i]}"
            w="${delete_why[$i]}"
            if git push origin --force-with-lease="refs/heads/$b:$s" ":refs/heads/$b"; then
              if [ "$w" != merged ]; then deleted_contained+=("$b -- $w"); fi
            elif [ "$w" = merged ]; then
              echo "::warning::merged $b but could not delete it (it moved, or was already gone). Its work is in $TARGET; the branch is harmless."
            else
              echo "::warning::$b is $w but could not be deleted (it moved, or was already gone). Nothing is lost; the next run will try again."
              skipped+=("$b -- $w, but the delete was refused (it moved, or was already gone)")
            fi
            i=$((i + 1))
          done

          # THE SUITE ON THE MERGED TREE. See `merged_suite` above for why it
          # sits HERE -- after the push and after the deletes -- rather than
          # anywhere earlier: everything this sweep merged is already on the
          # remote, so nothing this call does, including being killed outright,
          # can cost a merge.
          #
          # GATED ON THE TREE HAVING MOVED, the same condition `counts_refresh`
          # uses and for the same reason: a run that merged nothing and caught
          # nothing up is looking at a tree the previous run already looked at,
          # and re-reporting somebody else's redness as this run's is how a
          # summary stops being read.
          suite_verdict=skipped
          suite_summary=''
          suite_findings=()
          if [ ${#merged[@]} -gt 0 ] || [ "$caught_up" = yes ]; then
            suite_rc=0
            suite_out="$(merged_suite)" || suite_rc=$?
            suite_verdict="$(printf '%s' "$suite_out" | head -n 1 | cut -d' ' -f1)"
            suite_summary="$(printf '%s' "$suite_out" | head -n 1 | cut -d' ' -f2-)"
            mapfile -t suite_findings < <(printf '%s\n' "$suite_out" | tail -n +2)
            case "$suite_rc" in
              0) echo "::notice::the merged tree passes the suite -- $suite_summary" ;;
              1) echo "::error::the merged tree FAILS the suite -- $suite_summary. Every merge above was still pushed and nothing was lost. The failing assertions are named in the job summary." ;;
              *) echo "::error::the suite could not be run on the merged tree -- $suite_summary. Every merge above was still pushed and nothing was lost." ;;
            esac
          fi

          {
            echo "## Integration sweep"
            echo
            echo "Triggered by: \`${TRIGGER_BRANCH:-workflow_dispatch}\`"
            echo

            # WHAT HAPPENED TO THE TARGET ITSELF, SAID FIRST AND IN WORDS.
            # This section is new with the deadlock fix and it exists because
            # the summary is what a person reads at 7am: a run can now be RED
            # for a conflicted branch while having successfully caught
            # `integration` up to `main`, and those two facts used to be
            # indistinguishable from outside. Every combination the job can
            # reach says which one it is, on its own line.
            echo "### \`$TARGET\` itself"
            echo
            if [ "$caught_up" = yes ]; then
              echo "- **Caught up to \`main\`** -- $behind commit(s) were on \`main\` and not on \`$TARGET\`, and are now on it."
            else
              echo "- Already current with \`main\` -- nothing to bring across."
            fi
            if [ "$pushed" = yes ]; then
              echo "- **Pushed.** \`$TARGET\` on the remote is now \`$(git rev-parse --short HEAD)\`."
            else
              echo "- Nothing pushed -- \`$TARGET\` did not move this run."
            fi
            # THE STATIC COUNTS REGION, SAID ON ITS OWN LINE AND IN NUMBERS.
            # "Regenerated" with no figures is the sentence a reader has to go
            # and check; the before and after are what make it readable at 7am.
            # The silent case is deliberate: on a run that merged nothing there
            # is nothing to say about a region nobody touched.
            if [ "$counts_failed" = yes ]; then
              echo "- **The static counts region was NOT regenerated** -- the attempt failed. Everything that merged was still pushed and nothing was lost. Run \`npm run verify:counts\` on \`$TARGET\` and commit the result."
            elif [ -n "$counts_note" ]; then
              echo "- **Static counts regenerated** on the merged tree -- was \`${counts_note%% -> *}\`, now \`${counts_note##* -> }\`."
            elif [ ${#merged[@]} -gt 0 ] || [ "$caught_up" = yes ]; then
              echo "- Static counts unchanged -- the region was already the merged tree's own answer, so nothing was committed."
            fi
            # A CROSS-BRANCH READ THAT DID NOT ANSWER, SAID OUT LOUD. This
            # gate fails toward merging, so its failure is INVISIBLE in every
            # other line of this summary -- the run reads exactly like one where
            # nothing was contested. Silence here is how a broken tool becomes a
            # gate nobody knows stopped running.
            if [ -n "$cross_note" ]; then
              echo "- **A cross-branch check did not answer** -- ${cross_note% }. Every branch was swept exactly as it would have been without it, deliberately: this gate can only ever ADD a skip, so a broken read must never stall the queue."
            fi
            # THE MERGED TREE'S OWN VERDICT, AND THE FAILING ASSERTIONS BY
            # NAME. Four bundles have each spent part of an audit establishing
            # that a red `integration` was inherited rather than theirs; a
            # summary that says which assertions the merge broke is what ends
            # that, and it is the reason this step exists at all rather than
            # only the exit code.
            case "$suite_verdict" in
              green)
                echo "- **The merged tree passes the suite** -- $suite_summary."
                ;;
              red)
                echo "- **The merged tree FAILS the suite** -- $suite_summary. Everything above was still pushed and nothing was lost; a red merged tree is information, not a reason to discard merges that were each individually green."
                ;;
              unrun)
                echo "- **The suite could not be run on the merged tree** -- $suite_summary. Everything above was still pushed and nothing was lost. This is NOT a test failure: nothing got as far as a test body, so read the step log for the install or the runner rather than the diff."
                ;;
              *)
                echo "- The suite was not run -- \`$TARGET\` did not move this run, so the tree is the one the previous run already reported on."
                ;;
            esac
            if [ ${#conflicted[@]} -gt 0 ]; then
              if [ "$pushed" = yes ]; then
                echo "- ${#conflicted[@]} branch(es) conflicted, so **this run is red for that reason and no other**. Everything above still landed, and \`deploy.yml\` is no longer blocked by \`$TARGET\` being behind \`main\`."
              else
                echo "- ${#conflicted[@]} branch(es) conflicted, and there was nothing else to do, so **nothing changed this run**."
              fi
            fi
            echo
            if [ ${#merged[@]} -gt 0 ]; then
              echo "### Merged into \`$TARGET\` and deleted"
              for b in "${merged[@]}"; do echo "- \`$b\`"; done
            else
              echo "### Merged into \`$TARGET\`"
              echo "- nothing (no branch was both green and outstanding)"
            fi
            echo
            if [ ${#suite_findings[@]} -gt 0 ]; then
              echo "### The merged tree's failing assertions"
              echo
              echo "These are the suite's own \`FAIL\` lines on the tree that was just pushed, as"
              echo "\`<file> > <suite> > <test>\`. NEITHER PARENT OF A MERGE NEED HAVE BEEN RED for"
              echo "one of these to appear: any check that relates two files is defeated by two"
              echo "branches each touching one of them, and the merge is the first tree on which"
              echo "both edits exist."
              echo
              for f in "${suite_findings[@]}"; do echo "- \`$f\`"; done
              echo
            fi
            if [ ${#resolved[@]} -gt 0 ]; then
              echo "### Resolved mechanically"
              echo
              echo "These branches conflicted and were merged anyway, because every conflicting"
              echo "path was one of the two files with a deterministic answer. Nothing here"
              echo "picked a side of anybody's writing; a conflict in any other path, or in this"
              echo "README's prose, is still left for a person."
              echo
              for b in "${resolved[@]}"; do echo "- \`${b%% --*}\`: ${b#* -- }"; done
              echo
            fi
            if [ ${#deleted_contained[@]} -gt 0 ]; then
              echo "### Already contained, deleted"
              echo
              echo "Nothing was merged for these: every commit was already reachable from a branch on the remote, so the ref held nothing a delete could take away."
              for b in "${deleted_contained[@]}"; do echo "- \`${b%% --*}\` -- ${b#* -- }"; done
              echo
            fi
            if [ ${#conflicted[@]} -gt 0 ]; then
              echo "### CONFLICTED -- a person is needed"
              for b in "${conflicted[@]}"; do echo "- \`$b\` still exists and was not merged"; done
              echo
              echo "Resolve on the branch: \`git fetch origin && git checkout <branch> && git merge origin/$TARGET\`, push, and this workflow picks it up on the next green CI run (or press Run workflow)."
              echo
            fi
            if [ ${#skipped[@]} -gt 0 ]; then
              echo "### Left alone"
              for b in "${skipped[@]}"; do echo "- $b"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # THE EXIT CODE IS RED FOR TWO REASONS NOW, AND THEY ARE INDEPENDENT.
          # A conflicted branch is a normal steady state when several lanes run
          # at once -- it is two bundles genuinely touching one file, which no
          # machine may resolve -- but it is also an outcome that NEEDS a
          # person, and a green run is a run nobody opens. A merged tree that
          # fails the suite is the second: it is not a reason to have refused
          # the merges, which is why they are pushed above, but it is precisely
          # the thing nothing in this pipeline used to say out loud. Nothing
          # downstream reads this conclusion: the only `workflow_run` trigger in
          # this repo watches `CI`, and `deploy.yml` is `workflow_dispatch` and
          # decides from git state (is `main` an ancestor of `integration`),
          # never from whether this job passed. So the exit code costs a red
          # mark and buys the notification, and the summary above is what says
          # which of the two it is and that the target itself was still pushed.
          #
          # BOTH ARE REPORTED, NEVER JUST THE FIRST. A sweep can perfectly well
          # merge four branches into a tree that fails the suite while a fifth
          # branch conflicts, and a run that named only one of those would send
          # the next person looking for one cause.
          if [ ${#conflicted[@]} -gt 0 ]; then
            if [ "$pushed" = yes ]; then
              echo "::error::${#conflicted[@]} branch(es) conflicted with $TARGET and were left untouched. $TARGET ITSELF WAS PUSHED and is not blocked -- this run is red for that reason as well as for anything the suite found. See the job summary."
            else
              echo "::error::${#conflicted[@]} branch(es) conflicted with $TARGET and were left untouched. $TARGET did not move this run. See the job summary."
            fi
          fi
          if run_is_red "${#conflicted[@]}" "$suite_verdict"; then
            exit 1
          fi
